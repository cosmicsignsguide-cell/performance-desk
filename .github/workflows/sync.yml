# Keeps the dashboard fresh without anyone pressing Sync.
#   every hour       : hourly sync (today and yesterday, ad spend and Shopify), at minute 05
#   once a night     : daily sync at 02:05 IST (restates the last 7 days, refreshes ads and orders)
#                      and the API checks the stored Shopify figures against Shopify
# The repo is public, so Actions minutes are free and unlimited. If it is ever made private again
# this schedule will use up the 2000 free minutes in about two weeks.
# The only secret needed is DESK_SYNC_KEY (the same value as on the desk-api service).
name: desk-sync
on:
  schedule:
    - cron: "5 * * * *"     # every hour at :05
    - cron: "35 20 * * *"   # 02:05 IST, the nightly daily sync
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly, daily, verify or access (client = search text)"
        default: "hourly"
      client:
        description: "optional client id (one client only, short request)"
        default: ""
      days:
        description: "daily mode only: restate this many past days (e.g. 90)"
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Run sync
        env:
          DESK_SYNC_KEY: ${{ secrets.DESK_SYNC_KEY }}
          API: https://desk-api-si2w.onrender.com
          SCHEDULE: ${{ github.event.schedule }}
          MODE_IN: ${{ github.event.inputs.mode }}
          CLIENT_IN: ${{ github.event.inputs.client }}
          DAYS_IN: ${{ github.event.inputs.days }}
        run: |
          if [ -z "$DESK_SYNC_KEY" ]; then echo "DESK_SYNC_KEY secret is not set"; exit 1; fi
          MODE="${MODE_IN:-hourly}"
          if [ "$SCHEDULE" = "35 20 * * *" ]; then MODE=daily; fi
          echo "mode=$MODE"
          # The API may be asleep on the free plan. Wake it first and give it a minute.
          curl -sS --max-time 90 "$API/health" || true
          # A long backfill (days set) can outlast the host's request limit (about 15 min), which
          # answers 502 while the run is still going. Those go to /run, which starts the run in the
          # background and answers 202 at once; the result is in the desk-api logs.
          ROUTE=sync; if [ -n "$DAYS_IN" ]; then ROUTE=run; fi
          code=$(curl -sS -o out.txt -w "%{http_code}" --max-time 8400 -X POST -H "Authorization: Bearer $DESK_SYNC_KEY" "$API/$ROUTE?mode=$MODE${CLIENT_IN:+&client=$CLIENT_IN}${DAYS_IN:+&days=$DAYS_IN}")
          cat out.txt; echo
          # 409 means the same mode is still running from the last tick, which is fine.
          if [ "$code" != "200" ] && [ "$code" != "202" ] && [ "$code" != "409" ]; then echo "sync failed with HTTP $code"; exit 1; fi
