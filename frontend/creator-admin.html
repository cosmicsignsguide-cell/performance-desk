<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Incentive Scorecard · Per4mance Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same system as the main Per4mance Desk dashboard: warm paper ground, one hairline border,
     one soft shadow, coral accent held for action and state only. */
  :root{
    --bg:#FAF9F7; --surface:#FFFFFF; --border:#E8E5E0; --border-strong:#D6D2CB;
    --accent:#F06445; --accent-2:#D94E30; --accent-soft:rgba(240,100,69,0.10);
    --fg:#171717; --fg-muted:#6B6B6B; --dim:#4C4A46;
    --good:#2E8B68; --good-bg:rgba(46,139,104,0.11);
    --warn:#B6761F; --warn-bg:rgba(182,118,31,0.12);
    --bad:#C0392B; --bad-bg:rgba(192,57,43,0.1);
    --gold:#B6761F; --gold-bg:rgba(182,118,31,0.1);
    --radius:14px;
    --lift-1:0 1px 2px rgba(23,23,23,0.04);
    --lift-2:0 1px 2px rgba(23,23,23,0.04),0 8px 20px -14px rgba(23,23,23,0.22);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:15px/1.5 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        -webkit-font-smoothing:antialiased; }
  .disp{ font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif; letter-spacing:-.02em; }
  .wrap{ max-width:900px; margin:0 auto; padding:28px 16px 64px; }
  header{ margin-bottom:20px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header .eyebrow{ font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  header h1{ margin:5px 0 3px; font-size:24px; font-weight:700; font-family:"Bricolage Grotesque",sans-serif; letter-spacing:-.02em; }
  header .sub{ font-size:13px; color:var(--fg-muted); }
  .btn{ padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
        color:var(--fg); font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:border-color .15s ease; }
  .btn:hover{ border-color:var(--border-strong); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--lift-1); }
  .gate{ display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .gate .card{ max-width:380px; width:100%; }
  .gate input{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:15px; margin:10px 0; font-family:inherit; }
  .gate input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .gate .btn{ width:100%; background:var(--accent); color:#fff; border-color:var(--accent); padding:11px; }
  .gate .btn:hover{ background:var(--accent-2); border-color:var(--accent-2); }
  .stat-row{ display:flex; flex-wrap:wrap; margin-bottom:16px; background:var(--surface); border:1px solid var(--border);
             border-radius:var(--radius); overflow:hidden; box-shadow:var(--lift-1); }
  .stat{ flex:1; min-width:140px; padding:15px 16px; border-left:1px solid var(--border); }
  .stat:first-child{ border-left:none; }
  .stat .num{ font-size:25px; font-weight:700; font-family:"Bricolage Grotesque",sans-serif; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .stat .lbl{ font-size:12px; color:var(--fg-muted); margin-top:3px; }
  @media (max-width:560px){ .stat{ flex:1 1 50%; border-left:none; border-top:1px solid var(--border); } .stat:nth-child(1),.stat:nth-child(2){ border-top:none; } }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-muted); font-weight:600;
      padding:10px 10px; border-bottom:1px solid var(--border); }
  td{ padding:12px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  tr:last-child>td{ border-bottom:none; }
  tbody tr:hover>td{ background:rgba(23,23,23,0.015); }
  .rank{ font-weight:800; color:var(--fg-muted); width:26px; font-family:"Bricolage Grotesque",sans-serif; font-size:15px; }
  .rank.r1{ color:var(--gold); } .rank.r2{ color:#8C877F; } .rank.r3{ color:#B07A4A; }
  .name{ font-weight:700; }
  .email{ font-size:12.5px; color:var(--fg-muted); }
  .bar-wrap{ background:var(--border); border-radius:6px; height:6px; width:100%; max-width:140px; overflow:hidden; margin-top:5px; }
  .bar{ height:100%; background:var(--accent); border-radius:6px; }
  .badge{ font-size:10.5px; font-weight:700; letter-spacing:.02em; padding:2px 8px; border-radius:999px; display:inline-block; }
  .badge.good{ background:var(--good-bg); color:var(--good); }
  .badge.warn{ background:var(--warn-bg); color:var(--warn); }
  .empty{ color:var(--fg-muted); font-size:14px; padding:20px 0; text-align:center; line-height:1.6; }
  .err{ color:var(--bad); background:var(--bad-bg); border-radius:9px; padding:9px 11px; font-size:13px; margin-top:8px; }
  .clients-cell{ font-size:12.5px; color:var(--fg-muted); }
  .expand-row td{ background:#FBFAF8; font-size:13px; }
  .ad-line{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px dashed var(--border); }
  .ad-line:last-child{ border-bottom:none; }
  .toggle{ cursor:pointer; color:var(--accent); font-size:12.5px; font-weight:700; }
  .toggle:hover{ color:var(--accent-2); }
  a{ color:var(--accent); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141312; --surface:#1C1B19; --border:#2C2A27; --border-strong:#403D38;
      --fg:#F3F1ED; --fg-muted:#8C877F; --dim:#B9B4AC; --accent:#FF7A5C; --accent-2:#F06445; --accent-soft:rgba(255,122,92,0.14);
      --good:#4FB98C; --good-bg:rgba(79,185,140,0.14); --warn:#D9A44E; --warn-bg:rgba(217,164,78,0.13); --bad:#FF7A5C; --bad-bg:rgba(255,122,92,0.13); --gold:#D9A44E; }
    .expand-row td{ background:#17160f; }
    .gate input{ background:#20201d; border-color:#2C2A27; color:#F3F1ED; }
    tbody tr:hover>td{ background:rgba(255,255,255,0.025); }
  }
  :root[data-theme="dark"]{ --bg:#141312; --surface:#1C1B19; --border:#2C2A27; --border-strong:#403D38;
    --fg:#F3F1ED; --fg-muted:#8C877F; --dim:#B9B4AC; --accent:#FF7A5C; --accent-2:#F06445; --accent-soft:rgba(255,122,92,0.14);
    --good:#4FB98C; --good-bg:rgba(79,185,140,0.14); --warn:#D9A44E; --warn-bg:rgba(217,164,78,0.13); --bad:#FF7A5C; --bad-bg:rgba(255,122,92,0.13); --gold:#D9A44E; }
  :root[data-theme="dark"] .expand-row td{ background:#17160f; }
  :root[data-theme="dark"] .gate input{ background:#20201d; border-color:#2C2A27; color:#F3F1ED; }
  :root[data-theme="dark"] tbody tr:hover>td{ background:rgba(255,255,255,0.025); }
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="card"><p>Loading…</p></div></div></div>
<script src="config.js"></script>
<script>
const CFG = window.DESK_CONFIG || {};
const API = (CFG.syncUrl || '').replace(/\/sync.*$/, '');
const root = document.getElementById('root');
const KEY_STORE = 'desk_creators_admin_key';

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }

function gate(err){
  root.innerHTML = `<div class="gate"><div class="card">
    <div class="eyebrow">Per4mance Guru</div>
    <h1 style="margin:6px 0 10px;font-size:20px">Creative Incentive Scorecard</h1>
    <p style="color:var(--fg-muted);font-size:13.5px">Admin key required.</p>
    <input id="k" type="password" placeholder="Admin key">
    <button class="btn" id="go">View scorecard</button>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
  </div></div>`;
  document.getElementById('go').onclick = () => {
    const k = document.getElementById('k').value.trim();
    if (!k) return;
    localStorage.setItem(KEY_STORE, k);
    load(k);
  };
  document.getElementById('k').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
}

function tierBadge(qty, teamAvgQty){
  if (!teamAvgQty) return '';
  return qty >= teamAvgQty ? '<span class="badge good">Above team avg</span>' : '<span class="badge warn">Below team avg</span>';
}

function render(doc, key){
  if (doc.error) {
    root.innerHTML = `<div class="wrap">
      <header><div><div class="eyebrow">Per4mance Guru</div><h1>Creative Incentive Scorecard</h1></div>
      <button class="btn" id="reset">Change key</button></header>
      <div class="card"><div class="empty">${esc(doc.error)}<br><br>
        This fills in automatically once the team starts pasting their upload codes into live ad names
        (<a href="creator.html" target="_blank">Creator Portal</a>), and refreshes every day on its own.</div></div>
    </div>`;
    document.getElementById('reset').onclick = () => { localStorage.removeItem(KEY_STORE); gate(); };
    return;
  }

  const rows = (doc.creators || []).map((c, i) => {
    const maxQty = Math.max(1, ...doc.creators.map((x) => x.qty));
    const pct = Math.round((c.qty / maxQty) * 100);
    const adsHtml = c.ads.map((a) => `<div class="ad-line">
        <span>${esc(a.clientName)} · ${esc(a.format)}${a.createdInWindow ? '' : ' (from an earlier week, still earning)'}</span>
        <span>${fmtMoney(a.spend)} spend · ${a.ctr != null ? a.ctr.toFixed(2) + '% CTR' : 'not enough reach yet'}</span>
      </div>`).join('');
    const rankCls = i === 0 ? ' r1' : i === 1 ? ' r2' : i === 2 ? ' r3' : '';
    return `<tr>
        <td class="rank${rankCls}">${i + 1}</td>
        <td>
          <div class="name">${esc(c.creatorName)}</div>
          <div class="email">${esc(c.creatorEmail)}</div>
          <div class="clients-cell">${esc(c.clients.join(', '))}</div>
        </td>
        <td>
          ${c.qty}
          <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
        </td>
        <td>${c.effectiveness}${tierBadge(c.qty, doc.teamAvgQty) ? '<br>' + tierBadge(c.qty, doc.teamAvgQty) : ''}</td>
        <td><span class="toggle" data-i="${i}">details</span></td>
      </tr>
      <tr class="expand-row" id="row-${i}" style="display:none"><td colspan="5">${adsHtml || 'No scored ads yet.'}</td></tr>`;
  }).join('');

  root.innerHTML = `<div class="wrap">
    <header>
      <div><div class="eyebrow">Per4mance Guru · Admin</div><h1>Creative Incentive Scorecard</h1>
        <div class="sub">Week ${esc(doc.weekId)} · ${esc(doc.start)} to ${esc(doc.end)} · computed ${new Date(doc.computedAt).toLocaleString('en-IN')}</div></div>
      <div><button class="btn" id="refresh">Refresh</button> <button class="btn" id="reset">Change key</button></div>
    </header>

    <div class="stat-row">
      <div class="stat"><div class="num">${doc.creators?.length || 0}</div><div class="lbl">Creators scored</div></div>
      <div class="stat"><div class="num">${doc.teamAvgQty ?? 0}</div><div class="lbl">Team avg. creatives / week</div></div>
      <div class="stat"><div class="num">${doc.untaggedAdsSeen ?? 0}</div><div class="lbl">Untagged ads this week</div></div>
      <div class="stat"><div class="num">${doc.unresolvedCodes ?? 0}</div><div class="lbl">Unknown codes seen</div></div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      ${doc.creators && doc.creators.length ? `<table>
        <thead><tr><th></th><th>Creator</th><th>Qty this week</th><th>Effectiveness</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty">No creators scored yet this week.<br><br>
        This fills in once someone uploads at <a href="creator.html" target="_blank">the Creator Portal</a> and pastes
        their code into a live ad name. It recomputes automatically every day.</div>`}
    </div>
    <p style="font-size:12.5px;color:var(--fg-muted)">Effectiveness: 100 = performing exactly like that client account's own average CTR this week. No fixed quantity target by design — quantity is shown raw, against the team's own average.</p>
  </div>`;

  root.querySelectorAll('.toggle').forEach((el) => {
    el.onclick = () => { const r = document.getElementById('row-' + el.dataset.i); r.style.display = r.style.display === 'none' ? '' : 'none'; };
  });
  document.getElementById('refresh').onclick = () => load(key);
  document.getElementById('reset').onclick = () => { localStorage.removeItem(KEY_STORE); gate(); };
}

async function load(key){
  root.innerHTML = '<div class="wrap"><div class="card"><div class="empty">Loading…</div></div></div>';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const r = await fetch(API + '/creators?week=current', { headers: { Authorization: 'Bearer ' + key }, signal: ctrl.signal });
    clearTimeout(timer);
    if (r.status === 401 || r.status === 403) { localStorage.removeItem(KEY_STORE); gate('Wrong key.'); return; }
    if (!r.ok) throw new Error(await r.text().catch(() => r.statusText));
    const doc = await r.json();
    render(doc, key);
  } catch (e) {
    clearTimeout(timer);
    const msg = e && e.name === 'AbortError' ? 'Request timed out after 15s. Check your internet connection and try again.' : (e.message || e);
    root.innerHTML = `<div class="wrap"><div class="card"><div class="err">Could not load: ${esc(msg)}</div>
      <button class="btn" id="retry" style="margin-top:10px">Retry</button></div></div>`;
    document.getElementById('retry').onclick = () => load(key);
  }
}

const saved = localStorage.getItem(KEY_STORE);
if (saved) load(saved); else gate();
</script>
</body>
</html>
