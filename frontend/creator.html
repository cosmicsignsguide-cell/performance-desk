<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Portal · Per4mance Guru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same system as the main Per4mance Desk dashboard: warm paper ground, one hairline border,
     one soft shadow, coral accent held for action and state only. */
  :root{
    --bg:#FAF9F7; --surface:#FFFFFF; --border:#E8E5E0; --border-strong:#D6D2CB;
    --accent:#F06445; --accent-2:#D94E30; --accent-ink:#fff; --accent-soft:rgba(240,100,69,0.10);
    --fg:#171717; --fg-muted:#6B6B6B; --dim:#4C4A46;
    --good:#2E8B68; --good-bg:rgba(46,139,104,0.11);
    --warn:#B6761F; --warn-bg:rgba(182,118,31,0.12);
    --bad:#C0392B; --bad-bg:rgba(192,57,43,0.1);
    --radius:14px;
    --lift-1:0 1px 2px rgba(23,23,23,0.04);
    --lift-2:0 1px 2px rgba(23,23,23,0.04),0 8px 20px -14px rgba(23,23,23,0.22);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:15px/1.55 "Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        -webkit-font-smoothing:antialiased; }
  .disp{ font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif; letter-spacing:-.02em; }
  .wrap{ max-width:560px; margin:0 auto; padding:28px 16px 64px; }
  header{ margin-bottom:22px; }
  header .eyebrow{ font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  header h1{ margin:5px 0 3px; font-size:24px; font-weight:700; }
  header .who{ font-size:13px; color:var(--fg-muted); }
  header .who a{ color:var(--dim); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
         padding:20px; margin-bottom:16px; box-shadow:var(--lift-1); }
  label{ display:block; font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--dim); margin:16px 0 6px; }
  label:first-child{ margin-top:0; }
  select, textarea, input[type=file]{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px;
    font-size:15px; font-family:inherit; background:#fff; color:var(--fg); transition:border-color .15s ease;
  }
  select:focus, textarea:focus, input[type=file]:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  textarea{ resize:vertical; min-height:60px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px;
        padding:11px 18px; border-radius:10px; border:1px solid transparent; font-size:15px;
        font-weight:600; cursor:pointer; font-family:inherit; transition:background .15s ease,transform .15s ease,border-color .15s ease; }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); width:100%; margin-top:18px; box-shadow:0 1px 2px rgba(23,23,23,.08); }
  .btn-primary:hover:not(:disabled){ background:var(--accent-2); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--fg); }
  .btn-ghost:hover{ border-color:var(--border-strong); }
  .err{ color:var(--bad); background:var(--bad-bg); border-radius:9px; padding:9px 11px; font-size:13px; margin-top:10px; }
  .code-box{ text-align:center; padding:22px 20px; }
  .code-box .code{ font-family:"Bricolage Grotesque",monospace; font-size:34px; font-weight:800;
                    letter-spacing:.04em; color:var(--accent); margin:6px 0 12px; }
  .code-box .hint{ font-size:13.5px; color:var(--fg-muted); line-height:1.55; }
  .code-box .hint b{ color:var(--fg); }
  .code-box .hint code{ background:var(--accent-soft); color:var(--accent-2); padding:2px 5px; border-radius:5px; font-size:12.5px; }
  h2{ font-size:14.5px; margin:0 0 14px; font-weight:700; letter-spacing:-.01em; }
  .upload-row{ border-top:1px solid var(--border); padding:13px 0; }
  .upload-row:first-of-type{ border-top:none; padding-top:0; }
  .upload-row .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .upload-row .code-sm{ font-family:"Bricolage Grotesque",monospace; font-weight:700; letter-spacing:.02em; }
  .upload-row .meta{ font-size:13px; color:var(--fg-muted); margin-top:3px; }
  .badge{ font-size:11px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.pending{ background:var(--warn-bg); color:var(--warn); }
  .badge.linked{ background:var(--good-bg); color:var(--good); }
  .perf{ margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--fg-muted); }
  .perf b{ display:block; font-size:15.5px; font-weight:700; color:var(--fg); }
  .empty{ color:var(--fg-muted); font-size:13.5px; padding:8px 0; }
  .gate{ display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .gate .card{ max-width:380px; text-align:center; }
  .spin{ opacity:.55; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141312; --surface:#1C1B19; --border:#2C2A27; --border-strong:#403D38;
      --fg:#F3F1ED; --fg-muted:#8C877F; --dim:#B9B4AC; --accent:#FF7A5C; --accent-2:#F06445; --accent-ink:#1A0E0A; --accent-soft:rgba(255,122,92,0.14);
      --good:#4FB98C; --good-bg:rgba(79,185,140,0.14); --warn:#D9A44E; --warn-bg:rgba(217,164,78,0.13); --bad:#FF7A5C; --bad-bg:rgba(255,122,92,0.13); }
    select, textarea, input[type=file]{ background:#20201d; border-color:#2C2A27; color:#F3F1ED; }
  }
  :root[data-theme="dark"]{ --bg:#141312; --surface:#1C1B19; --border:#2C2A27; --border-strong:#403D38;
    --fg:#F3F1ED; --fg-muted:#8C877F; --dim:#B9B4AC; --accent:#FF7A5C; --accent-2:#F06445; --accent-ink:#1A0E0A; --accent-soft:rgba(255,122,92,0.14);
    --good:#4FB98C; --good-bg:rgba(79,185,140,0.14); --warn:#D9A44E; --warn-bg:rgba(217,164,78,0.13); --bad:#FF7A5C; --bad-bg:rgba(255,122,92,0.13); }
  :root[data-theme="dark"] select, :root[data-theme="dark"] textarea, :root[data-theme="dark"] input[type=file]{ background:#20201d; border-color:#2C2A27; color:#F3F1ED; }
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="card"><p class="spin">Loading…</p></div></div></div>
<script src="config.js"></script>
<script>
const CFG = window.DESK_CONFIG || {};
const API = (CFG.syncUrl || '').replace(/\/sync.*$/, '');
const root = document.getElementById('root');
let fb = null, idToken = '', me = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + src)); document.head.appendChild(s); }); }

async function initFirebase(){
  const v = CFG.firebaseVersion || '10.14.1';
  for (const f of ['app', 'auth']) await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-${f}-compat.js`);
  firebase.initializeApp(CFG.firebase);
  fb = { auth: firebase.auth() };
}

function gate(msg, err){
  root.innerHTML = `<div class="gate"><div class="card">
    <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);font-weight:600">Per4mance Guru</div>
    <h1 style="margin:6px 0 10px;font-size:20px">Creator Portal</h1>
    <p style="color:var(--fg-muted);font-size:14px">${esc(msg)}</p>
    <button class="btn btn-primary" id="signin-btn">Sign in with Google</button>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
  </div></div>`;
  document.getElementById('signin-btn').onclick = signIn;
}

async function signIn(){
  const p = new firebase.auth.GoogleAuthProvider();
  try { await fb.auth.signInWithPopup(p); }
  catch (e) { gate('Sign in to upload your creatives and track how they perform.', e.message || String(e)); }
}

async function api(path, opts = {}){
  const r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + idToken } });
  if (!r.ok) throw new Error(await r.text().catch(() => r.statusText));
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(new Error('could not read file'));
    r.readAsDataURL(file);
  });
}

const MAX_FILE_MB = 20;

function fmtMoney(n){ return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }

function renderUploadRow(u){
  const status = u.status === 'linked' ? 'Live' : 'Pending';
  const cls = u.status === 'linked' ? 'linked' : 'pending';
  let perf = '';
  if (u.live) {
    perf = `<div class="perf">
      <div><b>${fmtMoney(u.live.spend)}</b>spend</div>
      <div><b>${(u.live.ctr || 0).toFixed(2)}%</b>CTR</div>
      <div><b>${u.live.purchases || 0}</b>purchases</div>
    </div>`;
  }
  const thumb = u.previewUrl
    ? (u.contentType || '').startsWith('video')
      ? `<video src="${esc(u.previewUrl)}" style="width:100%;border-radius:10px;margin-top:8px;max-height:220px" controls></video>`
      : `<img src="${esc(u.previewUrl)}" style="width:100%;border-radius:10px;margin-top:8px;max-height:220px;object-fit:cover" alt="">`
    : '';
  return `<div class="upload-row">
    <div class="top">
      <div><span class="code-sm">${esc(u.code)}</span></div>
      <span class="badge ${cls}">${status}</span>
    </div>
    <div class="meta">${esc(u.clientName)} · ${esc(u.format)}${u.note ? ' · ' + esc(u.note) : ''}</div>
    ${perf}
    ${thumb}
  </div>`;
}

async function refreshMine(){
  const list = document.getElementById('mine-list');
  try {
    const rows = await api('/creator/mine');
    list.innerHTML = rows.length ? rows.map(renderUploadRow).join('') : '<div class="empty">Nothing uploaded yet.</div>';
  } catch (e) {
    list.innerHTML = `<div class="err">Could not load your uploads (${esc(e.message || e)})</div>`;
  }
}

async function boot(){
  idToken = await me.getIdToken();
  root.innerHTML = `
    <div class="wrap">
      <header>
        <div class="eyebrow">Per4mance Guru</div>
        <h1>Creator Portal</h1>
        <div class="who">Signed in as ${esc(me.email)} · <a href="#" id="signout">sign out</a></div>
      </header>

      <div class="card">
        <h2>Upload a new creative</h2>
        <form id="upload-form">
          <label for="f-client">Client</label>
          <select id="f-client" required></select>

          <label for="f-format">Format</label>
          <select id="f-format">
            <option>Static</option><option>Video</option><option>Reel</option><option>Carousel</option>
          </select>

          <label for="f-file">File (image or video, max ${MAX_FILE_MB}MB)</label>
          <input id="f-file" type="file" accept="image/*,video/*">

          <label for="f-note">Note (optional)</label>
          <textarea id="f-note" placeholder="What is this, in a few words?"></textarea>

          <button class="btn btn-primary" id="f-submit" type="submit">Get my code</button>
          <div class="err" id="f-err" style="display:none"></div>
        </form>
      </div>

      <div class="card" id="result-card" style="display:none"></div>

      <div class="card">
        <h2>My uploads</h2>
        <div id="mine-list"><div class="empty">Loading…</div></div>
      </div>
    </div>`;

  document.getElementById('signout').onclick = (e) => { e.preventDefault(); fb.auth.signOut(); };

  try {
    const clients = await api('/creator/clients');
    const sel = document.getElementById('f-client');
    sel.innerHTML = clients.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  } catch (e) {
    document.getElementById('f-err').style.display = 'block';
    document.getElementById('f-err').textContent = 'Could not load client list: ' + (e.message || e);
  }

  document.getElementById('upload-form').onsubmit = async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('f-err'); errBox.style.display = 'none';
    const btn = document.getElementById('f-submit');
    const fileInput = document.getElementById('f-file');
    const file = fileInput.files[0];
    if (file && file.size > MAX_FILE_MB * 1024 * 1024) {
      errBox.style.display = 'block'; errBox.textContent = `That file is over ${MAX_FILE_MB}MB. Please upload a smaller or compressed version.`;
      return;
    }
    btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const payload = {
        clientId: document.getElementById('f-client').value,
        format: document.getElementById('f-format').value,
        note: document.getElementById('f-note').value,
        creatorName: me.displayName || me.email,
      };
      if (file) { payload.fileName = file.name; payload.contentType = file.type; payload.fileBase64 = await fileToBase64(file); }
      const r = await api('/creator/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const rc = document.getElementById('result-card');
      rc.style.display = 'block';
      rc.innerHTML = `<div class="code-box">
        <div style="font-size:13px;color:var(--fg-muted)">Your code</div>
        <div class="code">${esc(r.code)}</div>
        <button class="btn btn-ghost" id="copy-code">Copy code</button>
        <p class="hint">Paste this as the <b>last</b> part of the ad's name in Meta Ads Manager,
        after the final "|", once it goes live. Example:<br>
        <code>... | Girl Boxers | Reels | 19-09-25 | ${esc(r.code)}</code></p>
      </div>`;
      document.getElementById('copy-code').onclick = () => { navigator.clipboard?.writeText(r.code); };
      document.getElementById('upload-form').reset();
      refreshMine();
    } catch (e) {
      errBox.style.display = 'block'; errBox.textContent = e.message || String(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Get my code';
    }
  };

  refreshMine();
}

(async () => {
  try {
    await initFirebase();
    fb.auth.onAuthStateChanged(async (u) => {
      if (!u) { gate('Sign in to upload your creatives and track how they perform.'); return; }
      me = u;
      try { await boot(); }
      catch (e) { gate('Sign in to upload your creatives and track how they perform.', e.message || String(e)); }
    });
  } catch (e) {
    root.innerHTML = `<div class="gate"><div class="card"><p class="err">Could not load: ${esc(e.message || e)}</p></div></div>`;
  }
})();
</script>
</body>
</html>
