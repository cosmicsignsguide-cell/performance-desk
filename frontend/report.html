<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Performance Statement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Per4mance Guru client statement.
   Deliberately not the internal desk: that one is a dense working screen, this is a document.
   White ground, hairline rules, one column. The display face is the grotesque and the reading
   face is the serif, which is the reverse of the usual pairing and is what makes it read as a
   statement rather than a dashboard. Vermilion is the agency's colour and is spent in two
   places only, so it still means something when it appears. */
:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --wash:#FAF8F5;          /* warm, so the neutrals sit with the vermilion rather than against it */
  --ink:#221F19;           /* softened off near-black: the page reads lighter without losing contrast */
  --ink-2:#5F5849;
  --ink-3:#978E7C;
  --rule:#EFEAE1;
  --rule-2:#DFD8CB;
  --accent:#E04A21;
  --good:#1E6B4A;
  --warn:#96650F;
  --shadow:rgba(34,31,25,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#171614; --wash:#201E1B; --ink:#F6F1E8; --ink-2:#C5BCAD; --ink-3:#948B7D;
    --rule:#302C28; --rule-2:#494139; --accent:#FF6A45; --good:#4CAF85; --warn:#D9A441;
    --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#171614; --wash:#201E1B; --ink:#F6F1E8; --ink-2:#C5BCAD; --ink-3:#948B7D;
  --rule:#302C28; --rule-2:#494139; --accent:#FF6A45; --good:#4CAF85; --warn:#D9A441;
  --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  padding-block:0; padding-left:16px; padding-right:16px;
}
.sheet{max-width:720px;margin:0 auto;padding-block:clamp(28px,6vw,64px) 72px}
h1,h2,h3,.ui,th,.fig,.eyebrow,button,.tabs{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
.fig{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* masthead ------------------------------------------------------------ */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.mark{font-family:Archivo,sans-serif;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.mark i{font-style:normal;color:var(--accent)}
.mast .period{font-family:Archivo,sans-serif;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.title{margin:26px 0 0;font-size:clamp(34px,7vw,52px);line-height:1.04;font-weight:600;letter-spacing:-.022em;text-wrap:balance}
.title small{display:block;font-family:Archivo,sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}

/* the sentence -------------------------------------------------------- */
.hello{margin:24px 0 0;font-size:clamp(18px,3.2vw,21px);line-height:1.4;color:var(--ink-2)}
.verdict{margin:26px 0 0;font-size:clamp(19px,3.4vw,23px);line-height:1.5;max-width:60ch}
.hello + .verdict{margin-top:10px}
.verdict b{font-weight:600}
.verdict .hi{color:var(--accent);font-weight:600}
.stamp{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:5px 11px 5px 9px;
  border:1px solid var(--rule-2);border-radius:2px;font-family:Archivo,sans-serif;font-size:11.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--accent)}

/* period tabs --------------------------------------------------------- */
.tabs{display:flex;gap:2px;margin:34px 0 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tabs button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:9px 13px 8px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);cursor:pointer;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* kpi cards ----------------------------------------------------------- */
/* Separated cards on the page's own ground, rather than cells cut out of one ruled block. The
   softer treatment is kept to this row and the two counting panels; the statement table and the
   top-five lists stay on hairlines, so the page still has a hierarchy instead of one flat texture. */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:12px;
  padding:17px 16px 15px;min-width:0;overflow:hidden;
  box-shadow:0 1px 2px var(--shadow), 0 10px 24px -16px var(--shadow)}
/* Two lines' worth of space is reserved whatever the label says, so a label that wraps
   ("Return on ad spend") does not push its number below the numbers beside it. */
.kpi .k{font-family:Archivo,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.35;min-height:2.7em}
.kpi .n{font-family:Archivo,sans-serif;font-size:clamp(21px,4vw,27px);font-weight:800;letter-spacing:-.025em;
  margin-top:9px;font-variant-numeric:tabular-nums;line-height:1.05;word-break:keep-all;white-space:nowrap}
.kpi .s{font-family:Archivo,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.03em;color:var(--ink-3);margin-top:6px}
.kpi .s.up{color:var(--good)} .kpi .s.down{color:var(--accent)}
.kpi.flip .s.up{color:var(--accent)} .kpi.flip .s.down{color:var(--good)}
.kpi .was{font-family:Archivo,sans-serif;font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .spark{display:block;width:100%;height:28px;margin-top:12px}
/* The one figure the client came for. Tinted ground and a plain-English line under it, because
   "3.60x" is trade language and most readers of this page do not work in ads. */
.kpi.hero{background:var(--wash)}
.kpi.hero .n{color:var(--accent)}
.kpi.hero .plain{font-size:13px;line-height:1.4;color:var(--ink-2);margin-top:9px;
  font-family:"Source Serif 4",Georgia,serif}
@media(max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} }

/* top five ------------------------------------------------------------ */
.trow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.trow:first-child{border-top:1px solid var(--rule-2)}
.rank{font-family:Archivo,sans-serif;font-size:11px;font-weight:700;color:var(--ink-3);
  width:16px;flex:none;font-variant-numeric:tabular-nums}
.th{width:54px;height:54px;flex:none;border:1px solid var(--rule);background:var(--wash);
  object-fit:cover;display:block}
.th-ph{width:54px;height:54px;flex:none;border:1px solid var(--rule);background:var(--wash);
  display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;
  font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px}
.tmain{flex:1 1 180px;min-width:0}
.tname{font-family:Archivo,sans-serif;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.tmeta{font-size:13px;color:var(--ink-3);margin-top:3px}
.tnums{display:flex;gap:20px;flex:none}
.tnum{font-family:Archivo,sans-serif;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.tnum b{display:block;font-size:15px;font-weight:600}
.tnum i{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-top:3px}
.badge{display:inline-block;font-family:Archivo,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;padding:2px 6px;border:1px solid var(--rule-2);color:var(--ink-2);margin-left:8px}
@media(max-width:600px){
  .trow{flex-wrap:wrap}
  .tnums{width:100%;justify-content:flex-start;gap:26px;padding-left:30px}
  .tnum{text-align:left;min-width:0}
}

/* motion: only where it helps the number land or the trend read --------- */
@keyframes drawline{to{stroke-dashoffset:0}}
.drawn{animation:drawline 1.15s cubic-bezier(.22,.61,.36,1) forwards}
@media(prefers-reduced-motion:reduce){ .drawn{animation:none;stroke-dashoffset:0} }

/* statement ----------------------------------------------------------- */
.sec{margin-top:46px}
.sec>h2{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sec>.lede{margin:0 0 18px;color:var(--ink-2);font-size:15.5px;max-width:62ch}
.stmt{width:100%;border-collapse:collapse}
.stmt tr{border-bottom:1px solid var(--rule)}
.stmt tr:first-child{border-top:1px solid var(--rule-2)}
.stmt tr.major{border-bottom:1.5px solid var(--ink)}
.stmt th{text-align:left;font-size:13px;font-weight:500;letter-spacing:.01em;color:var(--ink-2);
  padding:13px 8px 13px 0;vertical-align:baseline}
.stmt th span{display:block;font-family:"Source Serif 4",serif;font-size:13.5px;font-weight:400;color:var(--ink-3);letter-spacing:0;line-height:1.35;margin-top:2px}
.stmt td{text-align:right;padding:13px 0;vertical-align:baseline;white-space:nowrap}
.stmt .v{font-family:Archivo,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}
.stmt tr.major .v{font-size:27px;font-weight:800;letter-spacing:-.022em}
.stmt .d{display:block;font-family:Archivo,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.03em;color:var(--ink-3);margin-top:3px}
.d.up{color:var(--good)} .d.down{color:var(--accent)}
.flip .d.up{color:var(--accent)} .flip .d.down{color:var(--good)}
.plain .d,.plain .d.up,.plain .d.down{color:var(--ink-3)}

/* split --------------------------------------------------------------- */
.split{width:100%;border-collapse:collapse;font-size:14.5px}
.split thead th{text-align:right;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:0 0 9px;border-bottom:1px solid var(--rule-2)}
.split thead th:first-child{text-align:left}
.split td{padding:13px 0;border-bottom:1px solid var(--rule);text-align:right;
  font-family:Archivo,sans-serif;font-variant-numeric:tabular-nums;font-size:15px}
.split td:first-child{text-align:left;font-weight:600}
.split tr:last-child td{border-bottom:1.5px solid var(--ink);font-weight:700}
.bar{display:block;height:3px;background:var(--rule);margin-top:7px;max-width:100%}
.bar i{display:block;height:100%;background:var(--accent)}
.wrap-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* attribution --------------------------------------------------------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.two>div{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:20px 18px;
  box-shadow:0 1px 2px var(--shadow), 0 10px 24px -16px var(--shadow)}
.two .k{font-family:Archivo,sans-serif;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.two .n{font-family:Archivo,sans-serif;font-size:clamp(24px,5vw,30px);font-weight:800;letter-spacing:-.022em;margin-top:8px;font-variant-numeric:tabular-nums}
.two .t{font-size:14px;color:var(--ink-2);margin-top:7px;line-height:1.45}
.note{margin-top:16px;font-size:15px;color:var(--ink-2);max-width:62ch}

/* chart --------------------------------------------------------------- */
.chartbox{margin-top:6px;border:1px solid var(--rule);border-radius:12px;padding:18px 16px 12px;background:var(--wash)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-family:Archivo,sans-serif;font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.swatch{width:14px;height:3px;background:var(--accent);flex:none}
.swatch.ink{background:var(--ink-2)}
svg{display:block;width:100%;height:auto;max-width:100%}

/* footer -------------------------------------------------------------- */
footer{margin-top:60px;padding-top:20px;border-top:1.5px solid var(--ink);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
footer .ui{font-size:12px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
footer a{color:var(--accent);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}
.demo{margin:0 0 22px;padding:11px 14px;border:1px solid var(--accent);border-left-width:3px;
  font-family:Archivo,sans-serif;font-size:13px;color:var(--ink-2);background:var(--wash)}
.state{padding:64px 0;text-align:center;color:var(--ink-2)}
.state h2{font-family:Archivo,sans-serif;font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 8px}
@media (max-width:520px){
  .two{grid-template-columns:1fr}
  .stmt th span{display:none}
}
@media print{ .tabs,.demo{display:none} body{background:#fff} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="state"><h2>Loading</h2><p>One moment.</p></div>
</div>

<script>
// The API that serves the report feed. Same backend as the desk; only the /r/<token> route
// is public, and a token is scoped to a single client on the server side.
var API = 'https://desk-api-si2w.onrender.com';

var SYM = {INR:'₹', USD:'$', AED:'AED ', CAD:'CA$', AUD:'A$', LKR:'Rs ', GBP:'£', EUR:'€'};
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var ADS = ['meta','google'];
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); };

function addDays(s,n){ var d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function money(v,cur){
  var s = SYM[cur]||((cur||'')+' ');
  if(v==null||!isFinite(v)) return '--';
  var a=Math.abs(v);
  if(cur==='INR'){
    if(a>=1e7) return s+(v/1e7).toFixed(2)+' Cr';
    if(a>=1e5) return s+(v/1e5).toFixed(2)+' L';
    return s+Math.round(v).toLocaleString('en-IN');
  }
  if(a>=1e6) return s+(v/1e6).toFixed(2)+'M';
  return s+Math.round(v).toLocaleString('en-US');
}
function exact(v,cur){ var s=SYM[cur]||((cur||'')+' '); return (v==null||!isFinite(v))?'--':s+Math.round(v).toLocaleString(cur==='INR'?'en-IN':'en-US'); }
function num(v){ return isFinite(v)?Math.round(v).toLocaleString('en-IN'):'--'; }
function xx(v){ return (v!=null&&isFinite(v)&&v>0)?v.toFixed(2)+'x':'--'; }
function pc(v){ return (v==null||!isFinite(v))?'--':v.toFixed(1)+'%'; }

// Deltas read plainly: up is good for money in, down is good for costs. The .flip class on a
// row swaps the two colours rather than swapping the arrow, so the arrow always means direction.
function delta(now,prev){
  if(!isFinite(now)||!isFinite(prev)||!prev) return '';
  var d=(now-prev)/prev*100;
  if(Math.abs(d)<0.5) return '<span class="d">level</span>';
  return '<span class="d '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(0)+'% vs last period</span>';
}

var FIELDS = ['spend','impressions','clicks','purchases','revenue','leads','orders','netSales','refunds','units','newCustomerOrders','checkoutsStarted','sessions'];
function sum(rows,filter){
  var o={}; FIELDS.forEach(function(k){o[k]=0});
  var hasShop=false;
  rows.forEach(function(r){
    if(filter&&!filter(r)) return;
    if(r.platform==='shopify') hasShop=true;
    FIELDS.forEach(function(k){ o[k]+=r[k]||0; });
  });
  o.hasShop=hasShop;
  o.salesCount = hasShop? o.orders : o.purchases;
  o.trueSales  = hasShop? o.netSales : o.revenue;
  o.roas  = o.spend? o.revenue/o.spend : 0;
  o.mer   = o.spend? o.trueSales/o.spend : 0;
  o.aov   = o.salesCount? o.trueSales/o.salesCount : 0;
  o.cpa   = o.salesCount? o.spend/o.salesCount : null;
  o.cpl   = o.leads? o.spend/o.leads : null;
  o.ctr   = o.impressions? o.clicks/o.impressions*100 : 0;
  o.claim = o.orders? o.purchases/o.orders*100 : null;
  return o;
}

// Periods a client actually thinks in: the month they are in, the month just gone, the quarter.
function periods(today){
  var y=+today.slice(0,4), m=+today.slice(5,7), dom=+today.slice(8,10);
  var pad=function(n){ return (n<10?'0':'')+n; };
  var mStart=y+'-'+pad(m)+'-01';
  var pm=m===1?12:m-1, py=m===1?y-1:y;
  var pmStart=py+'-'+pad(pm)+'-01';
  var pmEnd=addDays(mStart,-1);
  var prevSameDays=addDays(pmStart,dom-1);
  return [
    {id:'mtd',   label:MONTHS[m-1],        start:mStart,  end:today,  pStart:pmStart, pEnd:(prevSameDays<pmEnd?prevSameDays:pmEnd), pLabel:'the same days of '+MONTHS[pm-1]},
    {id:'last',  label:MONTHS[pm-1],       start:pmStart, end:pmEnd,  pStart:addDays(pmStart,-31).slice(0,8)+'01', pEnd:addDays(pmStart,-1), pLabel:'the month before'},
    {id:'d90',   label:'Last 90 days',     start:addDays(today,-89), end:today, pStart:null, pEnd:null, pLabel:''}
  ];
}

var STATE={tab:'mtd', data:null};

function inRange(r,a,b){ return r.date>=a && r.date<=b; }

function render(){
  var D=STATE.data, c=D.client, cur=c.currency, isE=c.type!=='lead';
  var ps=periods(D.today), p=ps.filter(function(x){return x.id===STATE.tab})[0]||ps[0];
  var rows=D.daily;
  var A=sum(rows,function(r){ return inRange(r,p.start,p.end); });
  var P=p.pStart? sum(rows,function(r){ return inRange(r,p.pStart,p.pEnd); }) : null;
  var live=ADS.filter(function(pf){ return rows.some(function(r){ return r.platform===pf && inRange(r,p.start,p.end); }); });

  var h='';
  if(D.demo) h+='<p class="demo">Sample figures. This is how the statement looks before a live link is used.</p>';

  h+='<div class="mast"><span class="mark">PER<i>4</i>MANCE GURU</span>'
   + '<span class="period">'+esc(p.label)+(p.id==='d90'?'':' '+p.start.slice(0,4))+'</span></div>';
  h+='<h1 class="title"><small>Performance statement</small>'+esc(c.name)+'</h1>';

  // Their own person, greeted by name, before anything is reported at them.
  if(c.contact) h+='<p class="hello">Hi '+esc(c.contact)+',</p>';

  // The sentence the client came for, before any table.
  h+=verdict(A,P,c,isE,p);

  h+='<div class="tabs" role="tablist">'+ps.map(function(x){
      return '<button role="tab" aria-selected="'+(x.id===p.id)+'" data-tab="'+x.id+'">'+esc(x.label)+'</button>';
    }).join('')+'</div>';

  h+=kpiCards(A,P,c,isE,rows,p);
  h+=statement(A,P,c,isE);
  if(live.length>1) h+=splitTable(rows,p,live,cur,isE);
  if(isE && A.hasShop) h+=attribution(A,cur);
  h+=chart(rows,p,c,isE);
  h+=topBlocks(D,c,isE);

  h+='<footer><span class="ui">Prepared by Per4mance Guru &middot; '+esc(stamp(D.generatedAt))+'</span>'
   + '<a href="'+esc(D.agencySite||'https://per4mance.guru')+'" target="_blank" rel="noopener">per4mance.guru</a></footer>';

  document.getElementById('sheet').innerHTML=h;
  animate();
}

// Two pieces of motion, both doing a job: the headline figures settle into place so the eye
// lands on them first, and the trend line draws left to right so the shape of the period reads
// as a sequence. Nothing moves that the reader has to wait for; the final values are already in
// the HTML, so with animation off or JavaScript half-loaded the page is correct at rest.
function animate(){
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var path=document.querySelector('svg path.trendline');
  if(path&&!reduce){
    try{
      var L=path.getTotalLength();
      path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
      path.classList.add('drawn');
    }catch(e){}
  }
  var els=[].slice.call(document.querySelectorAll('[data-cu]'));
  if(reduce||!els.length||!window.requestAnimationFrame) return;
  var cur=(STATE.data&&STATE.data.client&&STATE.data.client.currency)||'INR';
  var fmt=function(f,v){ return f==='money'?money(v,cur):f==='x'?xx(v):num(v); };
  els.forEach(function(el){ el.setAttribute('data-final',el.textContent); });
  var t0=null, DUR=720;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/DUR), e=1-Math.pow(1-k,3);
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(k>=1){ el.textContent=el.getAttribute('data-final'); continue; }
      el.textContent=fmt(el.getAttribute('data-fmt'),(parseFloat(el.getAttribute('data-cu'))||0)*e);
    }
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function stamp(iso){
  try{
    var d=new Date(iso);
    return 'updated '+d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+' IST';
  }catch(e){ return 'updated just now'; }
}

function verdict(A,P,c,isE,p){
  var cur=c.currency;
  if(!A.spend) return '<p class="verdict">No ad spend recorded for '+esc(p.label)+' yet. The figures below fill in as the period runs.</p>';
  var s='';
  if(isE){
    var ret = A.hasShop? A.netSales : A.revenue;
    var mer = A.hasShop? A.mer : A.roas;
    s = 'In '+esc(p.label)+', <b>'+exact(A.spend,cur)+'</b> went into advertising and '
      + '<b>'+exact(ret,cur)+'</b> came back through the '+(A.hasShop?'store':'platforms')+'. '
      + 'That is <span class="hi">'+xx(mer)+'</span> back for every rupee spent, across '
      + '<b>'+num(A.salesCount)+'</b> order'+(A.salesCount===1?'':'s')+' at an average of '+exact(A.aov,cur)+'.';
  }else{
    s = 'In '+esc(p.label)+', <b>'+exact(A.spend,cur)+'</b> went into advertising and brought '
      + '<b>'+num(A.leads)+'</b> enquir'+(A.leads===1?'y':'ies')+', at <span class="hi">'+exact(A.cpl,cur)+'</span> each.';
  }
  // No verdict badge under this. The cards below already carry every comparison against the
  // previous period, each next to the figure it belongs to, so a separate summary label only
  // repeated them in a vaguer form.
  return '<p class="verdict">'+s+'</p>';
}

// Four headline figures as cards. Nothing here repeats in the statement table below: the cards
// carry what the client came for, the table carries the working behind it.
function card(k,value,sub,tone,opts){
  var o=opts||{};
  return '<div class="kpi'+(o.flip?' flip':'')+(o.hero?' hero':'')+'">'
    + '<div class="k">'+esc(k)+'</div>'
    + '<div class="n"'+(o.cu!=null?' data-cu="'+o.cu+'" data-fmt="'+(o.fmt||'num')+'"':'')+'>'+value+'</div>'
    + (sub?'<div class="s'+(tone?' '+tone:'')+'">'+sub+'</div>':'')
    + (o.was?'<div class="was">'+o.was+'</div>':'')
    + (o.plain?'<div class="plain">'+o.plain+'</div>':'')
    + (o.spark?sparkline(o.spark):'')
    + '</div>';
}

// A number alone says where you are; the shape says where you are heading. Drawn flat to the
// card's width with no axis, because it is read as a gesture and not measured. The stroke is
// held at one pixel through the stretch so it does not thicken on a wide card.
function sparkline(vals){
  if(!vals||vals.length<3) return '';
  var max=0, i;
  for(i=0;i<vals.length;i++) if(vals[i]>max) max=vals[i];
  if(!max) return '';
  var W=120,H=26,n=vals.length,line='';
  for(i=0;i<n;i++){
    var x=(i/(n-1))*W, y=H-1.5-((vals[i]||0)/max)*(H-3);
    line+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true" focusable="false">'
   + '<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="var(--accent)" opacity=".11"></path>'
   + '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>'
   + '</svg>';
}

// One value per day across the selected period, so a sparkline lines up with the figure above it.
function daySeries(rows,p,pick){
  var by={}, out=[], d=p.start, guard=0;
  rows.forEach(function(r){ if(inRange(r,p.start,p.end)) (by[r.date]=by[r.date]||[]).push(r); });
  while(d<=p.end && guard++<400){ out.push(pick(by[d]||[])); d=addDays(d,1); }
  return out;
}
var sumAds=function(rs,k){ var t=0; rs.forEach(function(r){ if(ADS.indexOf(r.platform)>-1) t+=r[k]||0; }); return t; };
var sumShop=function(rs,k){ var t=0; rs.forEach(function(r){ if(r.platform==='shopify') t+=r[k]||0; }); return t; };
function dsub(now,prev){
  if(!isFinite(now)||!isFinite(prev)||!prev) return ['',''];
  var d=(now-prev)/prev*100;
  if(Math.abs(d)<0.5) return ['Level vs last period',''];
  return [(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(0)+'% vs last period', d>0?'up':'down'];
}
function kpiCards(A,P,c,isE,rows,p){
  var cur=c.currency, sym=SYM[cur]||((cur||'')+' ');
  var was=function(v,fmt){ return P? (fmt==='money'?money(v,cur):num(v))+' last period' : ''; };
  var d=function(now,prev){ return P?dsub(now,prev):['','']; };
  var spSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'spend'); });
  var h='<div class="kpis">';

  var s1=d(A.spend,P&&P.spend);
  h+=card('Ad spend',money(A.spend,cur),s1[0],'',{cu:A.spend,fmt:'money',was:was(P&&P.spend,'money'),spark:spSeries});

  if(isE){
    var shop=A.hasShop;
    var retKey=shop?'netSales':'revenue', retLabel=shop?'Net sales':'Revenue';
    var retSeries=daySeries(rows,p,shop?function(rs){ return sumShop(rs,'netSales'); }:function(rs){ return sumAds(rs,'revenue'); });
    var cntSeries=daySeries(rows,p,shop?function(rs){ return sumShop(rs,'orders'); }:function(rs){ return sumAds(rs,'purchases'); });
    var ret=A[retKey], retP=P&&P[retKey];
    var cnt=shop?A.orders:A.purchases, cntP=P&&(shop?P.orders:P.purchases);
    var ratio=shop?A.mer:A.roas, ratioP=P&&(shop?P.mer:P.roas);

    var s2=d(ret,retP), s3=d(cnt,cntP), s4=d(ratio,ratioP);
    h+=card(retLabel,money(ret,cur),s2[0],s2[1],{cu:ret,fmt:'money',was:was(retP,'money'),spark:retSeries});
    h+=card(shop?'Orders':'Purchases',num(cnt),s3[0],s3[1],{cu:cnt,fmt:'num',was:was(cntP,'num'),spark:cntSeries});
    h+=card('Return on ad spend',xx(ratio),s4[0],s4[1],{cu:ratio,fmt:'x',hero:true,
      plain: ratio? 'Every '+sym+'100 of ad spend returned '+sym+Math.round(ratio*100).toLocaleString(cur==='INR'?'en-IN':'en-US')+'.' : ''});
  }else{
    var ldSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'leads'); });
    var ckSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'clicks'); });
    var l2=d(A.leads,P&&P.leads), l3=d(A.cpl,P&&P.cpl), l4=d(A.clicks,P&&P.clicks);
    h+=card('Enquiries',num(A.leads),l2[0],l2[1],{cu:A.leads,fmt:'num',was:was(P&&P.leads,'num'),spark:ldSeries});
    h+=card('Cost per enquiry',money(A.cpl,cur),l3[0],l3[1],{cu:A.cpl,fmt:'money',flip:true,hero:true,
      plain: (A.cpl&&isFinite(A.cpl))? 'Every '+sym+'10,000 of ad spend brought about '+Math.round(10000/A.cpl)+' enquiries.' : ''});
    h+=card('Clicks to site',num(A.clicks),l4[0],l4[1],{cu:A.clicks,fmt:'num',was:was(P&&P.clicks,'num'),spark:ckSeries});
  }
  return h+'</div>';
}

// Top five products, campaigns and creatives. These come off the entity tree, which the sync
// rebuilds over a rolling 30-day window, so they always mean the last 30 days whatever period
// the reader has selected above. The heading says so rather than leaving it to be assumed.
function tRow(i,thumbHtml,name,meta,nums){
  return '<div class="trow"><span class="rank">'+(i+1)+'</span>'+(thumbHtml||'')
   + '<div class="tmain"><div class="tname">'+name+'</div>'+(meta?'<div class="tmeta">'+meta+'</div>':'')+'</div>'
   + '<div class="tnums">'+nums.map(function(n){ return '<span class="tnum"><b>'+n[0]+'</b><i>'+esc(n[1])+'</i></span>'; }).join('')+'</div></div>';
}
function pic(url,label){
  if(!url) return '<div class="th-ph">'+esc(label||'No image')+'</div>';
  // fbcdn and Shopify links can expire or be blocked; a dead image must not leave a broken icon.
  return '<img class="th" src="'+esc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" '
   + 'onerror="this.outerHTML=\'<div class=&quot;th-ph&quot;>'+esc(label||'No image')+'</div>\'">';
}
function topBlocks(D,c,isE){
  var t=D.top; if(!t) return '';
  var cur=c.currency, h='';
  var win='Last 30 days';

  if(t.products&&t.products.length){
    h+='<div class="sec"><h2>Best selling products</h2>'
     + '<p class="lede">'+win+', ranked by the revenue each product actually brought in.</p>';
    t.products.forEach(function(p,i){
      h+=tRow(i,pic(p.image,'No photo'),esc(p.title),
        (p.price?exact(p.price,cur)+' each':''),
        [[money(p.revenue,cur),'Revenue'],[num(p.units),'Units']]);
    });
    h+='</div>';
  }

  if(t.campaigns&&t.campaigns.length){
    h+='<div class="sec"><h2>Campaigns doing the work</h2>'
     + '<p class="lede">'+win+', ranked by '+(isE?'the sales each campaign brought back':'the enquiries each campaign brought in')+', not by the headline percentage. A small campaign with a flattering ratio does not belong at the top of this list.</p>';
    t.campaigns.forEach(function(x,i){
      h+=tRow(i,'',esc(x.name)+'<span class="badge">'+esc(x.platform)+'</span>',
        exact(x.spend,cur)+' spent',
        isE? [[money(x.revenue,cur),'Revenue'],[xx(x.roas),'Return']]
           : [[num(x.leads),'Enquiries'],[exact(x.cpl,cur),'Each']]);
    });
    h+='</div>';
  }

  if(t.creatives&&t.creatives.length){
    h+='<div class="sec"><h2>Creatives doing the work</h2>'
     + '<p class="lede">'+win+'. Videos show their cover frame here rather than playing.</p>';
    t.creatives.forEach(function(x,i){
      h+=tRow(i,pic(x.thumb,x.format||'Creative'),esc(x.name)+'<span class="badge">'+esc(x.format||'')+'</span>',
        exact(x.spend,cur)+' spent'+(x.ctr?' · '+pc(x.ctr)+' click rate':''),
        isE? [[money(x.revenue,cur),'Revenue'],[xx(x.roas),'Return']]
           : [[num(x.leads),'Enquiries'],[exact(x.cpl,cur),'Each']]);
    });
    h+='</div>';
  }
  return h;
}

function row(label,hint,value,d,major,flip,plain){
  return '<tr class="'+(major?'major ':'')+(flip?'flip ':'')+(plain?'plain':'')+'">'
    + '<th>'+esc(label)+(hint?'<span>'+esc(hint)+'</span>':'')+'</th>'
    + '<td><span class="v">'+value+'</span>'+(d||'')+'</td></tr>';
}

// The cards above carry the headline figures. This table carries the working behind them, so
// no number appears in both places.
function statement(A,P,c,isE){
  var cur=c.currency, h='<div class="sec"><h2>Behind those numbers</h2>';
  h+='<table class="stmt"><tbody>';
  if(isE){
    if(A.hasShop){
      h+=row('Average order value','Net sales divided by orders',exact(A.aov,cur),P?delta(A.aov,P.aov):'');
      h+=row('Cost per order','What it cost in ads to win one order',exact(A.cpa,cur),P?delta(A.cpa,P.cpa):'',false,true);
      if(A.refunds) h+=row('Returns','Refunded in this period',exact(A.refunds,cur),P?delta(A.refunds,P.refunds):'',false,true);
      if(A.newCustomerOrders) h+=row('First-time buyers','Orders from customers buying for the first time',num(A.newCustomerOrders),P?delta(A.newCustomerOrders,P.newCustomerOrders):'');
    }else{
      h+=row('Average order value','Revenue divided by purchases',exact(A.aov,cur),P?delta(A.aov,P.aov):'');
      h+=row('Cost per purchase','What it cost in ads to win one sale',exact(A.cpa,cur),P?delta(A.cpa,P.cpa):'',false,true);
    }
    h+=row('Clicks to your store','People who came through from an ad',num(A.clicks),P?delta(A.clicks,P.clicks):'');
    h+=row('Click rate','Share of people who saw an ad and clicked',pc(A.ctr),P?delta(A.ctr,P.ctr):'');
  }else{
    h+=row('Click rate','Share of people who saw an ad and clicked',pc(A.ctr),P?delta(A.ctr,P.ctr):'');
    h+=row('Cost per click','',exact(A.spend/(A.clicks||1),cur),'',false,true);
    h+=row('Times your ads were seen','',num(A.impressions),P?delta(A.impressions,P.impressions):'');
  }
  return h+'</tbody></table></div>';
}

function splitTable(rows,p,live,cur,isE){
  var tot=sum(rows,function(r){ return inRange(r,p.start,p.end) && ADS.indexOf(r.platform)>-1; });
  var h='<div class="sec"><h2>Where the budget went</h2>'
      + '<p class="lede">How the spend divided between the two platforms, and what each returned on its own reporting.</p>'
      + '<div class="wrap-x"><table class="split"><thead><tr><th>Platform</th><th>Spend</th><th>Share</th>'
      + '<th>'+(isE?'Purchases':'Enquiries')+'</th>'+(isE?'<th>Revenue</th><th>Return</th>':'<th>Cost each</th>')+'</tr></thead><tbody>';
  live.concat(['__all']).forEach(function(pf){
    var all = pf==='__all';
    var A = all? tot : sum(rows,function(r){ return inRange(r,p.start,p.end) && r.platform===pf; });
    var share = tot.spend? A.spend/tot.spend*100 : 0;
    h+='<tr><td>'+(all?'All advertising':(pf==='meta'?'Meta':'Google'))+'</td>'
      +'<td>'+money(A.spend,cur)+'</td>'
      +'<td>'+(all?'':pc(share))+'</td>'
      +'<td>'+num(isE?A.purchases:A.leads)+'</td>'
      +(isE?'<td>'+money(A.revenue,cur)+'</td><td>'+xx(A.roas)+'</td>':'<td>'+money(A.cpl,cur)+'</td>')
      +'</tr>';
  });
  return h+'</tbody></table></div></div>';
}

// The gap runs in both directions and they mean opposite things, so the sentence has to branch.
// Under 100%, the platforms are blind to real sales. Over 100%, Meta and Google are each taking
// credit for the same order, which is why their two revenue figures must never be added up.
function claimNote(p){
  if(p==null) return 'Every figure we plan against comes from your store, not from the platforms.';
  if(p>105) return 'Added together, the platforms claim '+pc(p)+' of the orders your store actually recorded. That is not extra sales. When someone sees an ad on both Meta and Google before buying, each platform counts the order as its own, so their totals overlap. It is also why the two revenue figures above should never be added together. We plan your budget against the store figure.';
  if(p>=95) return 'The platforms claim almost exactly the number of orders your store recorded. That is a close match, and it means the tracking on your site is in good health. We still plan your budget against the store figure.';
  return 'The platforms can match about '+pc(p)+' of your real orders back to an ad. The rest are real sales they cannot see, mostly because of privacy limits on phones. We plan your budget against the store figure, which is why the return on ad spend above is calculated from net sales rather than from what the platforms claim.';
}

// The honest bit. Most reports quote one of these two numbers and hope nobody asks about the
// other. Showing both, and naming why they differ, is the point of the section.
function attribution(A,cur){
  var claimed=A.revenue, real=A.netSales;
  var pctClaim = A.orders? A.purchases/A.orders*100 : null;
  return '<div class="sec"><h2>Two ways of counting</h2>'
   + '<p class="lede">Advertising platforms count a sale when they believe an ad caused it. Your store counts a sale when money changes hands. The two never match exactly, and we report both.</p>'
   + '<div class="two">'
   + '<div><div class="k">Platforms report</div><div class="n fig">'+money(claimed,cur)+'</div>'
   + '<div class="t">Meta and Google together claim '+num(A.purchases)+' purchase'+(A.purchases===1?'':'s')+' in this period.</div></div>'
   + '<div><div class="k">Your store recorded</div><div class="n fig">'+money(real,cur)+'</div>'
   + '<div class="t">'+num(A.orders)+' order'+(A.orders===1?'':'s')+' actually placed and paid for, after discounts and returns.</div></div>'
   + '</div>'
   + '<p class="note">'+ claimNote(pctClaim) + '</p></div>';
}

// Spend against what came back, by day for a month and by week over 90 days. One scale, one
// baseline, labels that name values the chart actually reaches.
function chart(rows,p,c,isE){
  var cur=c.currency;
  var days=[], d=p.start;
  var guard=0;
  while(d<=p.end && guard++<400){ days.push(d); d=addDays(d,1); }
  if(!days.length) return '';
  var byDay={};
  rows.forEach(function(r){
    if(!inRange(r,p.start,p.end)) return;
    var o=byDay[r.date]=byDay[r.date]||{spend:0,ret:0,hasShop:false};
    if(ADS.indexOf(r.platform)>-1){ o.spend+=r.spend||0; if(!isE) o.ret+=r.leads||0; else o.retPlat=(o.retPlat||0)+(r.revenue||0); }
    if(r.platform==='shopify'){ o.hasShop=true; o.ret+=r.netSales||0; }
  });
  var anyShop=Object.keys(byDay).some(function(k){return byDay[k].hasShop});
  var pts=days.map(function(dd){
    var o=byDay[dd]||{};
    return {date:dd, spend:o.spend||0, ret: isE? (anyShop? (o.ret||0) : (o.retPlat||0)) : (o.ret||0)};
  });
  // Weekly buckets when the window is long, so bars stay readable on a phone.
  if(pts.length>45){
    var out=[];
    for(var i=0;i<pts.length;i+=7){
      var wk=pts.slice(i,i+7);
      out.push({date:wk[0].date, spend:wk.reduce(function(s,x){return s+x.spend},0), ret:wk.reduce(function(s,x){return s+x.ret},0)});
    }
    pts=out;
  }
  if(!pts.some(function(x){return x.spend||x.ret})) return '';

  var W=680,H=210,L=8,R=8,T=14,B=26;
  var iw=W-L-R, ih=H-T-B;
  var max=Math.max.apply(null,pts.map(function(x){return Math.max(x.spend,x.ret)}))||1;
  var bw=iw/pts.length;
  var bars='', line='', area='';
  pts.forEach(function(x,i){
    var bh=x.spend/max*ih, bx=L+i*bw+bw*0.22, bwid=bw*0.56;
    bars+='<rect x="'+bx.toFixed(1)+'" y="'+(T+ih-bh).toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" fill="var(--rule-2)"></rect>';
    var cx=L+i*bw+bw/2, cy=T+ih-(x.ret/max*ih);
    line+=(i?' L':'M')+cx.toFixed(1)+' '+cy.toFixed(1);
  });
  area=line+' L'+(L+iw-bw/2).toFixed(1)+' '+(T+ih)+' L'+(L+bw/2).toFixed(1)+' '+(T+ih)+' Z';
  var first=pts[0], last=pts[pts.length-1];
  var fmtD=function(s){ var m=+s.slice(5,7); return +s.slice(8,10)+' '+MONTHS[m-1].slice(0,3); };
  var retLabel = isE? (anyShop?'Net sales':'Revenue reported') : 'Enquiries';
  var topLabel = isE? money(max,cur) : num(max);

  return '<div class="sec"><h2>Day by day</h2>'
   + '<p class="lede">Spend as bars, '+retLabel.toLowerCase()+' as the line. Same scale, so a line above the bars is a period paying for itself.</p>'
   + '<div class="chartbox">'
   + '<div class="legend"><span><i class="swatch ink" style="background:var(--rule-2);height:9px;width:9px"></i>Ad spend</span>'
   + '<span><i class="swatch"></i>'+esc(retLabel)+'</span>'
   + '<span style="margin-left:auto">Peak '+esc(topLabel)+'</span></div>'
   + '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(retLabel+' against ad spend, peak '+topLabel)+'">'
   + '<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="var(--rule-2)" stroke-width="1"></line>'
   + bars
   + '<path d="'+area+'" fill="var(--accent)" opacity="0.10"></path>'
   + '<path class="trendline" d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>'
   + '<circle cx="'+(L+iw-bw/2).toFixed(1)+'" cy="'+(T+ih-(last.ret/max*ih)).toFixed(1)+'" r="3.5" fill="var(--accent)"></circle>'
   + '<text x="'+L+'" y="'+(H-8)+'" font-family="Archivo,sans-serif" font-size="11" fill="var(--ink-3)">'+esc(fmtD(first.date))+'</text>'
   + '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-family="Archivo,sans-serif" font-size="11" fill="var(--ink-3)">'+esc(fmtD(last.date))+'</text>'
   + '</svg></div></div>';
}

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-tab]');
  if(!b) return;
  STATE.tab=b.getAttribute('data-tab');

function fail(title,msg){
  document.getElementById('sheet').innerHTML=
    '<div class="mast"><span class="mark">PER<i>4</i>MANCE GURU</span></div>'
    +'<div class="state"><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>';
}

// Sample content so the page is complete at rest and can be reviewed before any link exists.
function sampleData(){
  var today=new Date().toISOString().slice(0,10), daily=[];
  for(var i=89;i>=0;i--){
    var d=addDays(today,-i);
    var wave=1+0.28*Math.sin(i/5.5)+0.12*Math.sin(i/2.1);
    var spend=Math.round(9500*wave);
