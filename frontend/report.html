<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Performance Report · Per4mance Guru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E04A21'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='800' font-size='30' text-anchor='middle' fill='%23fff'%3EP4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Per4mance Guru client statement, single-screen edition.
   The earlier version of this page was a document: one 720px column, eight sections stacked, read
   top to bottom. It was honest but it was four screens of scrolling, and a client opening a link on
   a laptop wants the whole picture at once. So this is a board, not a document: one wide grid where
   every panel is visible on open, and the reading order runs left to right, top to bottom.

   What that cost, and how it was paid: the long explanatory paragraphs under each heading are gone
   from the surface, because prose is what eats vertical space. The explanations are not deleted,
   they moved into the title attribute of the thing they explain, so hovering any figure still says
   what it means. The one exception is the attribution note, which stays visible in full, because a
   client who adds Meta's revenue to Google's revenue walks away with a number that is roughly
   double the truth, and that mistake is worth four lines of space. */
:root{
  color-scheme:light;
  --paper:#FFFFFF;
  --ground:#F7F5F1;        /* the board behind the panels, so white panels read as raised */
  --wash:#FBF9F6;
  --ink:#221F19;
  --ink-2:#5F5849;
  --ink-3:#978E7C;
  --rule:#EBE6DD;
  --rule-2:#DAD2C4;
  --accent:#E04A21;
  --accent-soft:rgba(224,74,33,.09);
  --good:#1E6B4A;
  --warn:#96650F;
  --shadow:rgba(34,31,25,.05);
  --shadow-2:rgba(34,31,25,.09);
  /* Spend and what came back are the two things being compared, so they get two colours that
     cannot be mistaken for each other. Spend is teal, which is vermilion's opposite and so
     separates at a glance even for the red-green colour blind; what came back stays the agency
     vermilion. The old chart had pale beige bars against a pale red wash, which is why nothing
     in it could be read. */
  --bar:#4E8C85;
  --bar-hi:#356B65;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bar:#5FA79E; --bar-hi:#86C4BC; } }
:root[data-theme="dark"]{ --bar:#5FA79E; --bar-hi:#86C4BC; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#1B1A17; --ground:#121110; --wash:#221F1C; --ink:#F6F1E8; --ink-2:#C5BCAD; --ink-3:#8F8779;
    --rule:#2E2A26; --rule-2:#453E36; --accent:#FF6A45; --accent-soft:rgba(255,106,69,.13);
    --good:#4CAF85; --warn:#D9A441; --shadow:rgba(0,0,0,.4); --shadow-2:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1B1A17; --ground:#121110; --wash:#221F1C; --ink:#F6F1E8; --ink-2:#C5BCAD; --ink-3:#8F8779;
  --rule:#2E2A26; --rule-2:#453E36; --accent:#FF6A45; --accent-soft:rgba(255,106,69,.13);
  --good:#4CAF85; --warn:#D9A441; --shadow:rgba(0,0,0,.4); --shadow-2:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:14px clamp(12px,1.6vw,22px) 18px;
}
/* One faint light source at the top left, so a page of white panels is not a flat sheet. */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(1100px 520px at 12% -8%, var(--accent-soft), transparent 70%);
}
.board{position:relative;z-index:1;max-width:1560px;margin:0 auto}
.fig,.n,.v,td,.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:"Hanken Grotesk",system-ui,sans-serif}

/* masthead: agency, client, period and the period switch, all on one line ------ */
.mast{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:11px;margin-bottom:12px;
  border-bottom:1.5px solid var(--ink)}
.mark{font-weight:800;font-size:12px;letter-spacing:.012em;text-transform:none;flex:none}
.mark i{font-style:normal;color:var(--accent)}
/* The agency lockup: a monogram tile, the name, and what the agency is. A client who forwards
   this link should be able to say who made it from the first glance, so the brand sits at the
   top left at a size that reads, not as a footnote. */
.brand{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit}
.brand .tile{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;
  place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em;box-shadow:0 6px 14px -8px var(--accent)}
.brand .nm{display:block;font-weight:800;font-size:15px;letter-spacing:.012em;text-transform:none;line-height:1.05}
.brand .nm i{font-style:normal;color:var(--accent)}
.brand .tg{display:block;font-weight:500;font-size:9.5px;letter-spacing:.012em;text-transform:none;color:var(--ink-3);margin-top:3px}
@media (max-width:640px){ .brand .tg{display:none} }
.fbrand{display:flex;align-items:center;gap:9px}
.fbrand .tile{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:10.5px}
.fbrand b{font-weight:800;letter-spacing:.012em;text-transform:none;font-size:11.5px;color:var(--ink)}
.fbrand b i{font-style:normal;color:var(--accent)}
.fbrand span{color:var(--ink-3);font-size:11px}
.mast .who{font-weight:700;font-size:17px;letter-spacing:-.015em;padding-left:14px;
  border-left:1px solid var(--rule-2);line-height:1.2}
.mast .who b{display:block;font-weight:500;font-size:10px;letter-spacing:.012em;text-transform:none;
  color:var(--ink-3);margin-bottom:1px}
.mast .sp{flex:1 1 auto}
.tabs{display:flex;gap:3px;flex:none;background:var(--paper);border:1px solid var(--rule);
  border-radius:999px;padding:3px}
.tabs button{appearance:none;background:none;border:0;border-radius:999px;padding:6px 14px;
  font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.012em;text-transform:none;
  color:var(--ink-3);cursor:pointer;transition:background .16s,color .16s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Any period the client asks for, not only the three we guessed. Changing either date switches
   the page to that window and compares it against the equally long window immediately before,
   so the deltas keep meaning something. The inputs are clamped to the days actually in the
   payload, because offering a date the feed cannot answer is worse than not offering it. */
.range{display:flex;align-items:center;gap:6px;flex:none;background:var(--paper);
  border:1px solid var(--rule);border-radius:999px;padding:4px 10px}
.range span{font-size:10px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3)}
.range input{font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink);background:none;
  border:0;padding:2px 3px;border-radius:5px;cursor:pointer;color-scheme:inherit}
.range input:hover{background:var(--wash)}
.range input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* the sentence, kept because a number without a sentence gets misread ---------- */
.verdict{margin:0 0 12px;font-size:clamp(15px,1.35vw,18px);line-height:1.45;color:var(--ink-2);max-width:none}
.verdict b{font-weight:600;color:var(--ink)}
.verdict .hi{color:var(--accent);font-weight:600}
.verdict .nm{color:var(--ink);font-weight:600}

/* the grid ------------------------------------------------------------------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:13px;padding:14px 15px 13px;
  min-width:0;box-shadow:0 1px 1px var(--shadow),0 12px 26px -20px var(--shadow-2)}
.panel>h2{margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:.012em;text-transform:none;
  color:var(--ink-3);display:flex;align-items:baseline;gap:8px}
.panel>h2 em{font-style:normal;font-weight:500;letter-spacing:.012em;color:var(--rule-2);margin-left:auto;
  font-size:9.5px;white-space:nowrap}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c12{grid-column:span 12}

/* kpi cards ------------------------------------------------------------------ */
.kpi{position:relative;overflow:hidden}
.kpi .k{font-size:10px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3);
  line-height:1.3;min-height:2.6em}
.kpi .n{font-size:clamp(23px,2.3vw,30px);font-weight:800;letter-spacing:-.03em;margin-top:5px;
  line-height:1.02;white-space:nowrap}
.kpi .s{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);margin-top:5px}
.kpi .s.up{color:var(--good)} .kpi .s.down{color:var(--accent)}
.kpi.flip .s.up{color:var(--accent)} .kpi.flip .s.down{color:var(--good)}
.kpi .was{font-size:10.5px;color:var(--ink-3);margin-top:2px;opacity:.85}
.kpi .spark{display:block;width:100%;height:22px;margin-top:8px}
/* The figure the client came for. The hairline of accent along the top edge is the only
   decoration on the page that is not carrying information, and it is there so the eye lands
   here first without the card having to be bigger than the three beside it. */
.kpi.hero{background:linear-gradient(180deg,var(--wash),var(--paper) 62%)}
.kpi.hero::after{content:"";position:absolute;inset:0 0 auto;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent)}
.kpi.hero .n{color:var(--accent)}
.kpi.hero .plain{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:12.5px;line-height:1.35;
  color:var(--ink-2);margin-top:7px}

/* what was agreed: budget and target, stated before the month is reported against them ---- */
.pact .k{font-size:10px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3)}
.pact .n{font-size:clamp(28px,3.1vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:4px}
.pact .sub{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.35}
.pact .sub b{font-weight:700;color:var(--ink)}
.pact .unset{font-size:12.5px;color:var(--ink-3);margin-top:6px;font-family:"Hanken Grotesk",system-ui,sans-serif}
.track{position:relative;height:7px;border-radius:99px;background:var(--rule);margin-top:11px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.22,.61,.36,1)}
.track i.ok{background:var(--good)} .track i.warn{background:var(--warn)}
.track u{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);opacity:.5;text-decoration:none}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.012em;text-transform:none;
  padding:2px 7px;border-radius:99px;margin-left:8px;vertical-align:3px;
  background:var(--wash);border:1px solid var(--rule-2);color:var(--ink-2)}
.tag.ok{background:rgba(30,107,74,.1);border-color:transparent;color:var(--good)}
.tag.bad{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag.warn{background:rgba(150,101,15,.12);border-color:transparent;color:var(--warn)}

/* creative strip: the one place on the page where the work itself is visible ------------- */
.chips{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.chips button{appearance:none;font-family:inherit;background:var(--paper);border:1px solid var(--rule);
  border-radius:99px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.012em;
  text-transform:none;color:var(--ink-3);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chips button:hover{color:var(--ink);border-color:var(--rule-2)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:99px}
.cr{flex:0 0 152px;scroll-snap-align:start;border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.crmedia{position:relative;width:100%;aspect-ratio:1/1;background:var(--wash);overflow:hidden}
.crmedia img,.crmedia video{width:100%;height:100%;object-fit:cover;display:block}
.crmedia .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3);text-align:center;padding:8px}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:0;
  background:rgba(20,18,15,.22);cursor:pointer;transition:background .15s;padding:0}
.play:hover{background:rgba(20,18,15,.34)}
.play span{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.play span::after{content:"";border-left:11px solid #221F19;border-top:7px solid transparent;
  border-bottom:7px solid transparent;margin-left:3px}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.crtag{position:absolute;left:6px;top:6px;font-size:8.5px;font-weight:700;letter-spacing:.012em;
  text-transform:none;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.93);color:#221F19}
.crtag.off{background:rgba(34,31,25,.72);color:#fff}
.crbody{padding:8px 9px 9px;display:flex;flex-direction:column;gap:2px;flex:1}
.crname{font-size:11.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crmeta{font-size:10px;color:var(--ink-3)}
.crnums{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;
  padding-top:5px;border-top:1px solid var(--rule)}
.crnums b{font-size:12.5px;font-weight:700;letter-spacing:-.015em}
.crnums i{font-style:normal;font-size:11px;font-weight:700;color:var(--accent)}
.empty{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:13px;color:var(--ink-3);padding:14px 2px}

/* facts: the working behind the headline figures, as pairs rather than a table -- */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.fact{background:var(--paper);padding:9px 11px 8px;min-width:0}
.fact .fk{font-size:9.5px;font-weight:600;letter-spacing:.012em;text-transform:none;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact .fv{font-size:16px;font-weight:700;letter-spacing:-.018em;margin-top:2px;white-space:nowrap}
.fact .fd{font-size:10px;font-weight:600;color:var(--ink-3);margin-top:1px}
.fd.up{color:var(--good)} .fd.down{color:var(--accent)}
.fact.flip .fd.up{color:var(--accent)} .fact.flip .fd.down{color:var(--good)}
.fact[title]{cursor:help}

/* split table ---------------------------------------------------------------- */
table.split{width:100%;border-collapse:collapse;font-size:13px}
.split thead th{text-align:right;font-size:9.5px;font-weight:700;letter-spacing:.012em;text-transform:none;
  color:var(--ink-3);padding:0 0 7px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.split thead th:first-child{text-align:left}
.split td{padding:8px 0;border-bottom:1px solid var(--rule);text-align:right;font-size:13.5px;
  font-weight:600;white-space:nowrap}
.split td:first-child{text-align:left}
.split tr:last-child td{border-bottom:0;font-weight:800}
.split .pf{display:inline-flex;align-items:center;gap:7px}
.swatch{width:9px;height:9px;border-radius:2px;background:var(--accent);flex:none}
.swatch.g{background:var(--ink-2)} .swatch.t{background:var(--rule-2)} .swatch.spend{background:var(--bar)}

/* two ways of counting ------------------------------------------------------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{border:1px solid var(--rule);border-radius:9px;padding:11px 12px;background:var(--wash)}
.two .k{font-size:9.5px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3)}
.two .n{font-size:clamp(19px,1.7vw,23px);font-weight:800;letter-spacing:-.025em;margin-top:4px;white-space:nowrap}
.two .t{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.note{margin:10px 0 0;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:12.5px;line-height:1.45;
  color:var(--ink-2)}

/* chart ---------------------------------------------------------------------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;font-weight:600;letter-spacing:.012em;
  text-transform:none;color:var(--ink-2);margin:-2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pk{margin-left:auto;color:var(--ink-3)}
svg{display:block;width:100%;height:auto;max-width:100%}

/* A chart with only its two end dates labelled is a shape, not a figure. Gridlines give every
   bar a value you can read without touching anything; the hover gives the exact day. Both,
   rather than one, because a printed or screenshotted copy has no hover. */
.chartwrap{position:relative}
.chartwrap svg{cursor:crosshair}
/* Pinned to the top of the plot and placed to whichever side of the hovered day has more room,
   so it never sits on top of the point it is describing and never jumps around vertically while
   the mouse moves along the chart. */
.tip{position:absolute;top:4px;z-index:6;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--paper);border:1px solid var(--rule-2);border-radius:9px;padding:8px 11px 9px;
  box-shadow:0 10px 24px -10px var(--shadow-2);white-space:nowrap;max-width:100%}
.tip.on{opacity:1}
.tip .td{font-size:10px;font-weight:700;letter-spacing:.012em;text-transform:none;color:var(--ink-3);
  margin-bottom:5px}
.tip .tl{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;margin-top:3px}
.tip .tl i{width:8px;height:8px;border-radius:2px;flex:none;font-style:normal}
.tip .tl b{margin-left:auto;padding-left:14px;font-weight:700}
.tip .tr{margin-top:6px;padding-top:5px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-3)}
.tip .tr b{color:var(--accent);font-weight:700}
.gridline{stroke:var(--rule);stroke-width:1}
.gridtext{font-family:Archivo,sans-serif;font-size:10px;fill:var(--ink-3)}
.guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.guide.on{opacity:.65}
.focusdot{opacity:0} .focusdot.on{opacity:1}
@keyframes drawline{to{stroke-dashoffset:0}}
.drawn{animation:drawline 1.05s cubic-bezier(.22,.61,.36,1) forwards}

/* top five lists ------------------------------------------------------------- */
.trow{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.trow:last-child{border-bottom:0}
.rank{font-size:10px;font-weight:700;color:var(--ink-3);width:11px;flex:none}
.th,.th-ph{width:34px;height:34px;flex:none;border:1px solid var(--rule);border-radius:5px;
  background:var(--wash);display:block;object-fit:cover}
.th-ph{display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;
  letter-spacing:.012em;text-transform:none;color:var(--ink-3);text-align:center;padding:2px;line-height:1.1}
.tmain{flex:1 1 auto;min-width:0}
.tname{font-weight:600;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{font-size:10.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{flex:none;text-align:right;min-width:0}
.tnum b{display:block;font-size:13px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.tnum i{display:block;font-style:normal;font-size:9px;font-weight:600;letter-spacing:.012em;
  text-transform:none;color:var(--ink-3);margin-top:1px}
.badge{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.012em;text-transform:none;
  padding:1px 4px;border-radius:3px;background:var(--wash);border:1px solid var(--rule);
  color:var(--ink-3);margin-left:5px;vertical-align:1px}

/* footer, states ------------------------------------------------------------- */
footer{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-2);display:flex;
  justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:baseline;
  font-size:10.5px;letter-spacing:.012em;text-transform:none;color:var(--ink-3)}
footer a{color:var(--accent);text-decoration:none;font-weight:700}
footer a:hover{text-decoration:underline}
.demo{margin:0 0 11px;padding:8px 12px;border:1px solid var(--accent);border-left-width:3px;border-radius:6px;
  font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper)}
.state{padding:80px 0;text-align:center;color:var(--ink-2)}
.state h2{font-size:17px;margin:0 0 7px;color:var(--ink)}

/* Wide first, then fold. Each step keeps whole panels intact rather than letting a panel
   squeeze to an unreadable width, because a half-width table is worse than a scroll. */
@media (max-width:1280px){
  .c3{grid-column:span 6} .c4{grid-column:span 6} .c5{grid-column:span 6} .c7{grid-column:span 6}
}
@media (max-width:900px){
  .c3{grid-column:span 6} .c4,.c5,.c6,.c7{grid-column:span 12}
  .mast .who{padding-left:0;border-left:0;flex:1 1 100%}
}
@media (max-width:560px){
  body{font-size:13.5px;padding:12px 12px 16px}
  /* Two up rather than one, so the four headline figures are still one block and not four
     screens of card. They stay legible at this width; below it they do not. */
  .c3{grid-column:span 6}
  .facts,.two{grid-template-columns:1fr}
  .tabs,.range{width:100%;justify-content:space-between}
  .tabs button{flex:1 1 0;padding:7px 4px;text-align:center}
}
@media (max-width:380px){ .c3{grid-column:span 12} }
@media print{
  body{background:#fff;padding:0} body::before{display:none}
  .tabs,.demo{display:none} .panel{break-inside:avoid;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  --rule:#E3E5DE; --rule-2:#CFD2C9; --accent:#FF5A1F; --accent-soft:rgba(255,90,31,.10);

@keyframes rbLock{0%{opacity:0;transform:scale(2.4)}55%{opacity:1;transform:scale(.96)}75%{transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
.rb-word{margin-top:30px;font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:.03em;line-height:1;color:#E7EDEF;white-space:nowrap;

<script>
// The API that serves the report feed. Same backend as the desk; only the /r/<token> route
// is public, and a token is scoped to a single client on the server side.
var API = 'https://desk-api-si2w.onrender.com';

var SYM = {INR:'₹', USD:'$', AED:'AED ', CAD:'CA$', AUD:'A$', LKR:'Rs ', GBP:'£', EUR:'€'};
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var ADS = ['meta','google'];
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); };

function addDays(s,n){ var d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function money(v,cur){
  var s = SYM[cur]||((cur||'')+' ');
  if(v==null||!isFinite(v)) return '--';
  var a=Math.abs(v);
  if(cur==='INR'){
    if(a>=1e7) return s+(v/1e7).toFixed(2)+' Cr';
    if(a>=1e5) return s+(v/1e5).toFixed(2)+' L';
    return s+Math.round(v).toLocaleString('en-IN');
  }
  if(a>=1e6) return s+(v/1e6).toFixed(2)+'M';
  return s+Math.round(v).toLocaleString('en-US');
}
function exact(v,cur){ var s=SYM[cur]||((cur||'')+' '); return (v==null||!isFinite(v))?'--':s+Math.round(v).toLocaleString(cur==='INR'?'en-IN':'en-US'); }
function num(v){ return isFinite(v)?Math.round(v).toLocaleString('en-IN'):'--'; }
function xx(v){ return (v!=null&&isFinite(v)&&v>0)?v.toFixed(2)+'x':'--'; }
function pc(v){ return (v==null||!isFinite(v))?'--':v.toFixed(1)+'%'; }

// Deltas read plainly: up is good for money in, down is good for costs. The .flip class swaps
// the two colours rather than swapping the arrow, so the arrow always means direction.
function dsub(now,prev){
  if(!isFinite(now)||!isFinite(prev)||!prev) return ['',''];
  var d=(now-prev)/prev*100;
  // A percentage off a near-zero base is arithmetic, not information. "Returns up 6,608%"
  // reads as a catastrophe to a client when what actually happened is that last month had
  // almost no returns at all. Past this point the comparison is dropped and the figure is
  // left to stand on its own.
  if(Math.abs(d)>500) return ['',''];
  if(Math.abs(d)<0.5) return ['Level','' ];
  return [(d>0?'▲':'▼')+' '+Math.abs(d).toFixed(0)+'%', d>0?'up':'down'];
}

var FIELDS = ['spend','impressions','clicks','purchases','revenue','leads','orders','netSales','refunds','units','newCustomerOrders','checkoutsStarted','sessions'];
function sum(rows,filter){
  var o={}; FIELDS.forEach(function(k){o[k]=0});
  var hasShop=false, n=0;
  rows.forEach(function(r){
    if(filter&&!filter(r)) return;
    n++;
    if(r.platform==='shopify') hasShop=true;
    FIELDS.forEach(function(k){ o[k]+=r[k]||0; });
  });
  // Whether the window had any rows at all, which is a different thing from whether it summed to
  // zero. The feed only reaches back so far, so a comparison period can fall off the end of the
  // data entirely, and "0 before" would then read as a month that sold nothing rather than a
  // month we have no figures for.
  o.rows=n;
  o.hasShop=hasShop;
  o.salesCount = hasShop? o.orders : o.purchases;
  o.trueSales  = hasShop? o.netSales : o.revenue;
  o.roas  = o.spend? o.revenue/o.spend : 0;
  o.mer   = o.spend? o.trueSales/o.spend : 0;
  o.aov   = o.salesCount? o.trueSales/o.salesCount : 0;
  o.cpa   = o.salesCount? o.spend/o.salesCount : null;
  o.cpl   = o.leads? o.spend/o.leads : null;
  o.ctr   = o.impressions? o.clicks/o.impressions*100 : 0;
  o.cpc   = o.clicks? o.spend/o.clicks : null;
  o.claim = o.orders? o.purchases/o.orders*100 : null;
  return o;
}

// Periods a client actually thinks in: the month they are in, the month just gone, the quarter.
function periods(today){
  var y=+today.slice(0,4), m=+today.slice(5,7), dom=+today.slice(8,10);
  var pad=function(n){ return (n<10?'0':'')+n; };
  var mStart=y+'-'+pad(m)+'-01';
  var pm=m===1?12:m-1, py=m===1?y-1:y;
  var pmStart=py+'-'+pad(pm)+'-01';
  var pmEnd=addDays(mStart,-1);
  var prevSameDays=addDays(pmStart,dom-1);
  return [
    {id:'mtd',  label:MONTHS[m-1],    short:MONTHS[m-1].slice(0,3),  phrase:'In '+MONTHS[m-1],  start:mStart,  end:today,  pStart:pmStart, pEnd:(prevSameDays<pmEnd?prevSameDays:pmEnd), pLabel:'the same days of '+MONTHS[pm-1]},
    {id:'last', label:MONTHS[pm-1],   short:MONTHS[pm-1].slice(0,3), phrase:'In '+MONTHS[pm-1], start:pmStart, end:pmEnd,  pStart:addDays(pmStart,-31).slice(0,8)+'01', pEnd:addDays(pmStart,-1), pLabel:'the month before'},
    {id:'d90',  label:'Last 90 days', short:'90 days', phrase:'Over the last 90 days',          start:addDays(today,-89), end:today, pStart:null, pEnd:null, pLabel:''}
  ];
}

// "14 Sep", and the year too when the window crosses into another one.
function dmy(s,withYear){ var m=+s.slice(5,7); return +s.slice(8,10)+' '+MONTHS[m-1].slice(0,3)+(withYear?' '+s.slice(0,4):''); }

var STATE={tab:'mtd', from:null, to:null, crf:'spending', data:null};
var TOKEN='';     // the report link's own token, used to ask this server for a video
function inRange(r,a,b){ return r.date>=a && r.date<=b; }

// The days the payload actually carries. The date inputs are clamped to this, so the client
// cannot pick a window the feed will answer with silence.
function dataRange(rows){
  var lo=null,hi=null;
  rows.forEach(function(r){ if(!lo||r.date<lo) lo=r.date; if(!hi||r.date>hi) hi=r.date; });
  return [lo,hi];
}

// The window being shown: one of the three presets, or whatever dates the client chose. A custom
// window is compared against the equally long window immediately before it, so every delta on the
// page keeps the same meaning it has on the preset tabs.
function activePeriod(D){
  var ps=periods(D.today);
  if(STATE.tab==='custom' && STATE.from && STATE.to){
    var a=STATE.from, b=STATE.to;
    if(a>b){ var t=a; a=b; b=t; }
    var len=Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000)+1;
    var yr=a.slice(0,4)!==b.slice(0,4);
    var lbl=dmy(a,yr)+' to '+dmy(b,true);
    return {id:'custom', label:lbl, short:'Dates', phrase:'Between '+dmy(a,yr)+' and '+dmy(b,yr),
      start:a, end:b, pStart:addDays(a,-len), pEnd:addDays(a,-1),
      pLabel:'the '+len+' day'+(len===1?'':'s')+' before'};
  }
  return ps.filter(function(x){return x.id===STATE.tab})[0]||ps[0];
}

function render(){
  var D=STATE.data, c=D.client, cur=c.currency, isE=c.type!=='lead';
  var ps=periods(D.today), p=activePeriod(D);
  var rows=D.daily, dr=dataRange(rows);
  var A=sum(rows,function(r){ return inRange(r,p.start,p.end); });
  var P=p.pStart? sum(rows,function(r){ return inRange(r,p.pStart,p.pEnd); }) : null;
  if(P && !P.rows) P=null;                 // the comparison window predates the data we hold
  var live=ADS.filter(function(pf){ return rows.some(function(r){ return r.platform===pf && inRange(r,p.start,p.end); }); });

  var h='';
  if(D.demo) h+='<p class="demo">Sample figures. This is how the statement looks before a live link is used.</p>';

  h+='<div class="mast">'
   + '<a class="brand" href="'+esc(D.agencySite||'https://per4mance.guru')+'" target="_blank" rel="noopener" title="Per4mance Guru"><span class="tile">P4</span><span><span class="nm">PER<i>4</i>MANCE GURU</span><span class="tg">Performance marketing agency</span></span></a>'
   + '<span class="who"><b>Performance report prepared for</b>'+esc(c.name)+'</span>'
   + '<span class="sp"></span>'
   + '<span class="range">'
   +   '<span>From</span><input type="date" id="d-from" value="'+esc(p.start)+'" min="'+esc(dr[0]||'')+'" max="'+esc(dr[1]||'')+'" aria-label="Start date">'
   +   '<span>To</span><input type="date" id="d-to" value="'+esc(p.end)+'" min="'+esc(dr[0]||'')+'" max="'+esc(dr[1]||'')+'" aria-label="End date">'
   + '</span>'
   + '<span class="tabs" role="tablist">'+ps.map(function(x){
       return '<button role="tab" aria-selected="'+(x.id===p.id)+'" data-tab="'+x.id+'">'+esc(x.short)+'</button>';
     }).join('')
   + '<button role="tab" aria-selected="'+(p.id==='custom')+'" data-tab="custom"'+(p.id==='custom'?'':' hidden')+'>'+esc(p.id==='custom'?p.short:'Dates')+'</button>'
   + '</span>'
   + '</div>';

  h+=verdict(A,P,c,isE,p);

  h+='<div class="grid">';
  h+=pactPanels(A,c,isE,p,D);
  h+=kpiCards(A,P,c,isE,rows,p);
  h+=progressPanel(D,c,isE,rows);
  h+=chartPanel(rows,p,c,isE);
  h+=factsPanel(A,P,c,isE,p);
  // These two share a row when both are there. When only one applies (a client on a single
  // platform, or one with no store connected) it takes the whole row, rather than leaving a
  // hole that makes the board look broken.
  var hasSplit=live.length>1, hasCount=isE&&A.hasShop;
  if(hasSplit) h+=splitPanel(rows,p,live,cur,isE,hasCount?'c5':'c12');
  if(hasCount) h+=countingPanel(A,cur,hasSplit?'c7':'c12');
  h+=topPanels(D,c,isE);
  h+=creativePanel(D,c,isE);
  h+='</div>';

  h+='<footer><span class="fbrand"><span class="tile">P4</span><b>PER<i>4</i>MANCE GURU</b><span>Performance report for '+esc(c.name)+' &middot; '+esc(stamp(D.generatedAt))+'</span></span>'
   + '<a href="'+esc(D.agencySite||'https://per4mance.guru')+'" target="_blank" rel="noopener">per4mance.guru</a></footer>';

  document.getElementById('board').innerHTML=h;
  animate();
  bindChart();
}

// Two pieces of motion, both doing a job: the headline figures settle into place so the eye lands
// on them first, and the trend line draws left to right so the shape of the period reads as a
// sequence. The final values are already in the HTML, so with animation off the page is correct
// at rest.
function animate(){
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var path=document.querySelector('svg path.trendline');
  if(path&&!reduce){
    try{
      var L=path.getTotalLength();
      path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
      path.classList.add('drawn');
    }catch(e){}
  }
  var els=[].slice.call(document.querySelectorAll('[data-cu]'));
  if(reduce||!els.length||!window.requestAnimationFrame) return;
  var cur=(STATE.data&&STATE.data.client&&STATE.data.client.currency)||'INR';
  var fmt=function(f,v){ return f==='money'?money(v,cur):f==='x'?xx(v):num(v); };
  els.forEach(function(el){ el.setAttribute('data-final',el.textContent); });
  var t0=null, DUR=680;
  function step(ts){
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/DUR), e=1-Math.pow(1-k,3);
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(k>=1){ el.textContent=el.getAttribute('data-final'); continue; }
      el.textContent=fmt(el.getAttribute('data-fmt'),(parseFloat(el.getAttribute('data-cu'))||0)*e);
    }
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function stamp(iso){
  try{
    var d=new Date(iso);
    return 'updated '+d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+' IST';
  }catch(e){ return 'updated just now'; }
}

// One sentence, because four figures in cards do not tell a reader whether the month went well.
// It carries the client's name so the page opens as something addressed to them.
function verdict(A,P,c,isE,p){
  var cur=c.currency;
  var hi = c.contact? '<span class="nm"><span>Hi '+esc(c.contact)+'</span><span class="wave" aria-hidden="true">\uD83D\uDC4B</span></span> ' : '';
  if(!A.spend) return '<p class="verdict serif">'+hi+'No ad spend recorded for '+esc(p.label)+' yet. The panels below fill in as the period runs.</p>';
  var s='';
  if(isE){
    var ret = A.hasShop? A.netSales : A.revenue;
    var mer = A.hasShop? A.mer : A.roas;
    s = esc(p.phrase)+', <b>'+exact(A.spend,cur)+'</b> went into advertising and '
      + '<b>'+exact(ret,cur)+'</b> came back through the '+(A.hasShop?'store':'platforms')+'. '
      + 'That is <span class="hi">'+xx(mer)+'</span> back for every rupee spent, across '
      + '<b>'+num(A.salesCount)+'</b> order'+(A.salesCount===1?'':'s')+' at an average of '+exact(A.aov,cur)+'.';
  }else{
    s = esc(p.phrase)+', <b>'+exact(A.spend,cur)+'</b> went into advertising and brought '
      + '<b>'+num(A.leads)+'</b> enquir'+(A.leads===1?'y':'ies')+', at <span class="hi">'+exact(A.cpl,cur)+'</span> each.';
  }
  return '<p class="verdict serif">'+hi+s+'</p>';
}

/* --- what was agreed -------------------------------------------------------- */
// Budget and target, stated at the top before the month is reported against them. Both come from
// the client record and are shown only when they are actually set there; nothing is defaulted,
// because a made-up target printed on a client's own report reads as a promise that was made.
function pactPanels(A,c,isE,p,D){
  var cur=c.currency, h='';

  // Budget. Pacing only means something over a month: on the current month it is measured
  // against how far through the month we are, on a whole past month against the month itself,
  // and over any other window the bar is dropped rather than compared against a length the
  // budget was never set for.
  var isMonth = p.id==='mtd'||p.id==='last', isNow = p.id==='mtd';
  var b='<div class="panel pact c6"><div class="k">Monthly budget</div>';
  if(c.budget){
    var used = c.budget? A.spend/c.budget*100 : 0;
    var dom=+D.today.slice(8,10), dim=new Date(+D.today.slice(0,4),+D.today.slice(5,7),0).getDate();
    var through = dom/dim*100;
    var projected = isNow&&dom>1? A.spend/(dom-1)*dim : null;
    var tone = !isMonth? '' : (used>through+12? 'warn' : used<through-15? 'warn':'ok');
    b+='<div class="n">'+money(c.budget,cur)+'</div>'
     + '<div class="sub"><b>'+money(A.spend,cur)+'</b> spent'+(isMonth?' so far, '+pc(used)+' of it':' in this window')+'</div>'
     + '<div class="track"><i class="'+tone+'" style="width:'+Math.min(100,Math.max(0,used)).toFixed(1)+'%"></i>'
     + (isNow?'<u style="left:'+through.toFixed(1)+'%" title="where the month is today"></u>':'')+'</div>'
     + (projected? '<div class="sub">On this pace the month ends at <b>'+money(projected,cur)+'</b>.</div>' : '');
  }else{
    b+='<div class="n" style="color:var(--ink-3)">Not set</div>'
     + '<div class="unset">No monthly budget has been recorded for this account yet.</div>';
  }
  h+=b+'</div>';

  // Target. Compared against the same figure the hero card leads with, so the two cannot
  // disagree: net sales over ad spend where the store is connected, platform ROAS otherwise.
  var t='<div class="panel pact c6"><div class="k">Target '+(isE?'return on ad spend':'cost per enquiry')+'</div>';
  if(c.target){
    var actual = isE? (A.hasShop? A.mer : A.roas) : A.cpl;
    var hit = isE? (actual>=c.target) : (actual&&actual<=c.target);
    var near = isE? (actual>=c.target*0.85) : (actual&&actual<=c.target*1.15);
    var tag = !actual? '' : hit? '<span class="tag ok">On target</span>'
            : near? '<span class="tag warn">Close</span>' : '<span class="tag bad">Below</span>';
    var pctOf = isE? (c.target? actual/c.target*100 : 0) : (actual? c.target/actual*100 : 0);
    t+='<div class="n">'+(isE?xx(c.target):exact(c.target,cur))+tag+'</div>'
     + '<div class="sub">'+(actual? 'Running at <b>'+(isE?xx(actual):exact(actual,cur))+'</b> '+esc(p.phrase.replace(/^In /,'in ').replace(/^Over /,'over ').replace(/^Between /,'between '))
        : 'Nothing to measure yet in this period')+'</div>'
     + '<div class="track"><i class="'+(hit?'ok':near?'warn':'')+'" style="width:'+Math.min(100,Math.max(0,pctOf||0)).toFixed(1)+'%"></i></div>'
     + '<div class="sub" style="color:var(--ink-3)">'+(isE?(A.hasShop?'Measured on your store’s net sales, not on what the platforms claim.':'Measured on the revenue the platforms report.'):'Measured across all advertising.')+'</div>';
  }else{
    t+='<div class="n" style="color:var(--ink-3)">Not set</div>'
     + '<div class="unset">No target has been agreed for this account yet.</div>';
  }
  h+=t+'</div>';
  return h;
}

/* --- kpi cards -------------------------------------------------------------- */

/* --- your progress ---------------------------------------------------------
   The statement above answers "how is this month going". This answers the other question a client
   asks, which is "are we getting better". Three months side by side, eight weeks of the same
   figure, and one plain sentence comparing the last four weeks with the four before. Everything is
   summed from the same rows as the rest of the page, so it cannot disagree with it, and a window
   the feed does not fully cover is labelled partial instead of being shown as a bad month. */
function progressPanel(D,c,isE,rows){
  var cur=c.currency, today=D.today, dr=dataRange(rows), lo=dr[0]||today;
  var res=function(A){ return isE? A.trueSales : A.leads; };
  var eff=function(A){ return isE? (A.hasShop? A.mer : A.roas) : A.cpl; };
  var effTxt=function(v){ return v==null||!isFinite(v)||v===0? '--' : (isE? xx(v) : exact(v,cur)); };
  var resTxt=function(v){ return isE? money(v,cur) : num(v); };
  var resName=isE? (rows.some(function(r){return r.platform==='shopify'})? 'Store sales' : 'Sales reported') : 'Enquiries';
  var effName=isE? 'Return on ad spend' : 'Cost per enquiry';
  var pad=function(n){ return (n<10?'0':'')+n; };
  var y=+today.slice(0,4), m=+today.slice(5,7), dom=+today.slice(8,10);
  function monthWin(back){ var mm=m-back, yy=y; while(mm<1){ mm+=12; yy--; }
    var st=yy+'-'+pad(mm)+'-01', nx=mm===12? (yy+1)+'-01-01' : yy+'-'+pad(mm+1)+'-01';
    var en=addDays(nx,-1); return {st:st,en:back===0?today:en,label:MONTHS[mm-1],days:+en.slice(8,10),full:en}; }
  var months=[2,1,0].map(function(b){
    var w=monthWin(b), A=sum(rows,function(r){ return inRange(r,w.st,w.en); });
    var partial = w.st<lo && b>0;
    var proj=null;
    if(b===0 && dom>=4){ var Y=sum(rows,function(r){ return inRange(r,w.st,addDays(today,-1)); }); proj=res(Y)/(dom-1)*w.days; }
    return {w:w,A:A,partial:partial,proj:proj,has:A.rows>0};
  }).filter(function(x){ return x.has; });
  var maxV=Math.max.apply(null,months.map(function(x){ return Math.max(res(x.A),x.proj||0); }).concat([1]));

  var mh='';
  months.forEach(function(x,i){
    var v=res(x.A), hPct=Math.max(2,v/maxV*100), pPct=x.proj? Math.max(0,(x.proj-v)/maxV*100):0;
    var prev=i>0? months[i-1]:null, chg='';
    if(prev && !prev.partial && res(prev.A)>0 && x.w.full!==today && i>0 && !(i===months.length-1 && months[i].w.en===today && dom<7)){
      var d=(v-res(prev.A))/res(prev.A)*100; chg='<span class="pchg '+(d>=0?'up':'down')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(0)+'% on '+esc(prev.w.label)+'</span>';
    }
    var now=x.w.en===today;
    mh+='<div class="pm"><div class="pm-bar"><div class="pm-col'+(now?' now':'')+'" style="height:'+hPct.toFixed(1)+'%"></div>'
      +(pPct>0?'<div class="pm-proj" style="height:'+pPct.toFixed(1)+'%" title="Where the month ends at the current pace"></div>':'')+'</div>'
      +'<div class="pm-v">'+resTxt(v)+'</div>'
      +'<div class="pm-l">'+esc(x.w.label)+(now?' so far':'')+(x.partial?' <em>partial</em>':'')+'</div>'
      +'<div class="pm-e">'+effTxt(eff(x.A))+' '+(isE?'back':'each')+'</div>'+chg+'</div>';
  });

  // eight weeks, ending yesterday so no bar is a half-finished day
  var weeks=[]; for(var w=7;w>=0;w--){ var en=addDays(today,-1-7*w), st=addDays(en,-6);
    var A=sum(rows,function(r){ return inRange(r,st,en); }); weeks.push({st:st,en:en,A:A,has:A.rows>0&&st>=lo}); }
  var wk=weeks.filter(function(x){ return x.has; });
  var wMax=Math.max.apply(null,wk.map(function(x){ return res(x.A); }).concat([1]));
  var best=null; wk.forEach(function(x){ if(res(x.A)>0 && (!best||res(x.A)>res(best.A))) best=x; });
  var wh=''; weeks.forEach(function(x){
    var v=res(x.A), hp=x.has? Math.max(2,v/wMax*100):0;
    wh+='<div class="pw'+(x===best?' best':'')+'" title="'+esc(dmy(x.st)+' to '+dmy(x.en)+': '+resTxt(v)+', '+effTxt(eff(x.A)))+'"><i style="height:'+hp.toFixed(1)+'%"></i><span>'+esc(dmy(x.en))+'</span></div>'; });

  // the sentence: last 28 days against the 28 before it
  var e1=addDays(today,-1), s1=addDays(e1,-27), e0=addDays(s1,-1), s0=addDays(e0,-27);
  var L=sum(rows,function(r){ return inRange(r,s1,e1); }), Q=sum(rows,function(r){ return inRange(r,s0,e0); });
  var line='';
  if(L.rows && res(L)>0){
    line='In the last four weeks '+(isE?'your '+(L.hasShop?'store brought in ':'ads reported ')+'<b>'+money(res(L),cur)+'</b>':'your ads brought <b>'+num(res(L))+'</b> enquiries');
    if(Q.rows && s0>=lo && res(Q)>0){
      var d=(res(L)-res(Q))/res(Q)*100;
      line+=', '+(Math.abs(d)<1?'level with':'<b class="'+(d>=0?'upc':'downc')+'">'+(d>=0?'up ':'down ')+Math.abs(d).toFixed(0)+'%</b> on')+' the four weeks before';
      var e1v=eff(L), e0v=eff(Q);
      if(e1v&&e0v){ var better=isE? e1v>=e0v : e1v<=e0v;
        line+=', and '+(isE?'return on spend ':'cost per enquiry ')+(Math.abs(e1v-e0v)/e0v<0.02?'held at <b>'+effTxt(e1v)+'</b>':(better?'improved':'moved')+' from <b>'+effTxt(e0v)+'</b> to <b>'+effTxt(e1v)+'</b>'); }
      line+='.';
    } else line+='. A comparison with the four weeks before appears once we hold eight weeks of figures.';
  } else line='Your progress fills in as the first weeks of figures arrive.';

  // highlights, only the ones the data can actually back
  var hl='';
  if(best) hl+='<li><b>Best week so far</b>'+esc(dmy(best.st)+' to '+dmy(best.en))+', '+resTxt(res(best.A))+'</li>';
  var byDay={}; rows.forEach(function(r){ if(r.date>=lo&&r.date<=e1){ var o=byDay[r.date]||(byDay[r.date]={a:0,b:0,s:0,n:0}); o.a+=(r.platform==='shopify'?(r.netSales||0):0); o.b+=(r.leads||0)+(r.platform==='shopify'?0:(r.revenue||0)); o.s+=r.spend||0; } });
  var bd=null, bv=0; Object.keys(byDay).forEach(function(d){ var o=byDay[d]; var v=isE?(o.a||o.b):(function(){var t=0;rows.forEach(function(r){ if(r.date===d) t+=r.leads||0; });return t;})(); if(v>bv){ bv=v; bd=d; } });
  if(bd) hl+='<li><b>Strongest day</b>'+esc(dmy(bd,true))+', '+resTxt(bv)+'</li>';
  var tot=sum(rows,function(r){ return inRange(r,lo,e1); });
  if(tot.rows && res(tot)>0) hl+='<li><b>Since we started reporting</b>'+esc(dmy(lo,true))+': '+resTxt(res(tot))+' on '+money(tot.spend,cur)+' of spend</li>';

  return '<div class="panel c12 prog"><h2>Your progress <em>same figures as above, over time</em></h2>'
    +'<p class="pline serif">'+line+'</p>'
    +'<div class="pgrid"><div><div class="pk">'+esc(resName)+' by month</div><div class="pms">'+mh+'</div></div>'
    +'<div><div class="pk">'+esc(resName)+' by week, labelled by the day each week ends</div><div class="pws">'+wh+'</div>'
    +(hl?'<ul class="phl">'+hl+'</ul>':'')+'</div></div></div>';
}
function card(k,value,sub,tone,opts){
  var o=opts||{};
  return '<div class="panel kpi c3'+(o.flip?' flip':'')+(o.hero?' hero':'')+'"'
    + (o.title?' title="'+esc(o.title)+'"':'')+'>'
    + '<div class="k">'+esc(k)+'</div>'
    + '<div class="n"'+(o.cu!=null?' data-cu="'+o.cu+'" data-fmt="'+(o.fmt||'num')+'"':'')+'>'+value+'</div>'
    + (sub?'<div class="s'+(tone?' '+tone:'')+'">'+sub+' vs last period</div>':'')
    + (o.was?'<div class="was">'+o.was+'</div>':'')
    + (o.plain?'<div class="plain">'+o.plain+'</div>':'')
    + (o.spark?sparkline(o.spark):'')
    + '</div>';
}

// A number alone says where you are; the shape says where you are heading. Drawn flat to the
// card's width with no axis, because it is read as a gesture and not measured.
function sparkline(vals){
  if(!vals||vals.length<3) return '';
  var max=0,i;
  for(i=0;i<vals.length;i++) if(vals[i]>max) max=vals[i];
  if(!max) return '';
  var W=120,H=24,n=vals.length,line='';
  for(i=0;i<n;i++){
    var x=(i/(n-1))*W, y=H-1.5-((vals[i]||0)/max)*(H-3);
    line+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  }
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true" focusable="false">'
   + '<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="var(--accent)" opacity=".11"></path>'
   + '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>'
   + '</svg>';
}

function daySeries(rows,p,pick){
  var by={}, out=[], d=p.start, guard=0;
  rows.forEach(function(r){ if(inRange(r,p.start,p.end)) (by[r.date]=by[r.date]||[]).push(r); });
  while(d<=p.end && guard++<400){ out.push(pick(by[d]||[])); d=addDays(d,1); }
  return out;
}
var sumAds=function(rs,k){ var t=0; rs.forEach(function(r){ if(ADS.indexOf(r.platform)>-1) t+=r[k]||0; }); return t; };
var sumShop=function(rs,k){ var t=0; rs.forEach(function(r){ if(r.platform==='shopify') t+=r[k]||0; }); return t; };

function kpiCards(A,P,c,isE,rows,p){
  var cur=c.currency, sym=SYM[cur]||((cur||'')+' ');
  var was=function(v,fmt){ return P? (fmt==='money'?money(v,cur):num(v))+' before' : ''; };
  var d=function(now,prev){ return P?dsub(now,prev):['','']; };
  var spSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'spend'); });
  var h='';

  var s1=d(A.spend,P&&P.spend);
  h+=card('Ad spend',money(A.spend,cur),s1[0],'',{cu:A.spend,fmt:'money',was:was(P&&P.spend,'money'),spark:spSeries,
    title:'Everything paid to Meta and Google in this period.'});

  if(isE){
    var shop=A.hasShop;
    var retKey=shop?'netSales':'revenue', retLabel=shop?'Net sales':'Revenue';
    var retSeries=daySeries(rows,p,shop?function(rs){ return sumShop(rs,'netSales'); }:function(rs){ return sumAds(rs,'revenue'); });
    var cntSeries=daySeries(rows,p,shop?function(rs){ return sumShop(rs,'orders'); }:function(rs){ return sumAds(rs,'purchases'); });
    var ret=A[retKey], retP=P&&P[retKey];
    var cnt=shop?A.orders:A.purchases, cntP=P&&(shop?P.orders:P.purchases);
    var ratio=shop?A.mer:A.roas, ratioP=P&&(shop?P.mer:P.roas);

    var s2=d(ret,retP), s3=d(cnt,cntP), s4=d(ratio,ratioP);
    h+=card(retLabel,money(ret,cur),s2[0],s2[1],{cu:ret,fmt:'money',was:was(retP,'money'),spark:retSeries,
      title:shop?'Taken from your store’s own sales report: gross sales less discounts and returns, tax excluded.':'Revenue the ad platforms report against their own tracking.'});
    h+=card(shop?'Orders':'Purchases',num(cnt),s3[0],s3[1],{cu:cnt,fmt:'num',was:was(cntP,'num'),spark:cntSeries,
      title:shop?'Orders your store recorded in this period.':'Purchases the ad platforms claim.'});
    h+=card('Return on ad spend',xx(ratio),s4[0],s4[1],{cu:ratio,fmt:'x',hero:true,
      title:shop?'Net sales divided by ad spend, so every rupee of advertising is measured against money that actually reached the store.':'Platform-reported revenue divided by ad spend.',
      plain: ratio? 'Every '+sym+'100 of ad spend returned '+sym+Math.round(ratio*100).toLocaleString(cur==='INR'?'en-IN':'en-US')+'.' : ''});
  }else{
    var ldSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'leads'); });
    var ckSeries=daySeries(rows,p,function(rs){ return sumAds(rs,'clicks'); });
    var l2=d(A.leads,P&&P.leads), l3=d(A.cpl,P&&P.cpl), l4=d(A.clicks,P&&P.clicks);
    h+=card('Enquiries',num(A.leads),l2[0],l2[1],{cu:A.leads,fmt:'num',was:was(P&&P.leads,'num'),spark:ldSeries});
    h+=card('Clicks to site',num(A.clicks),l4[0],l4[1],{cu:A.clicks,fmt:'num',was:was(P&&P.clicks,'num'),spark:ckSeries});
    h+=card('Cost per enquiry',money(A.cpl,cur),l3[0],l3[1],{cu:A.cpl,fmt:'money',flip:true,hero:true,
      plain: (A.cpl&&isFinite(A.cpl))? 'Every '+sym+'10,000 of ad spend brought about '+Math.round(10000/A.cpl)+' enquiries.' : ''});
  }
  return h;
}

/* --- facts ------------------------------------------------------------------ */
// The hints that used to sit under every label as a line of prose now live in the title
// attribute. Same words, no vertical cost.
function fact(k,v,d,tone,flip,hint){
  return '<div class="fact'+(flip?' flip':'')+'"'+(hint?' title="'+esc(hint)+'"':'')+'>'
   + '<div class="fk">'+esc(k)+'</div><div class="fv">'+v+'</div>'
   + (d?'<div class="fd'+(tone?' '+tone:'')+'">'+d+'</div>':'')+'</div>';
}
function factsPanel(A,P,c,isE,p){
  var cur=c.currency, d=function(n,pv){ return P?dsub(n,pv):['','']; }, f=[];
  if(isE){
    var a=d(A.aov,P&&P.aov); f.push(fact('Average order',exact(A.aov,cur),a[0],a[1],false,
      (A.hasShop?'Net sales':'Revenue')+' divided by the number of orders.'));
    var b=d(A.cpa,P&&P.cpa); f.push(fact(A.hasShop?'Cost per order':'Cost per purchase',exact(A.cpa,cur),b[0],b[1],true,
      'What it cost in advertising to win one order.'));
    if(A.hasShop && A.refunds){ var r=d(A.refunds,P&&P.refunds); f.push(fact('Returns',exact(A.refunds,cur),r[0],r[1],true,
      'Refunded in this period, counted on the day the refund was issued.')); }
    if(A.hasShop && A.newCustomerOrders){ var nc=d(A.newCustomerOrders,P&&P.newCustomerOrders);
      f.push(fact('First-time buyers',num(A.newCustomerOrders),nc[0],nc[1],false,
      'Orders from customers buying from you for the first time.')); }
    var cl=d(A.clicks,P&&P.clicks); f.push(fact('Clicks to store',num(A.clicks),cl[0],cl[1],false,
      'People who came through to your site from an ad.'));
    var ct=d(A.ctr,P&&P.ctr); f.push(fact('Click rate',pc(A.ctr),ct[0],ct[1],false,
      'Share of the people who saw an ad and clicked it.'));
  }else{
    var t1=d(A.ctr,P&&P.ctr); f.push(fact('Click rate',pc(A.ctr),t1[0],t1[1],false,'Share of the people who saw an ad and clicked it.'));
    var t2=d(A.cpc,P&&P.cpc); f.push(fact('Cost per click',exact(A.cpc,cur),t2[0],t2[1],true,'What one visit from an ad cost.'));
    var t3=d(A.impressions,P&&P.impressions); f.push(fact('Times seen',num(A.impressions),t3[0],t3[1],false,'How often your ads appeared on a screen.'));
    var t4=d(A.clicks,P&&P.clicks); f.push(fact('Clicks to site',num(A.clicks),t4[0],t4[1],false,'People who came through to your site from an ad.'));
  }
  return '<div class="panel c5"><h2>Behind those numbers<em>'+esc(P?'vs '+p.pLabel:'no comparison period')+'</em></h2>'
   + '<div class="facts">'+f.join('')+'</div></div>';
}

/* --- platform split -------------------------------------------------------- */
function splitPanel(rows,p,live,cur,isE,cls){
  var tot=sum(rows,function(r){ return inRange(r,p.start,p.end) && ADS.indexOf(r.platform)>-1; });
  var h='<div class="panel '+cls+'"><h2>Where the budget went</h2>'
      + '<table class="split"><thead><tr><th>Platform</th><th>Spend</th><th>Share</th>'
      + '<th>'+(isE?'Sales':'Enquiries')+'</th>'+(isE?'<th>Return</th>':'<th>Each</th>')+'</tr></thead><tbody>';
  live.concat(['__all']).forEach(function(pf){
    var all = pf==='__all';
    var A = all? tot : sum(rows,function(r){ return inRange(r,p.start,p.end) && r.platform===pf; });
    var share = tot.spend? A.spend/tot.spend*100 : 0;
    var name = all?'All advertising':(pf==='meta'?'Meta':'Google');
    var sw = all?'t':(pf==='meta'?'':'g');
    h+='<tr><td><span class="pf"><i class="swatch '+sw+'"></i>'+name+'</span></td>'
      +'<td>'+money(A.spend,cur)+'</td>'
      +'<td>'+(all?'':pc(share))+'</td>'
      +'<td>'+num(isE?A.purchases:A.leads)+'</td>'
      +(isE?'<td>'+xx(A.roas)+'</td>':'<td>'+money(A.cpl,cur)+'</td>')
      +'</tr>';
  });
  return h+'</tbody></table></div>';
}

/* --- two ways of counting -------------------------------------------------- */
// The gap runs in both directions and they mean opposite things, so the sentence has to branch.
// Under 100%, the platforms are blind to real sales. Over 100%, Meta and Google are each taking
// credit for the same order, which is why their two revenue figures must never be added up.
function claimNote(p){
  if(p==null) return 'Every figure we plan against comes from your store, not from the platforms.';
  if(p>105) return 'Together the platforms claim '+pc(p)+' of the orders your store actually recorded. That is not extra sales: when someone sees an ad on both Meta and Google before buying, each counts the order as its own. It is why their two revenue figures should never be added together, and why we plan your budget against the store figure.';
  if(p>=95) return 'The platforms claim almost exactly the number of orders your store recorded, which means the tracking on your site is in good health. We still plan your budget against the store figure.';
  return 'The platforms can match about '+pc(p)+' of your real orders back to an ad. The rest are real sales they cannot see, mostly because of privacy limits on phones. We plan against the store figure, which is why the return above is worked out from net sales rather than from what the platforms claim.';
}
function countingPanel(A,cur,cls){
  var pctClaim = A.orders? A.purchases/A.orders*100 : null;
  return '<div class="panel '+cls+'"><h2>Two ways of counting<em>never add these together</em></h2>'
   + '<div class="two">'
   + '<div><div class="k">Platforms report</div><div class="n">'+money(A.revenue,cur)+'</div>'
   + '<div class="t">'+num(A.purchases)+' purchase'+(A.purchases===1?'':'s')+' claimed by Meta and Google.</div></div>'
   + '<div><div class="k">Your store recorded</div><div class="n">'+money(A.netSales,cur)+'</div>'
   + '<div class="t">'+num(A.orders)+' order'+(A.orders===1?'':'s')+' placed and paid for, after discounts and returns.</div></div>'
   + '</div><p class="note">'+claimNote(pctClaim)+'</p></div>';
}

/* --- chart ----------------------------------------------------------------- */
// Spend against what came back, by day for a month and by week over 90 days. One scale, one
// baseline, so a line above the bars is a period paying for itself.
function chartPanel(rows,p,c,isE){
  var cur=c.currency, days=[], d=p.start, guard=0;
  while(d<=p.end && guard++<400){ days.push(d); d=addDays(d,1); }
  if(!days.length) return '';
  var byDay={};
  rows.forEach(function(r){
    if(!inRange(r,p.start,p.end)) return;
    var o=byDay[r.date]=byDay[r.date]||{spend:0,ret:0,hasShop:false};
    if(ADS.indexOf(r.platform)>-1){ o.spend+=r.spend||0; if(!isE) o.ret+=r.leads||0; else o.retPlat=(o.retPlat||0)+(r.revenue||0); }
    if(r.platform==='shopify'){ o.hasShop=true; o.ret+=r.netSales||0; }
  });
  var anyShop=Object.keys(byDay).some(function(k){return byDay[k].hasShop});
  var pts=days.map(function(dd){
    var o=byDay[dd]||{};
    return {date:dd, spend:o.spend||0, ret: isE? (anyShop? (o.ret||0) : (o.retPlat||0)) : (o.ret||0)};
  });
  if(pts.length>45){
    var out=[];
    for(var i=0;i<pts.length;i+=7){
      var wk=pts.slice(i,i+7);
      out.push({date:wk[0].date, spend:wk.reduce(function(s,x){return s+x.spend},0), ret:wk.reduce(function(s,x){return s+x.ret},0)});
    }
    pts=out;
  }
  if(!pts.some(function(x){return x.spend||x.ret})) return '';

  // Left margin carries the value labels. Without them the whole chart is a shape with no
  // quantity attached to it, which was the state it shipped in.
  var W=760,H=196,L=54,R=10,T=14,B=24;
  var iw=W-L-R, ih=H-T-B;
  var max=Math.max.apply(null,pts.map(function(x){return Math.max(x.spend,x.ret)}))||1;
  var bw=iw/pts.length;
  var fmtV=function(v){ return isE?money(v,cur):num(v); };

  // One unit for the whole axis, chosen from the peak. money() switches unit at a lakh on its
  // own, which would otherwise label the same axis "₹62,817" and "₹1.26 L" and make the reader
  // do the conversion between two adjacent labels.
  var sym=SYM[cur]||((cur||'')+' ');
  var axis;
  if(!isE) axis=function(v){ return num(v); };
  else if(cur==='INR'&&max>=1e7) axis=function(v){ return sym+(v/1e7).toFixed(2)+' Cr'; };
  else if(cur==='INR'&&max>=1e5) axis=function(v){ return sym+(v/1e5).toFixed(2)+' L'; };
  else if(cur!=='INR'&&max>=1e6) axis=function(v){ return sym+(v/1e6).toFixed(2)+'M'; };
  else axis=function(v){ return sym+Math.round(v).toLocaleString(cur==='INR'?'en-IN':'en-US'); };

  // Gridlines at a fixed fraction of the peak, labelled, so any bar can be read off the page
  // with nothing hovered, including on a printout or a screenshot.
  var grid='';
  [0,0.5,1].forEach(function(f){
    var y=T+ih-f*ih;
    grid+='<line class="gridline" x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'"></line>'
       +  '<text class="gridtext" x="'+(L-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+esc(f?axis(max*f):(isE?sym+'0':'0'))+'</text>';
  });

  var bars='', line='', hits='';
  pts.forEach(function(x,i){
    var bh=x.spend/max*ih, bx=L+i*bw+bw*0.24, bwid=Math.max(1.5,bw*0.52);
    bars+='<rect class="bar" data-i="'+i+'" x="'+bx.toFixed(1)+'" y="'+(T+ih-bh).toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="1.5" fill="var(--bar)"></rect>';
    var cx=L+i*bw+bw/2, cy=T+ih-(x.ret/max*ih);
    line+=(i?' L':'M')+cx.toFixed(1)+' '+cy.toFixed(1);
    hits+='<rect x="'+(L+i*bw).toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+ih+'" fill="transparent"></rect>';
  });
  var area=line+' L'+(L+iw-bw/2).toFixed(1)+' '+(T+ih)+' L'+(L+bw/2).toFixed(1)+' '+(T+ih)+' Z';
  var first=pts[0], last=pts[pts.length-1];
  var fmtD=function(s){ var m=+s.slice(5,7); return +s.slice(8,10)+' '+MONTHS[m-1].slice(0,3); };
  var retLabel = isE? (anyShop?'Net sales':'Revenue reported') : 'Enquiries';

  // Handed to the hover code, which needs the geometry to turn a mouse position into a day.
  CHART={pts:pts,W:W,L:L,T:T,ih:ih,bw:bw,max:max,cur:cur,isE:isE,retLabel:retLabel,
    weekly:pts.length!==days.length};

  return '<div class="panel c7"><h2>Day by day<em>'+(CHART.weekly?'per week, hover for a week':'per day, hover for a day')+'</em></h2>'
   + '<div class="legend"><span><i class="swatch spend"></i>Ad spend</span>'
   + '<span><i class="swatch"></i>'+esc(retLabel)+'</span>'
   + '<span class="pk">Peak '+esc(fmtV(max))+'</span></div>'
   + '<div class="chartwrap" id="cwrap">'
   + '<svg id="csvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(retLabel+' against ad spend, peak '+fmtV(max))+'">'
   + grid
   + '<line class="guide" id="cguide" x1="0" y1="'+T+'" x2="0" y2="'+(T+ih)+'"></line>'
   + bars
   + '<path d="'+area+'" fill="var(--accent)" opacity="0.09"></path>'
   + '<path class="trendline" d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>'
   + '<circle cx="'+(L+iw-bw/2).toFixed(1)+'" cy="'+(T+ih-(last.ret/max*ih)).toFixed(1)+'" r="3.2" fill="var(--accent)"></circle>'
   + '<circle class="focusdot" id="cdot" r="4.5" fill="var(--accent)" stroke="var(--paper)" stroke-width="2"></circle>'
   + '<text x="'+L+'" y="'+(H-6)+'" font-size="10.5" fill="var(--ink-3)" font-family="Archivo,sans-serif">'+esc(fmtD(first.date))+'</text>'
   + '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="Archivo,sans-serif">'+esc(fmtD(last.date))+'</text>'
   + '<g id="chits">'+hits+'</g>'
   + '</svg><div class="tip" id="ctip"></div></div></div>';
}

// Hover. The chart is drawn in viewBox units and displayed at whatever width the panel is, so a
// mouse position is converted back into viewBox units before it is turned into a day index.
// Pointer events rather than mouse events, so a tap on a phone reads a day too.
var CHART=null;
function bindChart(){
  var svg=document.getElementById('csvg'), tip=document.getElementById('ctip'),
      guide=document.getElementById('cguide'), dot=document.getElementById('cdot'),
      wrap=document.getElementById('cwrap');
  if(!svg||!CHART) return;
  var bars=svg.querySelectorAll('.bar'), shown=-1;

  function hide(){
    shown=-1; tip.className='tip'; guide.classList.remove('on'); dot.classList.remove('on');
    for(var i=0;i<bars.length;i++) bars[i].setAttribute('fill','var(--bar)');
  }
  function show(i){
    var C=CHART, p=C.pts[i];
    if(!p) return;
    if(i!==shown){
      for(var k=0;k<bars.length;k++) bars[k].setAttribute('fill', k===i?'var(--bar-hi)':'var(--bar)');
      shown=i;
    }
    var cx=C.L+i*C.bw+C.bw/2, cy=C.T+C.ih-(p.ret/C.max*C.ih);
    guide.setAttribute('x1',cx); guide.setAttribute('x2',cx); guide.classList.add('on');
    dot.setAttribute('cx',cx); dot.setAttribute('cy',cy); dot.classList.add('on');

    var ratio = p.spend? p.ret/p.spend : 0;
    var d=new Date(p.date+'T12:00:00Z');
    var DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var head = C.weekly
      ? 'Week of '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()].slice(0,3)
      : DAY[d.getUTCDay()]+', '+d.getUTCDate()+' '+MONTHS[d.getUTCMonth()].slice(0,3);
    tip.innerHTML='<div class="td">'+esc(head)+'</div>'
      + '<div class="tl"><i style="background:var(--bar)"></i>Ad spend<b>'+(C.isE?exact(p.spend,C.cur):num(p.spend))+'</b></div>'
      + '<div class="tl"><i style="background:var(--accent)"></i>'+esc(C.retLabel)+'<b>'+(C.isE?exact(p.ret,C.cur):num(p.ret))+'</b></div>'
      + (C.isE&&p.spend? '<div class="tr">Returned <b>'+xx(ratio)+'</b> on '+(C.weekly?'the week’s':'that day’s')+' spend</div>' : '');
    tip.className='tip on';   // made visible first so offsetHeight below is the real height

    // Placed on whichever side of the hovered day has more room, then clamped into the panel.
    // The plot is only about 200px tall, so anything sitting above or below the point covers
    // either the line or the bars; to the side it covers neither.
    var r=svg.getBoundingClientRect(), wr=wrap.getBoundingClientRect(), sc=r.width/C.W;
    var px=cx*sc, tw=tip.offsetWidth;
    var left = (px < wr.width/2) ? px+14 : px-14-tw;
    tip.style.left=Math.max(2,Math.min(wr.width-tw-2,left))+'px';
  }
  function at(e){
    var C=CHART, r=svg.getBoundingClientRect();
    if(!r.width) return;
    var x=(e.clientX-r.left)/r.width*C.W;
    var i=Math.floor((x-C.L)/C.bw);
    if(i<0||i>=C.pts.length){ hide(); return; }
    show(i);
  }
  svg.addEventListener('pointermove',at);
  svg.addEventListener('pointerdown',at);
  svg.addEventListener('pointerleave',hide);
}

/* --- top five -------------------------------------------------------------- */
// These come off the entity tree, which the sync rebuilds over a rolling 30-day window, so they
// mean the last 30 days whatever period is selected above. The panel heading says so.
// Names are held to one line so five rows stay a fixed height in a narrow column. A long name is
// therefore cut, and the full text goes on the title so it is still reachable on hover.
function tRow(i,thumbHtml,name,meta,valueHtml,valueLabel,plain){
  return '<div class="trow"><span class="rank">'+(i+1)+'</span>'+(thumbHtml||'')
   + '<div class="tmain"><div class="tname"'+(plain?' title="'+esc(plain)+'"':'')+'>'+name+'</div>'+(meta?'<div class="tmeta">'+meta+'</div>':'')+'</div>'
   + '<span class="tnum"><b>'+valueHtml+'</b><i>'+esc(valueLabel)+'</i></span></div>';
}
function pic(url,label){
  if(!url) return '<div class="th-ph">'+esc(label||'No image')+'</div>';
  // fbcdn and Shopify links can expire or be blocked; a dead image must not leave a broken icon.
  return '<img class="th" src="'+esc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" '
   + 'onerror="this.outerHTML=\'<div class=&quot;th-ph&quot;>'+esc(label||'No image')+'</div>\'">';
}
function topPanels(D,c,isE){
  var t=D.top; if(!t) return '';
  var cur=c.currency, h='', win='last 30 days';

  if(t.products&&t.products.length){
    h+='<div class="panel c6"><h2>Best selling products<em>'+win+'</em></h2>';
    t.products.forEach(function(p,i){
      h+=tRow(i,pic(p.image,'No photo'),esc(p.title),
        num(p.units)+' units'+(p.price?' &middot; '+exact(p.price,cur)+' each':''),
        money(p.revenue,cur),'Revenue',p.title);
    });
    h+='</div>';
  }
  if(t.campaigns&&t.campaigns.length){
    h+='<div class="panel c6"><h2>Campaigns doing the work<em>'+win+', by '+(isE?'sales':'enquiries')+'</em></h2>';
    t.campaigns.forEach(function(x,i){
      h+=tRow(i,'',esc(x.name)+'<span class="badge">'+esc(x.platform)+'</span>',
        exact(x.spend,cur)+' spent',
        isE?money(x.revenue,cur):num(x.leads), isE?'Revenue':'Enquiries',x.name+' ('+x.platform+')');
    });
    h+='</div>';
  }
  return h;
}

// Creative states, reduced from Meta's vocabulary to the three a client asks about. Anything
// that is neither running nor simply switched off (rejected, in review, an archived campaign)
// is called "Not running", because the distinction is ours to act on, not theirs to decode.
var CR_FILTERS=[['spending','Spending'],['active','Running'],['inactive','Not running'],['all','All']];
function crState(x){ return String(x.status||'').indexOf('active')===0 ? 'active' : 'inactive'; }
function crMatch(x,f){
  if(f==='all') return true;
  if(f==='spending') return (x.spend||0)>0;
  return crState(x)===f;
}

// The only place on the page where the work itself is visible rather than described. Laid out as
// a strip that scrolls sideways so a long list costs no vertical space, which matters on a page
// built to be read without scrolling.
function creativePanel(D,c,isE){
  var list=(D.top&&D.top.creatives)||[]; if(!list.length) return '';
  var cur=c.currency, f=STATE.crf;
  var counts={}; CR_FILTERS.forEach(function(k){ counts[k[0]]=list.filter(function(x){return crMatch(x,k[0])}).length; });
  var shown=list.filter(function(x){ return crMatch(x,f); }).slice(0,24);

  var h='<div class="panel c12"><h2>The creatives<em>last 30 days</em>'
   + '<span class="chips">'+CR_FILTERS.map(function(k){
       return '<button data-crf="'+k[0]+'" aria-pressed="'+(k[0]===f)+'"'+(counts[k[0]]?'':' disabled style="opacity:.4"')+'>'
         + esc(k[1])+' '+counts[k[0]]+'</button>';
     }).join('')+'</span></h2>';

  if(!shown.length) return h+'<p class="empty">Nothing in this group for the last 30 days.</p></div>';

  h+='<div class="strip">';
  shown.forEach(function(x){
    var running=crState(x)==='active';
    var media = x.thumb
      ? '<img src="'+esc(x.thumb)+'" alt="" loading="lazy" referrerpolicy="no-referrer" '
        + 'onerror="this.outerHTML=\'<div class=&quot;noimg&quot;>'+esc(x.format||'Creative')+'</div>\'">'
      : '<div class="noimg">'+esc(x.format||'Creative')+'</div>';
    h+='<div class="cr"><div class="crmedia" data-media="'+esc(x.id||'')+'">'
     + media
     + '<span class="crtag'+(running?'':' off')+'">'+(running?'Running':'Off')+'</span>'
     + (x.hasVideo? '<button class="play" data-play="'+esc(x.id)+'" aria-label="Play this video"><span></span></button>' : '')
     + '</div>'
     + '<div class="crbody"><div class="crname" title="'+esc(x.name)+'">'+esc(x.name)+'</div>'
     + '<div class="crmeta">'+esc(x.format||'')+(x.ctr?' &middot; '+pc(x.ctr)+' CTR':'')+'</div>'
     + '<div class="crnums"><b>'+(isE?money(x.revenue,cur):num(x.leads))+'</b>'
     + '<i>'+(isE?xx(x.roas):exact(x.cpl,cur))+'</i></div>'
     + '<div class="crmeta">'+exact(x.spend,cur)+' spent</div></div></div>';
  });
  return h+'</div></div>';
}

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-tab]');
  if(!b) return;
  var t=b.getAttribute('data-tab');
  if(t==='custom' && !(STATE.from&&STATE.to)) return;   // nothing chosen yet, nothing to show
  STATE.tab=t;
  render();
});

// Creative filter chips.
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-crf]');
  if(!b||b.disabled) return;
  STATE.crf=b.getAttribute('data-crf');
  render();
});

// Play. The page never holds a Meta token: it asks this server, on its own report link, for the
// video belonging to this ad, and the server checks the ad is this client's before handing back
// a playable file. A creative that will not play falls back to its still rather than to an
// error, because a client pressing play on a broken tile learns nothing useful.
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-play]');
  if(!b||!TOKEN) return;
  var id=b.getAttribute('data-play'), box=b.parentNode;
  b.remove();
  var v=document.createElement('video');
  v.controls=true; v.autoplay=true; v.playsInline=true;
  v.onerror=function(){ v.outerHTML='<div class="noimg">Preview unavailable</div>'; };
  // Whatever was standing in for the video goes first, the still or the format placeholder,
  // otherwise it stays behind the player and shows through while the video loads.
  var old=box.querySelector('img,.noimg'); if(old) old.remove();
  box.appendChild(v);
  v.src=API.replace(/\/$/,'')+'/r/'+encodeURIComponent(TOKEN)+'/v/'+encodeURIComponent(id);
});

// Picking either date moves the page onto that window. The other input keeps whatever it is
// showing, which is the active period's own edge, so choosing one date and leaving the other
// alone does the obvious thing rather than clearing the range.
document.addEventListener('change',function(e){
  var el=e.target;
  if(!el||(el.id!=='d-from'&&el.id!=='d-to')) return;
  var f=document.getElementById('d-from'), t=document.getElementById('d-to');
  if(!f||!t||!f.value||!t.value) return;
  STATE.from=f.value; STATE.to=t.value; STATE.tab='custom';
  render();
});
