<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance Desk</title>
<meta name="description" content="Per4mance Guru internal dashboard: every client's Meta, Google and Shopify numbers, creative ranking, funnel leakage and site checks in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --bg-2:#FFFFFF; --panel:rgba(255,255,255,0.8); --panel-hover:rgba(15,23,42,0.05); --border:rgba(15,23,42,0.09); --border-strong:rgba(15,23,42,0.18);
  --cyan:#0891B2; --violet:#7C3AED; --blue:#2563EB; --magenta:#DB2777;
  --green:#059669; --green-bg:rgba(5,150,105,0.12); --amber:#B45309; --amber-bg:rgba(245,158,11,0.16); --red:#DC2626; --red-bg:rgba(220,38,38,0.1); --idle:#64748B; --idle-bg:rgba(100,116,139,0.14);
  --text:#0F172A; --dim:#475569; --faint:#7C8698; --line:rgba(15,23,42,0.08);
  --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#141B2D; --bg-2:#1A2238; --panel:rgba(255,255,255,0.055); --panel-hover:rgba(255,255,255,0.085); --border:rgba(255,255,255,0.11); --border-strong:rgba(255,255,255,0.2);
  --cyan:#22D3EE; --violet:#8B5CF6; --blue:#60A5FA; --magenta:#F472B6; --green:#34D399; --green-bg:rgba(52,211,153,0.14); --amber:#FBBF24; --amber-bg:rgba(251,191,36,0.14); --red:#F87171; --red-bg:rgba(248,113,113,0.14); --idle:#8B94AD; --idle-bg:rgba(139,148,173,0.16);
  --text:#EEF2FF; --dim:#A9B3CC; --faint:#6F7A97; --line:rgba(255,255,255,0.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1100px 520px at 15% -12%,rgba(37,99,235,0.08),transparent 70%),radial-gradient(900px 500px at 95% 0%,rgba(124,58,237,0.07),transparent 70%),var(--bg);color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"tnum" 1}
.disp{font-family:"Space Grotesk","Inter",sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit} input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(34,211,238,0.3)}
a{color:var(--cyan)}

/* ambient */
.bg-blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.13;animation:floatBlob 22s ease-in-out infinite}
.blob-1{width:560px;height:560px;background:var(--cyan);top:-200px;left:-140px}
.blob-2{width:480px;height:480px;background:var(--violet);bottom:-180px;right:-120px;animation-delay:-8s}
.blob-3{width:380px;height:380px;background:var(--blue);top:40%;left:58%;animation-delay:-15s;opacity:.1}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-35px) scale(1.08)}}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(15,23,42,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,0.045) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 75% 55% at 50% 0%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 0%,#000 30%,transparent 100%)}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}

/* glass */
.glass{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.glass-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:20px 22px;position:relative;transition:border-color .25s ease,box-shadow .25s ease;min-width:0}
.glass-panel:hover{border-color:rgba(8,145,178,0.3);box-shadow:0 10px 30px -14px rgba(15,23,42,0.18)}
.glass-panel h2,.panel-title{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-title .sub,.glass-panel h2 .sub{font-size:11.5px;color:var(--faint);font-weight:500}

/* shell */
.app-shell{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;padding:20px 14px;background:rgba(255,255,255,0.72);border-right:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:6px 8px 14px}
.brand .mark{font-size:13px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:10.5px;color:var(--faint);letter-spacing:1.5px;margin-top:3px;text-transform:uppercase}
.status-row{display:flex;align-items:center;gap:7px;padding:0 8px 14px;font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--faint)}
.status-row .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);position:relative}
.status-row.on .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:dotPulse 2s infinite}
.status-row.demo .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}
.side-search{margin:0 4px 10px;position:relative}
.side-search input{width:100%;padding:8px 10px 8px 30px;border-radius:9px;border:1px solid var(--border);background:rgba(15,23,42,0.04);font-size:12.5px}
.side-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--faint)}
.side-search input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,0.12)}
.nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;min-height:0}
.nav-sep{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--faint);padding:12px 10px 4px;text-transform:uppercase}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--dim);cursor:pointer;outline:none;transition:background .15s,color .15s;border:0;background:none;width:100%;text-align:left}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--panel-hover);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,rgba(8,145,178,0.13),rgba(124,58,237,0.1));color:var(--text);box-shadow:inset 0 0 0 1px rgba(8,145,178,0.28)}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.nav-item:focus-visible{box-shadow:inset 0 0 0 2px var(--cyan)}
.nav-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .tp{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--idle)}
.hdot.good{background:var(--green);box-shadow:0 0 6px var(--green)} .hdot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)} .hdot.bad{background:var(--red);box-shadow:0 0 6px var(--red)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--red-bg);color:var(--red);padding:1px 6px;border-radius:8px}
.cmdk-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;margin:8px 0;border-radius:9px;background:var(--panel);border:1px solid var(--border);font-size:11.5px;color:var(--faint);cursor:pointer}
.cmdk-hint kbd{font-family:"Space Grotesk",monospace;font-size:10px;background:rgba(15,23,42,0.07);padding:2px 6px;border-radius:4px;color:var(--dim)}
.user-block{display:flex;align-items:center;gap:10px;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.user-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.user-meta{min-width:0;flex:1}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10.5px;color:var(--faint)}
.user-block .icon-btn{margin-left:auto}

.main{flex:1;min-width:0;padding:26px 32px 70px;max-width:1380px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:25px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.page-head .subtitle{font-size:12.5px;color:var(--dim);max-width:80ch}
.page-head .meta{font-size:12px;color:var(--faint);text-align:right}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;margin-bottom:12px;background:none;border:0;padding:0}
.detail-back:hover{color:var(--cyan)} .detail-back svg{width:14px;height:14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar .grow{flex:1}

.btn{border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:600;transition:transform .12s,filter .12s,box-shadow .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(90deg,var(--cyan),var(--blue));color:#fff;box-shadow:0 8px 18px -8px rgba(37,99,235,0.6)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--panel);color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong)}
.btn-small{padding:6px 11px;font-size:11.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.icon-btn{background:none;border:none;color:var(--faint);padding:4px 6px;border-radius:6px} .icon-btn:hover{color:var(--text);background:var(--panel-hover)} .icon-btn svg{width:14px;height:14px;display:block}
.tab-row{display:flex;gap:6px;flex-wrap:wrap}
.tab-btn{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--border);color:var(--dim)}
.tab-btn.active{background:linear-gradient(90deg,rgba(8,145,178,0.14),rgba(124,58,237,0.1));color:var(--text);border-color:rgba(8,145,178,0.4)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border:0;border-radius:7px;background:none;font-size:12px;font-weight:600;color:var(--dim)}
.seg button.on{background:linear-gradient(90deg,var(--cyan),var(--blue));color:#fff}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;line-height:1.5}
.chip.good{background:var(--green-bg);color:var(--green)} .chip.warn{background:var(--amber-bg);color:var(--amber)} .chip.bad{background:var(--red-bg);color:var(--red)} .chip.neutral{background:var(--idle-bg);color:var(--idle)} .chip.accent{background:rgba(34,211,238,0.14);color:var(--cyan)} .chip.violet{background:rgba(139,92,246,0.16);color:#C4B5FD}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.delta{font-size:11.5px;font-weight:600} .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--faint)}
.muted{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:11.5px}

/* hero + kpis */
.hero-strip{display:flex;align-items:center;gap:22px;margin-bottom:20px;flex-wrap:wrap;padding:18px 22px}
.hero-num{font-size:52px;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy .label{font-size:12.5px;font-weight:600;color:var(--dim)} .hero-copy .detail{font-size:12.5px;color:var(--faint);margin-top:2px}
.hero-side{margin-left:auto;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.hero-mini .v{font-size:19px;font-weight:700} .hero-mini .l{font-size:11px;color:var(--faint)}
.sparkbars{display:flex;align-items:flex-end;gap:3px;height:38px}
.sparkbars .b{width:7px;background:rgba(15,23,42,0.12);border-radius:2px 2px 0 0;min-height:3px}
.sparkbars .b.cur{background:linear-gradient(180deg,var(--cyan),var(--blue))}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi-grid.six{grid-template-columns:repeat(6,1fr)}
.kpi-card{position:relative;padding:16px 16px 14px;overflow:hidden}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px}
.kc-cyan::before{background:linear-gradient(90deg,var(--cyan),transparent)} .kc-violet::before{background:linear-gradient(90deg,var(--violet),transparent)} .kc-green::before{background:linear-gradient(90deg,var(--green),transparent)} .kc-amber::before{background:linear-gradient(90deg,var(--amber),transparent)} .kc-magenta::before{background:linear-gradient(90deg,var(--magenta),transparent)} .kc-blue::before{background:linear-gradient(90deg,var(--blue),transparent)} .kc-red::before{background:linear-gradient(90deg,var(--red),transparent)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.kpi-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,0.06)} .kpi-icon svg{width:14px;height:14px}
.kpi-label{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.2px}
.kpi-value{font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.kpi-sub{font-size:11.5px;color:var(--faint);margin-top:4px}
.kpi-sub.good{color:var(--green)} .kpi-sub.bad{color:var(--red)} .kpi-sub.warn{color:var(--amber)}

.section{margin-bottom:22px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:15px;font-weight:700;position:relative;padding-bottom:8px}
.section-head h2::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:42px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.section-head .sub{font-size:11.5px;color:var(--faint)}

/* attention */
.attn-list{display:flex;flex-direction:column;gap:8px}
.attn-item{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;background:rgba(245,158,11,0.09);border:1px solid rgba(245,158,11,0.35)}
.attn-item.red{background:rgba(220,38,38,0.07);border-color:rgba(220,38,38,0.32)}
.attn-item.info{background:rgba(8,145,178,0.06);border-color:rgba(8,145,178,0.25)}
.attn-item svg{width:16px;height:16px;color:var(--amber);flex-shrink:0;margin-top:1px}
.attn-item.red svg{color:var(--red)} .attn-item.info svg{color:var(--cyan)}
.attn-item .t1{font-size:12.5px;font-weight:700} .attn-item .t2{font-size:12.5px;color:var(--dim)}
.attn-item .go{margin-left:auto;flex-shrink:0}
.empty-note{padding:26px 0;text-align:center;color:var(--faint);font-size:13px}

/* client cards */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.project-card{position:relative;overflow:hidden;padding:18px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .25s;text-align:left;width:100%;color:inherit}
.project-card:hover{transform:translateY(-3px);border-color:rgba(8,145,178,0.45);box-shadow:0 14px 30px -14px rgba(15,23,42,0.22)}
.project-card:focus-visible{outline:2px solid var(--cyan)}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.pc-name{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15.5px;line-height:1.25}
.pc-meta{font-size:11px;color:var(--faint);margin-top:2px}
.pc-kpi{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;line-height:1;text-align:right}
.pc-kpi.good{color:var(--green)} .pc-kpi.warn{color:var(--amber)} .pc-kpi.bad{color:var(--red)} .pc-kpi.neutral{color:var(--dim)}
.pc-kpi .t{display:block;font-family:"Inter",sans-serif;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:3px}
.pc-rows{display:flex;flex-direction:column;gap:5px;margin:10px 0 12px;font-size:12px}
.pc-row{display:flex;justify-content:space-between;color:var(--dim);gap:8px} .pc-row b{color:var(--text);font-weight:600}
.pc-bar{height:6px;border-radius:4px;background:rgba(15,23,42,0.08);overflow:hidden;position:relative;margin-bottom:6px}
.pc-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .6s ease}
.pc-bar-fill.warn{background:linear-gradient(90deg,var(--amber),#F59E0B)} .pc-bar-fill.bad{background:linear-gradient(90deg,var(--red),#EF4444)}
.pc-bar .mark{position:absolute;top:-3px;width:2px;height:12px;background:var(--text);opacity:.5}
.pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);padding-top:10px;border-top:1px solid var(--line);gap:6px;flex-wrap:wrap}

/* tables */
.data-table-wrap{overflow-x:auto}
table.dtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
table.dtable thead th{text-align:left;padding:9px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
table.dtable thead th:hover,table.dtable thead th.sorted{color:var(--text)}
table.dtable thead th.num,table.dtable td.num{text-align:right}
table.dtable tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--dim);white-space:nowrap}
table.dtable tbody tr:last-child td{border-bottom:none}
table.dtable tbody tr{transition:background .15s} table.dtable tbody tr:hover{background:rgba(8,145,178,0.06)}
tr.rowlink{cursor:pointer} tr.rowlink:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.row-title{color:var(--text);font-weight:600}
td .sub{display:block;color:var(--faint);font-size:11px;white-space:normal;max-width:320px;font-weight:400}
td.call{min-width:300px;white-space:normal} td.call .sub{max-width:none}
.tree tr.lvl1 td{background:rgba(15,23,42,0.035)} .tree tr.lvl2 td{background:rgba(15,23,42,0.018)}
.tree tr.lvl1 td.name{padding-left:34px} .tree tr.lvl2 td.name{padding-left:58px}
.tree tr.lvl0 td.name{color:var(--text);font-weight:600}
.tw{display:inline-block;width:18px;color:var(--faint);font-size:10px;cursor:pointer;user-select:none;transition:transform .15s} .tw.on{transform:rotate(90deg);color:var(--cyan)}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:rgba(15,23,42,0.06);vertical-align:middle;margin-right:10px;flex:none}
.adname{display:flex;align-items:center}
.spark{width:84px;height:26px;vertical-align:middle;margin-right:8px} .spark polyline{fill:none;stroke-width:1.5;stroke:var(--idle)} .spark polyline.up{stroke:var(--green)} .spark polyline.down{stroke:var(--red)}
.pace{display:flex;align-items:center;gap:10px;min-width:150px}
.pace-track{flex:1;height:6px;background:rgba(15,23,42,0.08);border-radius:3px;position:relative}
.pace-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--violet))} .pace-fill.warn{background:var(--amber)} .pace-fill.bad{background:var(--red)}
.pace-mark{position:absolute;top:-4px;width:2px;height:14px;background:var(--text);opacity:.5}
.pace-num{width:44px;text-align:right;font-size:12px;color:var(--dim)}
.pace.big{margin-top:12px} .pace.big .pace-track{height:10px} .pace.big .pace-mark{top:-4px;height:18px}

<script>
(function(){

/* ============================== DATA ACCESS ==============================

const CFG = window.DESK_CONFIG || {};
const LIVE = !!(CFG.firebase && CFG.firebase.projectId);
const RANGE_DAYS = 35;
const TZ = CFG.timezone || 'Asia/Kolkata';

  signals['sample-eldercare'].items=[{type:'no-spend',severity:'critical',message:'No Meta spend today (yesterday ₹6,120). Check payment method, ad rejections and account status.'}];
  signals['sample-hrtech'].items=[{type:'learning-limited',severity:'info',message:'2 ad sets learning limited: Lookalike 2%, Broad 25 to 45.'},{type:'fatigue',severity:'info',message:'2 creatives fatiguing: Video | Walkthrough | 25s, Carousel | Why us in 4 slides. Brief a refresh.'}];
  sitewatch['sample-ecom'].checks[6]={name:'Checkout page loads',ok:false,ms:4100,detail:'checkout shows an error message'}; sitewatch['sample-ecom'].ok=false;
  sitewatch['sample-ecom'].history[47].ok=false; sitewatch['sample-ecom'].history[47].failed=['Checkout page loads']; sitewatch['sample-ecom'].history[46].ok=false; sitewatch['sample-ecom'].history[46].failed=['Checkout page loads'];

let fb=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('failed to load '+src)); document.head.appendChild(s); }); }
async function initFirebase(){ const v=CFG.firebaseVersion||'10.14.1'; for(const f of ['app','auth','firestore']) await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-${f}-compat.js`); firebase.initializeApp(CFG.firebase); fb={auth:firebase.auth(),db:firebase.firestore()}; return fb; }
function allowedEmail(email){ const doms=CFG.allowedDomains||[], users=CFG.allowedEmails||[]; if(!doms.length&&!users.length) return true; const e=(email||'').toLowerCase(); return users.map(x=>x.toLowerCase()).includes(e)||doms.some(d=>e.endsWith('@'+d.toLowerCase())); }
async function loadLive(){
  const today=isoToday(); const since=addDays(today,-RANGE_DAYS);
  const col=async(name,q)=>{ let ref=fb.db.collection(name); if(q) ref=q(ref); const s=await ref.get(); return s.docs.map(d=>({id:d.id,...d.data()})); };
  const [clients,daily,ents,sigs,sws,syncsArr,alerts,intra,meta]=await Promise.all([col('clients'),col('daily',r=>r.where('date','>=',since)),col('entities'),col('signals'),col('sitewatch'),col('syncs'),col('alerts',r=>r.where('at','>=',new Date(Date.now()-48*3600000).toISOString())),col('intraday',r=>r.where('date','>=',addDays(today,-8))),fb.db.collection('meta').doc('lastRun').get().then(d=>d.exists?d.data():{})]);
  const byId=(arr)=>Object.fromEntries(arr.map(x=>[x.clientId||x.id,x]));
  return {today,clients:clients.filter(c=>c.active!==false),daily,entities:byId(ents),signals:byId(sigs),sitewatch:byId(sws),syncs:byId(syncsArr),alerts,intraday:Object.fromEntries(intra.map(x=>[x.id,x])),lastRun:meta};
}

/* ============================== RANGES / METRICS ========================= */
function rangeSpec(range,today){ const dom=parseInt(today.slice(8),10);
  switch(range){
    case 'today': return {days:1,offset:0,prev:{days:1,offset:7},label:'today',prevLabel:'same day last week'};
    case 'yesterday': return {days:1,offset:1,prev:{days:1,offset:8},label:'yesterday',prevLabel:'same day last week'};
    case '14d': return {days:14,offset:1,prev:{days:14,offset:15},label:'last 14 days',prevLabel:'prior 14 days'};
    case '30d': return {days:30,offset:1,prev:{days:30,offset:31},label:'last 30 days',prevLabel:'prior 30 days'};
    case 'MTD': return {days:dom,offset:0,prev:{days:dom,offset:dom},label:'month to date',prevLabel:'same days last month'};
    default: return {days:7,offset:1,prev:{days:7,offset:8},label:'last 7 days',prevLabel:'prior 7 days'};
  } }
function window_(today,spec){ const end=addDays(today,-spec.offset); return {start:addDays(end,-(spec.days-1)),end}; }
function rowsIn(rows,today,spec){ const w=window_(today,spec); return rows.filter(r=>r.date>=w.start&&r.date<=w.end); }
function daysIn(days,today,spec){ const w=window_(today,spec); const o={spend:0,impressions:0,clicks:0,purchases:0,revenue:0,leads:0}; for(const d in days){ if(d>=w.start&&d<=w.end){ const t=days[d]; o.spend+=t[0]||0; o.impressions+=t[1]||0; o.clicks+=t[2]||0; o.purchases+=t[3]||0; o.revenue+=t[4]||0; o.leads+=t[5]||0; } } return o; }
const ADS=['meta','google'];
const SUMS=['spend','impressions','clicks','purchases','revenue','leads','lpv','atc','ic','orders','grossSales','netSales','refunds','newCustomerOrders','units','checkoutsStarted','sessions','ga4Atc','ga4Checkouts','ga4Purchases'];
function agg(rows){ const o={}; SUMS.forEach(k=>o[k]=0); let hasShop=false,hasGa=false; rows.forEach(r=>{ SUMS.forEach(k=>{o[k]+=r[k]||0}); if(r.platform==='shopify') hasShop=true; if(r.platform==='ga4') hasGa=true; }); o.hasShop=hasShop; o.hasGa=hasGa; return derive(o); }
function derive(o){
  o.ctr=o.impressions?o.clicks/o.impressions*100:0; o.cpm=o.impressions?o.spend/o.impressions*1000:0; o.cpc=o.clicks?o.spend/o.clicks:Infinity;
  o.roas=o.spend?o.revenue/o.spend:0; o.mer=o.hasShop&&o.spend?o.netSales/o.spend:null;
  o.salesCount=o.hasShop?o.orders:o.purchases; o.cpa=o.salesCount?o.spend/o.salesCount:Infinity;
  o.cac=o.hasShop&&o.newCustomerOrders?o.spend/o.newCustomerOrders:null;
  o.aov=o.hasShop&&o.orders?o.netSales/o.orders:(o.purchases?o.revenue/o.purchases:0);
  o.coverage=o.hasShop&&o.orders?o.purchases/o.orders:null;
  o.storeCvr=o.hasGa&&o.sessions?(o.hasShop?o.orders:o.ga4Purchases)/o.sessions*100:null;
  o.cpl=o.leads?o.spend/o.leads:Infinity; o.lpcvr=o.clicks?o.leads/o.clicks*100:0;
  o.newShare=o.hasShop&&o.orders?o.newCustomerOrders/o.orders*100:null;
  o.abandoned=o.hasShop?Math.max(0,o.checkoutsStarted-o.orders):null;
  return o; }
function kpiOf(c,a){ return c.type==='ecom'?a.roas:a.cpl }
function kpiTarget(c){ return c.type==='ecom'?(c.target?.roas||0):(c.target?.cpl||0) }
function kpiStatus(c,v){ const t=kpiTarget(c); if(!t) return 'neutral'; if(!isFinite(v)||v===0) return 'bad'; if(c.type==='ecom') return v>=t?'good':(v>=t*0.85?'warn':'bad'); return v<=t?'good':(v<=t*1.15?'warn':'bad'); }
function kpiDelta(c,now,prev){ if(!isFinite(now)||!isFinite(prev)||!prev) return 0; const d=(now-prev)/prev*100; return c.type==='ecom'?d:-d; }
const RANK={bad:0,warn:1,good:2,neutral:2};
function adStatus(ad,c,total){
  const share=total.spend?ad.spend/total.spend:0; const isE=c.type==='ecom'; const t=kpiTarget(c);
  const roas=ad.spend?ad.revenue/ad.spend:0, cpl=ad.leads?ad.spend/ad.leads:Infinity;
  const eff=isE?(t?roas/t:0):(isFinite(cpl)&&cpl&&t?t/cpl:0);
  const l7=ad.last7||{}, p7=ad.prev7||{};
  const fatigue=(l7.freq||ad.freq)>3.2&&p7.ctr&&l7.ctr<p7.ctr*0.85&&p7.cpm&&l7.cpm>p7.cpm*1.12&&l7.spend>0;
  const ctrTrend=p7.ctr?l7.ctr/p7.ctr:null, cpmTrend=p7.cpm?l7.cpm/p7.cpm:null;
  if(ad.status&&ad.status!=='ACTIVE') return {status:cap(ad.status.toLowerCase().replace(/_/g,' ')),tone:/DISAPPROVED|WITH_ISSUES/.test(ad.status)?'bad':'neutral',why:(ad.issues||[]).join('; ')||'Not delivering.',ctrTrend,cpmTrend};
  if(share<0.05&&(ad.daysLive||99)<6) return {status:'Testing',tone:'neutral',why:'Under 5% of spend, '+ad.daysLive+' days live. Let it reach signal before judging.',ctrTrend,cpmTrend};
  if(fatigue) return {status:'Fatiguing',tone:'warn',why:'CTR down '+pct(1-ctrTrend)+', CPM up '+pct(cpmTrend-1)+', frequency '+(l7.freq||ad.freq).toFixed(1)+' this week. Brief a refresh now, not after it dies.',ctrTrend,cpmTrend};
  if(eff>=1.15&&(l7.freq||ad.freq)<3) return {status:'Scale',tone:'good',why:'Beating target by '+pct(eff-1)+' at frequency '+(l7.freq||ad.freq).toFixed(1)+'. Room to add budget.',ctrTrend,cpmTrend};
  if(eff<0.7&&share>0.08) return {status:'Pause',tone:'bad',why:'Taking '+pct(share)+' of spend while '+(isE?'ROAS':'CPL')+' misses target by '+pct(1-eff)+'.',ctrTrend,cpmTrend};
  if(eff<0.85) return {status:'Watch',tone:'warn',why:'Under target by '+pct(1-eff)+'. Give it 3 more days at current budget, then cut 30% if it has not moved.',ctrTrend,cpmTrend};
  return {status:'Steady',tone:'accent',why:'Within range of target. Watch frequency past 3.',ctrTrend,cpmTrend}; }
function summarize(D,c,range){
  const today=D.today; const rows=D.daily.filter(r=>r.clientId===c.id); const spec=rangeSpec(range,today);
  const cur=agg(rowsIn(rows,today,spec)), prev=agg(rowsIn(rows,today,spec.prev));
  const last7=agg(rowsIn(rows,today,rangeSpec('7d',today))), prev7=agg(rowsIn(rows,today,rangeSpec('7d',today).prev));
  const todayA=agg(rowsIn(rows,today,rangeSpec('today',today))), yest=agg(rowsIn(rows,today,rangeSpec('yesterday',today)));
  const mtd=agg(rows.filter(r=>r.date>=today.slice(0,8)+'01'&&r.date<=today));
  const dom=parseInt(today.slice(8),10), dim=new Date(parseInt(today.slice(0,4)),parseInt(today.slice(5,7)),0).getDate();
  const expected=c.budget?c.budget*dom/dim:0; const paceRatio=expected?mtd.spend/expected:0; const projected=mtd.spend/dom*dim;
  const kpi=kpiOf(c,cur), status=kpiStatus(c,kpi); const delta7=kpiDelta(c,kpiOf(c,last7),kpiOf(c,prev7));
  const ent=D.entities[c.id]||{campaigns:[],adsets:[],ads:[],products:[],issues:[],recentOrders:[]};
  const adsTotal={spend:(ent.ads||[]).reduce((s,a)=>s+a.spend,0)}; const ads=(ent.ads||[]).map(a=>({...a,...adStatus(a,c,adsTotal)}));

function fmtMoney(v,c){ const cur=(c&&c.currency)||'INR'; const s=SYM[cur]||cur+' '; if(v===null||!isFinite(v)) return 'n/a'; const a=Math.abs(v); if(cur==='INR'){ if(a>=1e7) return s+(v/1e7).toFixed(2)+' Cr'; if(a>=1e5) return s+(v/1e5).toFixed(1)+' L'; return s+Math.round(v).toLocaleString('en-IN'); } if(a>=1e6) return s+(v/1e6).toFixed(2)+'M'; if(a>=1e4) return s+(v/1e3).toFixed(1)+'K'; return s+Math.round(v).toLocaleString('en-US'); }
function fmtNum(v){ return isFinite(v)?Math.round(v).toLocaleString('en-IN'):'n/a' }
function fmtX(v){ return v!==null&&isFinite(v)?v.toFixed(2)+'x':'n/a' }
function fmtPct(v){ return v===null||!isFinite(v)?'n/a':v.toFixed(1)+'%' }
function pct(v){ return isFinite(v)?Math.round(v*100)+'%':'n/a' }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):'' }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])) }

function vs(cur,prev,invert){ if(!prev||!isFinite(cur)||!isFinite(prev)) return ''; let d=(cur-prev)/prev*100; if(invert) d=-d; return deltaHtml(d); }
function ago(iso){ if(!iso) return 'never'; const m=Math.round((Date.now()-new Date(iso))/60000); if(m<2) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' days ago'; }

  else if(act==='update'){ showUpdate(S[state.clientId]); }
  else if(act==='closemodal'){ el.closest('.modal').remove(); }
  else if(act==='copytext'){ const ta=document.getElementById('updText'); ta.select(); navigator.clipboard?.writeText(ta.value).catch(()=>{}); try{document.execCommand('copy')}catch(err){} toast('Update copied to clipboard'); }
  else if(act==='cmdk'){ openCmdk(); }
  else if(act==='refresh'){ boot(true); }
  else if(act==='syncnow'){ syncNow(); }
  else if(act==='signout'){ fb.auth.signOut().then(()=>location.reload()); }
  else if(act==='signin'){ signIn(); }
});
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(cmdk.classList.contains('open')) closeCmdk(); else openCmdk(); } if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.rowlink')){e.preventDefault();go(e.target.dataset.client)} if(e.key==='Escape'){ document.querySelectorAll('.modal').forEach(m=>m.remove()); closeCmdk(); } });
document.addEventListener('change',e=>{ if(e.target.id==='mobilePick') go(e.target.value||null) });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state.q=e.target.value; const nav=root.querySelector('.sidebar'); if(nav){ const pos=e.target.selectionStart; nav.innerHTML=sidebar(); const q=root.querySelector('#q'); q.value=state.q; q.focus(); q.setSelectionRange(pos,pos); } } });

async function syncNow(){ if(!CFG.syncUrl) return; toast('Sync started, this takes a minute…','warn'); try{ const r=await fetch(CFG.syncUrl+(CFG.syncUrl.includes('?')?'&':'?')+'mode=hourly',{method:'POST',headers:{'Authorization':'Bearer '+(CFG.syncKey||'')}}); if(!r.ok) throw new Error('HTTP '+r.status); toast('Sync finished, reloading data'); boot(true); }catch(e){ toast('Sync failed: '+e.message,'warn'); } }
function gate(msg,err){ root.innerHTML='<div class="gate"><div class="glass card"><div class="brand" style="padding:0 0 14px"><div class="mark disp">PERFORMANCE</div><div class="sub">Desk · Per4mance Guru</div></div><h1 class="disp">Team sign-in</h1><p>'+msg+'</p><button class="btn btn-primary" style="width:100%;justify-content:center" data-act="signin">Sign in with Google</button>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</div></div>'; }
async function signIn(){ try{ const p=new firebase.auth.GoogleAuthProvider(); if((CFG.allowedDomains||[]).length===1) p.setCustomParameters({hd:CFG.allowedDomains[0]}); await fb.auth.signInWithPopup(p); }catch(e){ gate('Use your Per4mance Guru Google account.',e.message); } }
async function boot(refresh){
  if(!LIVE){ root.innerHTML='<div class="loading">Loading sample data…</div>'; D=await loadDemo(); readHash(); render(); return; }
  if(!fb){ root.innerHTML='<div class="loading">Loading…</div>'; try{ await initFirebase(); }catch(e){ root.innerHTML='<div class="loading">Could not load Firebase: '+esc(e.message)+'</div>'; return; }
    fb.auth.onAuthStateChanged(async(u)=>{ if(!u){ gate('Use your Per4mance Guru Google account.'); return; } if(!allowedEmail(u.email)){ await fb.auth.signOut(); gate('Use your Per4mance Guru Google account.','That Google account is not on the allowed list ('+u.email+').'); return; } boot(true); }); return; }
  root.innerHTML='<div class="loading">Loading data…</div>';
  try{ D=await loadLive(); }catch(e){ root.innerHTML='<div class="loading">Could not read data: '+esc(e.message)+'. Check Firestore rules and that the backend has run at least once.</div>'; return; }
  readHash(); render(); if(refresh===true&&D) toast('Data refreshed');
}
boot();
})();
</script>
