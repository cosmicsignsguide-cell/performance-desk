  else if(act==='copylink'){ navigator.clipboard?.writeText(el.dataset.url).then(()=>toast('Link copied')).catch(()=>toast('Copy failed')); }
  else if(act==='copyalllinks'){ const m=el.closest('.modal'); navigator.clipboard?.writeText(m._text||'').then(()=>toast('Links copied')).catch(()=>toast('Copy failed')); }
  else if(act==='metric'){ metricModal(el.dataset.metric); }
  else if(act==='closemodal'){ el.closest('.modal').remove(); }
  else if(act==='copytext'){ const ta=document.getElementById('updText'); ta.select(); navigator.clipboard?.writeText(ta.value).catch(()=>{}); try{document.execCommand('copy')}catch(err){} toast('Update copied to clipboard'); }
  else if(act==='cmdk'){ openCmdk(); }
  else if(act==='refresh'){ boot(true); }
  else if(act==='syncnow'){ syncNow(); }
  else if(act==='signout'){ fb.auth.signOut().then(()=>location.reload()); }
  else if(act==='signin'){ signIn(); }
  else if(act==='theme'){ toggleTheme(); }
});
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); if(cmdk.classList.contains('open')) closeCmdk(); else openCmdk(); } if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.rowlink')){e.preventDefault();go(e.target.dataset.client)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kpi-card.clickable')){e.preventDefault();metricModal(e.target.dataset.metric)} if(e.key==='Escape'){ document.querySelectorAll('.modal').forEach(m=>m.remove()); closeCmdk(); } });
document.addEventListener('change',e=>{ if(e.target.id==='mobilePick') go(e.target.value||null) });
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state.q=e.target.value; const nav=root.querySelector('.sidebar'); if(nav){ const pos=e.target.selectionStart; nav.innerHTML=sidebar(); const q=root.querySelector('#q'); q.value=state.q; q.focus(); q.setSelectionRange(pos,pos); } } });

// Sync is authorised with the signed-in user's own Firebase ID token, not with a shared secret.
// The token is short lived and issued per person, so nothing that reaches the browser here is
// worth stealing. A static host serves config.js to anyone who asks, logged in or not, which is
// why the sync key must never live in it.
async function syncNow(){
  if(!CFG.syncUrl) return;
  const u=fb&&fb.auth&&fb.auth.currentUser;
  if(!u){ toast('Sign in first to run a sync','warn'); return; }
  toast('Sync started, this takes a minute…','warn');
  try{
    const tok=await u.getIdToken();
    const r=await fetch(CFG.syncUrl+(CFG.syncUrl.includes('?')?'&':'?')+'mode=hourly',{method:'POST',headers:{'Authorization':'Bearer '+tok}});
    if(r.status===401) throw new Error('this account can open the dashboard but is not cleared to sync. Add it to DESK_ALLOWED_EMAILS on the API service.');
    if(!r.ok) throw new Error('HTTP '+r.status);
    toast('Sync finished, reloading data'); boot(true);
  }catch(e){ toast('Sync failed: '+e.message,'warn'); }
}
function gate(msg,err){ root.innerHTML='<div class="gate"><div class="glass card"><div class="brand" style="padding:0 0 14px"><div class="mark disp">PERFORMANCE</div><div class="sub">Desk · Per4mance Guru</div></div><h1 class="disp">Team sign-in</h1><p>'+msg+'</p><button class="btn btn-primary" style="width:100%;justify-content:center" data-act="signin">Sign in with Google</button>'+(err?'<div class="err">'+esc(err)+'</div>':'')+'</div></div>'; }
// The hd hint tells Google to show only one workspace domain's accounts. Useful when the team is
// entirely on that domain, wrong the moment a single outside address is allowed too, so it only
// applies when allowedEmails is empty.
// Sign-in failures are not all the same failure, and the page used to call every one of them
// "that account does not have access". Someone whose browser blocked the popup was told they were
// not allowed in, which sends them to an admin for a permission they already have. Each cause now
// gets its own sentence.
const AUTH_SAYS={
  'auth/popup-blocked':        ['Your browser blocked the sign-in window.','Allow pop-ups for this site, or press the button again to sign in on this page instead.'],
  'auth/popup-closed-by-user': ['The sign-in window was closed before it finished.',''],
  'auth/cancelled-popup-request':['Sign-in was interrupted. Try once more.',''],
  'auth/network-request-failed':['Could not reach Google to sign you in.','Check the connection and try again.'],
  'auth/unauthorized-domain':  ['This address is not on the Firebase authorised domain list.','An admin adds it under Authentication, Settings, Authorised domains.'],
  'auth/operation-not-allowed':['Google sign-in is switched off for this Firebase project.','An admin turns it on under Authentication, Sign-in method.'],
};
async function signIn(){
  const p=new firebase.auth.GoogleAuthProvider();
  // The hd hint shows only one workspace domain's accounts. Right when the whole team is on that
  // domain, wrong the moment one outside address is allowed, so it waits on allowedEmails.
  if((CFG.allowedDomains||[]).length===1&&!(CFG.allowedEmails||[]).length) p.setCustomParameters({hd:CFG.allowedDomains[0]});
  try{ await fb.auth.signInWithPopup(p); }
  catch(e){
    const code=e&&e.code||'';
    // A blocked popup is the browser's decision, not a reason to give up. Redirect signs in on
    // this page instead, which no pop-up blocker can stop.
    if(code==='auth/popup-blocked'||code==='auth/cancelled-popup-request'){
      try{ await fb.auth.signInWithRedirect(p); return; }catch(e2){ /* fall through to the message */ }
    }
    const said=AUTH_SAYS[code];
    gate(said?said[0]:'Could not sign you in.', said&&said[1]?said[1]:(e&&e.message||String(e)));
  }
}
async function boot(refresh){
  if(!LIVE){ root.innerHTML='<div class="loading">Loading sample data…</div>'; D=await loadDemo(); readHash(); render(); return; }
  if(!fb){ root.innerHTML='<div class="loading">Loading…</div>'; try{ await initFirebase(); }catch(e){ root.innerHTML='<div class="loading">Could not load Firebase: '+esc(e.message)+'</div>'; return; }
    // A redirect sign-in lands back here. Its result is checked so a failure on the way back is
    // reported rather than showing a blank gate the user cannot explain.
    fb.auth.getRedirectResult().catch((e)=>{ const said=AUTH_SAYS[e&&e.code||'']; if(said||e) gate(said?said[0]:'Could not sign you in.', said&&said[1]?said[1]:(e&&e.message||'')); });
    fb.auth.onAuthStateChanged(async(u)=>{ if(!u){ gate('Use your Per4mance Guru Google account.'); return; } if(!allowedEmail(u.email)){ await fb.auth.signOut(); gate('Use your Per4mance Guru Google account.','That Google account is not on the allowed list ('+u.email+').'); return; } boot(true); }); return; }
  root.innerHTML='<div class="loading">Loading data…</div>';
  try{ D=await loadLive(); }catch(e){ root.innerHTML='<div class="loading">Could not read data: '+esc(e.message)+'. Check Firestore rules and that the backend has run at least once.</div>'; return; }
  readHash(); render(); if(refresh===true&&D) toast('Data refreshed');
  startLive();
}

/* ============================== LIVE ==================================== */
// Two things make a dashboard feel live, and only one of them is animation. The numbers have to
// actually move: every 60 seconds this re-reads Firestore in the background and re-renders, and any
// figure that changed flashes once so you can see what moved without hunting for it. The freshness
// line ticks on its own in between, so "updated 2 min ago" is never a lie left over from page load.
let liveTimer=null, clockTimer=null, lastVals=null;
function snapshotVals(){ const m={}; root.querySelectorAll('.kpi-card').forEach(card=>{ const k=card.querySelector('.kpi-label'), v=card.querySelector('.kpi-value'); if(k&&v) m[k.textContent]=v.textContent; }); return m; }
function flashChanged(before){
  if(!before) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  root.querySelectorAll('.kpi-card').forEach(card=>{
    const k=card.querySelector('.kpi-label'), v=card.querySelector('.kpi-value');
    if(k&&v&&before[k.textContent]!==undefined&&before[k.textContent]!==v.textContent) v.classList.add('changed');
  });
}
function tickClock(){
  const el=root.querySelector('[data-ago]');
  if(el) el.textContent=ago(el.getAttribute('data-ago'));
}
function startLive(){
  clearInterval(liveTimer); clearInterval(clockTimer);
  clockTimer=setInterval(tickClock,20000);
  if(!LIVE) return;
  liveTimer=setInterval(async()=>{
    if(document.hidden) return;                  // no point polling a tab nobody is looking at
    const ae=document.activeElement;
    if(ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;   // someone is typing; try again next minute
    try{
      const fresh=await loadLive();
      const before=snapshotVals();
      D=fresh; animateNext=false; render(); flashChanged(before);
    }catch(e){ /* a failed poll is not worth interrupting anyone over; the next one retries */ }
  },60000);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tickClock(); });
boot();
})();
