<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Per4mance Desk</title>
<meta name="description" content="Per4mance Guru internal dashboard: every client's Meta, Google and Shopify numbers, creative ranking, funnel leakage and site checks in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Surfaces ================================================================================
   Three tones and no more: page, card, and a hairline between them. The old build carried a heavy
   beige page, a second beige on every panel, gradients on both, and a blurred glass layer over the
   lot, which meant four competing surfaces before a single number was drawn. Depth now comes from
   one 1px border and one soft shadow, so the numbers are the only thing with contrast. */
:root{
  --bg:#FAF9F7; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-hover:rgba(23,23,23,0.035);
  --border:#E8E5E0; --border-strong:#D6D2CB;
  /* Accent marks live state and critical, nothing else. Good/warn/bad carry meaning on their own. */
  --accent:#F06445; --accent-2:#D94E30; --accent-soft:rgba(240,100,69,0.10); --accent-line:rgba(240,100,69,0.32); --accent-glow:rgba(240,100,69,0.20);
  --ink:#171717; --ink-soft:rgba(23,23,23,0.9);
  --lattice:rgba(23,23,23,0.014); --rail:rgba(250,249,247,0.86); --sheen:transparent; --panel-top:#FFFFFF; --panel-bot:#FFFFFF;
  /* Data series ramp: coral lead, soft blue, muted green, warm ochre. Four hues, held quiet. */
  --cyan:#F06445; --violet:#6687B8; --blue:#B6761F; --magenta:#2E8B68;
  --green:#2E8B68; --green-bg:rgba(46,139,104,0.11); --amber:#B6761F; --amber-bg:rgba(182,118,31,0.12); --red:#F06445; --red-bg:rgba(240,100,69,0.10); --idle:#9A968E; --idle-bg:rgba(154,150,142,0.13);
  --text:#171717; --dim:#4C4A46; --faint:#6B6B6B; --line:#EFECE7;
  --radius:12px;
  /* One shadow scale. Anything heavier than lift-2 is decoration. */
  --lift-1:0 1px 2px rgba(23,23,23,0.04);
  --lift-2:0 1px 2px rgba(23,23,23,0.04),0 8px 20px -14px rgba(23,23,23,0.22);
  --lift-3:0 2px 4px rgba(23,23,23,0.04),0 16px 34px -18px rgba(23,23,23,0.30);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The toggle stays. Dark is retuned to the same system rather than removed, because the team reads
   this on a wall screen in the evening and the switch is already in the header. */
:root[data-theme="dark"]{
  --bg:#141312; --bg-2:#1C1B19; --panel:#1C1B19; --panel-hover:rgba(255,255,255,0.05); --border:#2C2A27; --border-strong:#403D38;
  --cyan:#FF7A5C; --violet:#8AA8D6; --blue:#D9A44E; --magenta:#4FB98C; --green:#4FB98C; --green-bg:rgba(79,185,140,0.14); --amber:#D9A44E; --amber-bg:rgba(217,164,78,0.13); --red:#FF7A5C; --red-bg:rgba(255,122,92,0.13); --idle:#7C7871; --idle-bg:rgba(124,120,113,0.16);
  --text:#F3F1ED; --dim:#B9B4AC; --faint:#8C877F; --line:#262421;
  --accent:#FF7A5C; --accent-2:#F06445; --accent-soft:rgba(255,122,92,0.12); --accent-line:rgba(255,122,92,0.34); --accent-glow:rgba(255,122,92,0.24);
  --ink:#F3F1ED; --lattice:rgba(255,255,255,0.016); --rail:rgba(20,19,18,0.88); --sheen:transparent; --panel-top:#1C1B19; --panel-bot:#1C1B19;
  --lift-1:0 1px 2px rgba(0,0,0,0.3); --lift-2:0 1px 2px rgba(0,0,0,0.3),0 8px 20px -14px rgba(0,0,0,0.6); --lift-3:0 2px 4px rgba(0,0,0,0.3),0 16px 34px -18px rgba(0,0,0,0.7);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* One flat page tone with a grid you have to look for. The old build stacked two coloured radial
   washes and three blurred blobs behind everything, which tinted every white surface sitting on
   top of it and made the whole screen read pink. */
body{background-color:var(--bg);
  background-image:linear-gradient(var(--lattice) 1px,transparent 1px),linear-gradient(90deg,var(--lattice) 1px,transparent 1px);
  background-size:64px 64px,64px 64px;background-attachment:fixed;
  color:var(--text);font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"tnum" 1,"cv05" 1}
.disp{font-family:"Inter",sans-serif;letter-spacing:-.025em}
/* Instrument labels: mono, uppercase, tracked. Used for every micro-label so the eye reads them as
   scale markings rather than as prose. */
.mlabel{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:10px;font-weight:500;text-transform:none;letter-spacing:.012em;color:var(--faint)}
button{font-family:inherit;cursor:pointer;color:inherit} input,select,textarea{font-family:inherit;color:inherit}
::selection{background:rgba(232,84,58,0.28)}
a{color:var(--cyan)}

/* ambient: retired. The blobs and the masked grid are kept as no-op selectors because the markup
   still emits the elements; killing the paint is cheaper and safer than editing the shell. */
.bg-blobs,.blob,.bg-grid{display:none}

/* ---- Boot screen -----------------------------------------------------------------------------
   Near-black rather than pure black, because #000 against a warm-white dashboard is a hard cut
   that reads as a flash. The mark lands first, the wordmark wipes in behind it, and a hairline
   fills while the data loads. Then the whole plate lifts and scales away, so the dashboard looks
   like it was underneath the whole time instead of appearing from nowhere. */
.boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0B0A09;
  transition:opacity .52s cubic-bezier(.4,0,.2,1),transform .52s cubic-bezier(.4,0,.2,1),visibility .52s;
  will-change:opacity,transform}
.boot::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(760px 420px at 50% 46%,rgba(240,100,69,.10),transparent 68%)}
.boot-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.boot-mark{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
  font-family:"Inter",sans-serif;font-size:25px;font-weight:800;letter-spacing:-.05em;color:#fff;background:#F06445;
  box-shadow:0 0 0 0 rgba(240,100,69,.45);
  animation:bootMark .62s cubic-bezier(.2,1.25,.35,1) both,bootHalo 2.1s ease-out .5s infinite}
@keyframes bootMark{from{opacity:0;transform:scale(.55) translateY(8px)}to{opacity:1;transform:none}}
@keyframes bootHalo{0%{box-shadow:0 0 0 0 rgba(240,100,69,.34)}70%{box-shadow:0 0 0 22px rgba(240,100,69,0)}100%{box-shadow:0 0 0 0 rgba(240,100,69,0)}}
.boot-word{margin-top:26px;font-family:"Inter",sans-serif;font-size:clamp(26px,4.6vw,42px);font-weight:800;
  letter-spacing:.02em;line-height:1;color:#F7F4F0;white-space:nowrap;
  clip-path:inset(0 100% 0 0);animation:bootWipe .72s cubic-bezier(.22,.9,.28,1) .26s both}
.boot-word i{font-style:normal;color:#F06445}
@keyframes bootWipe{to{clip-path:inset(0 0 0 0)}}
.boot-sub{margin-top:14px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;
  text-transform:none;letter-spacing:.34em;color:#8C8780;white-space:nowrap;
  animation:bootFade .6s ease-out .62s both}
@keyframes bootFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* The hairline is a real signal: it creeps to 88% on its own, then the app's own ready callback
   drives it home. A progress bar that lies about progress is worse than none. */
.boot-rule{margin-top:30px;width:min(212px,52vw);height:1px;background:rgba(255,255,255,.10);overflow:hidden;display:block}
.boot-rule i{display:block;height:100%;width:0;background:#F06445;
  animation:bootFill 2.4s cubic-bezier(.16,.72,.24,1) .34s both}
@keyframes bootFill{to{width:88%}}
.boot.done .boot-rule i{width:100%;transition:width .3s ease-out}
.boot.leaving{opacity:0;transform:scale(1.035);visibility:hidden;pointer-events:none}
/* Nothing here is load-bearing, so anyone who asked for less motion gets the dashboard directly. */
@media (prefers-reduced-motion:reduce){
  .boot{display:none}
  .boot-mark,.boot-word,.boot-sub,.boot-rule i{animation:none}
}

/* Surfaces. No blur, no gradient, no inner sheen: a white card, a hairline, and one soft shadow. */
.glass{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--lift-1)}
.glass-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;position:relative;transition:border-color .18s ease,box-shadow .18s ease;min-width:0;box-shadow:var(--lift-1)}
.glass-panel:hover{border-color:var(--border-strong);box-shadow:var(--lift-2)}
.glass-panel h2,.panel-title{font-size:14px;font-weight:650;letter-spacing:-.012em;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-title .sub,.glass-panel h2 .sub{font-size:11.5px;color:var(--faint);font-weight:450;letter-spacing:0}

/* shell */
.app-shell{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;padding:20px 14px;background:var(--rail);border-right:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:6px 8px 14px}
.brand .mark{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.brand .sub{font-size:10.5px;color:var(--faint);letter-spacing:1.5px;margin-top:3px;text-transform:none}
.status-row{display:flex;align-items:center;gap:7px;padding:0 8px 14px;font-size:10.5px;font-weight:600;letter-spacing:.6px;color:var(--faint)}
.status-row .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);position:relative}
.status-row.on .dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:dotPulse 2s infinite}
.status-row.demo .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.5}}
.side-search{margin:0 4px 10px;position:relative}
.side-search input{width:100%;padding:8px 10px 8px 30px;border-radius:9px;border:1px solid var(--border);background:var(--panel-hover);font-size:12.5px;color:var(--text)}
.side-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--faint)}
.side-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nav-list{list-style:none;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;min-height:0}
.nav-sep{font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--faint);padding:12px 10px 4px;text-transform:none}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--dim);cursor:pointer;outline:none;transition:background .15s,color .15s;border:0;background:none;width:100%;text-align:left}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:var(--panel-hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
/* Roster rows carry their own share of spend, so scanning the sidebar shows where the money sits
   before you open anything. */
.nav-item{position:relative}
.nav-list .nav-item.client{padding-bottom:14px}
.share{position:absolute;left:30px;right:14px;bottom:6px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.share i{display:block;height:100%;border-radius:3px;background:var(--accent);opacity:.45}
.nav-item:hover .share i,.nav-item.active .share i{opacity:.8}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:var(--cyan)}
.nav-item:focus-visible{box-shadow:inset 0 0 0 2px var(--cyan)}
.nav-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .tp{font-size:10px;color:var(--faint);text-transform:none;letter-spacing:.5px}
.hdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--idle)}
.hdot.good{background:var(--green)} .hdot.warn{background:var(--amber)} .hdot.bad{background:var(--red)}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--red-bg);color:var(--red);padding:1px 6px;border-radius:8px}
.cmdk-hint{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;margin:8px 0;border-radius:9px;background:var(--panel);border:1px solid var(--border);font-size:11.5px;color:var(--faint);cursor:pointer}
.cmdk-hint kbd{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:10px;background:rgba(20,20,20,0.07);padding:2px 6px;border-radius:4px;color:var(--dim)}
.user-block{display:flex;align-items:center;gap:10px;padding-top:12px;margin-top:8px;border-top:1px solid var(--line)}
.user-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;background:var(--accent);display:grid;place-items:center;font-weight:650;font-size:12px;color:#fff}
.user-meta{min-width:0;flex:1}
.user-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10.5px;color:var(--faint)}
.user-block .icon-btn{margin-left:auto}

.main{min-width:0;padding:26px 32px 70px}
.main-client{max-width:1380px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:25px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
.page-head .subtitle{font-size:12.5px;color:var(--dim);max-width:80ch}
.page-head .meta{font-size:12px;color:var(--faint);text-align:right}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;margin-bottom:12px;background:none;border:0;padding:0}
.detail-back:hover{color:var(--cyan)} .detail-back svg{width:14px;height:14px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.toolbar .grow{flex:1}

.btn{border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:550;transition:transform .16s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(23,23,23,.08)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:var(--panel);color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-strong)}
.btn-small{padding:6px 11px;font-size:11.5px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.icon-btn{background:none;border:none;color:var(--faint);padding:4px 6px;border-radius:6px} .icon-btn:hover{color:var(--text);background:var(--panel-hover)} .icon-btn svg{width:14px;height:14px;display:block}
.tab-row{display:flex;gap:6px;flex-wrap:wrap}
.tab-btn{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--border);color:var(--dim)}
.tab-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border:0;border-radius:7px;background:none;font-size:12px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;line-height:1.5}
.chip.good{background:var(--green-bg);color:var(--green)} .chip.warn{background:var(--amber-bg);color:var(--amber)} .chip.bad{background:var(--red-bg);color:var(--red)} .chip.neutral{background:var(--idle-bg);color:var(--idle)} .chip.accent{background:var(--accent-soft);color:var(--cyan)} .chip.violet{background:rgba(63,58,52,0.13);color:var(--dim)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.delta{font-size:11.5px;font-weight:600} .delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--faint)}
.muted{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:11.5px}

/* hero + kpis */
/* Masthead: the whole book of business in one frame. The ribbon is one bar per client, height by
   share of spend, colour by health, so 31 accounts read as a single shape before any number does. */
.masthead{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:30px;align-items:end;padding:22px 26px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.masthead::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 200px at 8% 120%,var(--accent-soft),transparent 70%)}
.mh-block{position:relative;z-index:1}
.mh-eyebrow{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;font-weight:500;text-transform:none;letter-spacing:.012em;color:var(--faint);margin-bottom:7px}
.mh-num{font-size:66px;font-weight:800;line-height:.92;letter-spacing:-.04em;color:var(--text);font-variant-numeric:tabular-nums}
.mh-read{font-size:13px;font-weight:600;color:var(--dim);margin-top:9px} .mh-sub{font-size:12px;color:var(--faint);margin-top:2px}
.mh-side{display:flex;gap:30px;align-items:flex-end;flex-wrap:wrap}
.mh-fig .v{font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums} .mh-fig .l{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint);margin-top:5px}
.ribbon-wrap{position:relative;z-index:1}
/* The Pulse: an instrument trace, so it gets instrument treatment. Hairline baseline, thin strokes
   with a soft bloom, and a sweep that reads as a monitor rather than as a loading bar. */
.pulse-wrap{position:relative}
.pulse{width:100%;height:132px;display:block;overflow:visible}
.mod-pulse .mod-body{display:flex;flex-direction:column;justify-content:center}
.pulse-base{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.pulse .beat{fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px currentColor);opacity:.95}
.pulse .beat-hit{fill:transparent;cursor:pointer}
.pulse .beat-hit:hover{fill:var(--accent);opacity:.07}
.pulse .sweep{fill:url(#sweepGrad);pointer-events:none;transform-origin:left center;
  animation:sweepRun 5.2s linear infinite}
@keyframes sweepRun{from{transform:translateX(-34%)}to{transform:translateX(295%)}}
.rl-note{margin-left:auto;opacity:.75}
@media (max-width:960px){.pulse{height:76px}}
.ribbon{display:flex;align-items:flex-end;gap:3px;height:84px}
.ribbon i{flex:1 1 0;min-width:4px;max-width:30px;border-radius:3px 3px 0 0;background:var(--idle);opacity:.85;transform-origin:bottom;animation:riseIn .55s cubic-bezier(.2,.85,.25,1) both;cursor:pointer;transition:opacity .15s}
.ribbon i:hover{opacity:1}
.ribbon i.good{background:linear-gradient(180deg,#34D399,var(--green))}
.ribbon i.warn{background:linear-gradient(180deg,#FBBF24,var(--amber))}
.ribbon i.bad{background:linear-gradient(180deg,#F87171,var(--red))}
.ribbon-legend{display:flex;gap:14px;margin-top:10px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint)}
.ribbon-legend span{display:flex;align-items:center;gap:5px} .ribbon-legend b{width:7px;height:7px;border-radius:2px;display:inline-block}
/* Portfolio map */
.pm-wrap{padding:16px 18px 14px}
.chart.pm{width:100%;height:auto;display:block}
.chart.pm text{font-size:11px;fill:var(--faint);font-family:"Hanken Grotesk",system-ui,sans-serif}
.chart.pm .quad{font-size:10px;letter-spacing:.012em;fill:var(--faint);opacity:.75;font-weight:600}
.chart.pm .tgt{stroke:var(--border-strong);stroke-dasharray:5 5;stroke-width:1}
.pm-dot{cursor:pointer}
.pm-dot text{fill:var(--dim);font-size:10.5px;opacity:0;transition:opacity .16s}
.pm-dot:hover text{opacity:1} .pm-dot circle{transition:transform .16s;transform-origin:center;transform-box:fill-box}
.pm-dot:hover circle{transform:scale(1.12)}
.pm-read{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.pm-read b{color:var(--text);font-weight:650}
/* Theme switch */
.theme-btn{margin-left:auto}


/* ======================= THE BAND ==============================================================
   Editorial scale, not dashboard scale. One field of colour across the head of the screen, taking
   its hue from the worst thing currently true. On an office screen you read the state from across
   the room; the numbers are for when you walk up to it. */
.band{grid-column:span 12;border-radius:14px;padding:26px 30px 24px;position:relative;overflow:hidden;
  border:1px solid var(--band-line);background:var(--band-bg)}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 300px at 0% 0%,var(--band-glow),transparent 62%)}
.band.good{--band-bg:linear-gradient(120deg,rgba(46,125,91,.13),rgba(46,125,91,.03) 52%,transparent);--band-line:rgba(46,125,91,.24);--band-glow:rgba(46,125,91,.13);--band-ink:var(--green)}
.band.warn{--band-bg:linear-gradient(120deg,rgba(176,118,28,.14),rgba(234,217,199,.35) 52%,transparent);--band-line:rgba(176,118,28,.24);--band-glow:rgba(176,118,28,.14);--band-ink:var(--amber)}
.band.bad{--band-bg:linear-gradient(120deg,rgba(232,84,58,.16),rgba(232,84,58,.04) 52%,transparent);--band-line:rgba(232,84,58,.30);--band-glow:rgba(232,84,58,.18);--band-ink:var(--red)}
.band-glyph{position:absolute;right:-18px;top:50%;transform:translateY(-50%);z-index:0;pointer-events:none;
  font-size:300px;font-weight:900;line-height:.72;letter-spacing:-.07em;color:var(--band-ink);opacity:.055;user-select:none}
.band-sig{position:relative;z-index:1;margin-top:22px;padding-top:14px;border-top:1px solid var(--band-line);
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.band-sig em{font-style:normal;font-size:12px;font-weight:650;letter-spacing:-.005em;color:var(--dim)}
.band-sig em b{font-weight:800;color:var(--accent)}
.band-sig small{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;
  letter-spacing:.012em;color:var(--faint)}
.band-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.band-state{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:11px;font-weight:600;text-transform:none;letter-spacing:.012em;color:var(--band-ink)}
.band-when{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:10px;text-transform:none;letter-spacing:.012em;color:var(--faint)}
.band-row{position:relative;z-index:1;display:flex;align-items:flex-end;gap:clamp(22px,4vw,64px);flex-wrap:wrap}
.band-fig b{display:block;font-size:clamp(34px,4.2vw,62px);font-weight:800;line-height:.88;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--text)}
.band-fig.lead b{font-size:clamp(64px,9vw,132px);color:var(--band-ink)}
.band-fig b.hot{color:var(--red)}
.band-fig span{display:block;white-space:nowrap;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:10px;text-transform:none;letter-spacing:.012em;color:var(--faint);margin-top:12px}
.band-fig.lead span{margin-top:16px;font-size:11px;color:var(--dim);letter-spacing:.012em}

/* The trace runs edge to edge with no panel. It is the one thing on the screen with no frame. */
.bleed{grid-column:span 12;margin:2px 0 0}
.bleed-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:2px;flex-wrap:wrap}
.bleed-head>span:first-child{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:11px;font-weight:600;text-transform:none;letter-spacing:.012em;color:var(--text)}
.bleed-head>span:last-child{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint)}
.bleed .pulse{height:148px}
.bleed .pulse .beat{stroke-width:2.2}
@media (max-width:900px){ .band{padding:20px 18px} .bleed .pulse{height:140px} }
/* ======================= MISSION CONTROL WALL ==================================================
   Not a page with a sidebar. A single surface of modules, sized so a 31 account book fits in one
   frame. Modules are framed panels with a mono header and a hairline rule, the way instrument racks
   are labelled, rather than floating cards with soft shadows. Radius drops to 10px and padding
   tightens: density is the point, and rounded airy cards read as a marketing site, not a desk. */
.app-shell{display:block;min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;
  padding:0 30px;height:60px;background:rgba(250,249,247,0.88);border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.rail-brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;flex-shrink:0}
.rail-brand:hover .rail-mark{transform:rotate(-6deg)}
.rail-mark{transition:transform .2s cubic-bezier(.2,.8,.25,1)}
.rail-mark{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;letter-spacing:-.04em;
  background:var(--accent);color:#fff;box-shadow:none}
.rail-name{font-size:13.5px;font-weight:800;letter-spacing:.005em;text-transform:none;line-height:1}
.rail-name i{font-style:normal;color:var(--accent)}
.rail-name u{display:block;text-decoration:none;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:8px;font-weight:400;
  letter-spacing:.012em;color:var(--faint);margin-top:2px}
.rail-live{display:flex;align-items:center;gap:7px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint);flex-shrink:0}
.rail-live .dot{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.rail-live.on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(46,139,104,.16);animation:dotPulse 2.4s ease-in-out infinite}
.rail-live.demo .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(182,118,31,.16)}
.rail-live .sep{opacity:.4} .rail-bad{color:var(--red)}
.rail-mid{margin:0 auto}
.rail-search{display:flex;align-items:center;gap:10px;padding:5px 9px 5px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-hover);color:var(--faint);font-size:12px;flex-shrink:0}
.rail-search span{display:flex;align-items:center;gap:6px} .rail-search svg{width:13px;height:13px}
.rail-search kbd{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;background:var(--bg);padding:2px 5px;border-radius:4px;border:1px solid var(--border)}
.rail-search:hover{border-color:var(--accent-line);color:var(--dim)}
.rail-user{display:flex;align-items:center;gap:4px;flex-shrink:0}
.user-avatar.sm{width:26px;height:26px;font-size:11px}
.seg.tiny button{padding:3px 9px;font-size:11px}

/* Wider gutters and more air inside each module. Density was already won by the layout; what the
   page was missing was the whitespace that lets density read as deliberate rather than cramped. */
.main-wall{max-width:1720px;margin:0 auto;padding:26px 30px 56px;
  display:grid;gap:20px;
  grid-template-columns:repeat(12,minmax(0,1fr));
  align-content:start;align-items:start}
.mod{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--lift-1);display:flex;flex-direction:column;min-width:0;overflow:hidden;
  transition:box-shadow .18s ease,border-color .18s ease}
.mod:hover{box-shadow:var(--lift-2)}
.mod-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.mod-head>span:first-child{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;font-weight:500;text-transform:none;letter-spacing:.012em;color:var(--faint)}
.mod-head>span:last-child{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint);text-align:right;opacity:.8}
.mod-body{padding:20px;min-width:0;flex:1}

.mod-book{grid-column:span 3} .mod-pulse{grid-column:span 6} .mod-sites{grid-column:span 3}
.mod-wall{grid-column:span 8;align-self:stretch;min-height:320px} .mod-queue{grid-column:span 4;align-self:stretch;height:0;min-height:100%} .mod-detail{grid-column:span 12}

.book-num{font-size:52px;font-weight:800;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  color:var(--text)}
.book-read{font-size:12px;color:var(--dim);margin-top:7px;font-weight:600}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.book-grid b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.book-grid span{display:block;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9px;text-transform:none;letter-spacing:.012em;color:var(--faint);margin-top:3px}
.book-budget{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:var(--faint)}

.site-big{font-size:42px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.site-big.good{color:var(--green)} .site-big.bad{color:var(--red)}
.site-read{font-size:12px;color:var(--dim);margin-top:5px;font-weight:600}
.site-none{font-size:11.5px;color:var(--faint);margin-top:11px;line-height:1.5}
.site-list{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.site-list li{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;min-width:0}
.site-list li:hover{color:var(--accent)}
.site-list em{font-family:"Hanken Grotesk",system-ui,sans-serif;font-style:normal;font-size:9.5px;color:var(--faint);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}

/* The wall itself. Every account, no scrolling past anything, worst first. */
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(204px,1fr));gap:12px;padding:18px;align-content:start;align-items:start;grid-auto-rows:min-content}
.tile{position:relative;overflow:hidden;text-align:left;padding:13px 14px 0;border-radius:10px;cursor:pointer;color:inherit;
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--idle);box-shadow:var(--lift-1);
  display:flex;flex-direction:column;min-height:132px;
  transition:transform .14s cubic-bezier(.2,.8,.25,1),box-shadow .14s,border-color .14s}
.tile.good{border-left-color:var(--green)} .tile.warn{border-left-color:var(--amber)} .tile.bad{border-left-color:var(--red)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--lift-2);border-color:var(--border-strong)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.tile-name{font-size:12.5px;font-weight:650;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-flags{margin-left:auto;flex-shrink:0;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--red-bg);color:var(--red)}
.tile-kpi{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile-kpi.good{color:var(--green)} .tile-kpi.warn{color:var(--amber)} .tile-kpi.bad{color:var(--red)}
.tile-kpi i{font-style:normal;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9px;font-weight:500;color:var(--faint);margin-left:4px;letter-spacing:0}
.tile-row{display:flex;justify-content:space-between;gap:6px;margin-top:5px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;color:var(--faint)}
.tile .kpi-spark{width:calc(100% + 20px);margin:auto -10px 0;height:32px;opacity:.85}
.tile:hover .kpi-spark{opacity:1}

.queue-body{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;max-height:none;overflow-y:auto;padding:18px}
.queue-body .attn-item{padding:9px 11px 9px 10px;border-radius:9px}
.queue-body .attn-item .t1{font-size:12px} .queue-body .attn-item .go{display:none}
.mod-detail{background:none;border:0;box-shadow:none;border-radius:0}
.mod-detail .mod-head{padding:0 0 9px;border-bottom:1px solid var(--border)}
.mod-detail .mod-head>span:first-child{font-family:inherit;font-size:13px;font-weight:750;letter-spacing:-.012em;text-transform:none}
.mod-detail .mod-body{padding:0} .mod-detail .data-table-wrap{border:0;background:none}
.mod-detail .section{margin:0} .mod-detail .section-head{display:none} .mod-detail .glass-panel{border:0;background:none;padding:13px}

@media (max-width:1280px){ .mod-book{grid-column:span 4} .mod-pulse{grid-column:span 8} .mod-sites{grid-column:span 4}
  .mod-wall{grid-column:span 8} .mod-queue{grid-column:span 12} }
@media (max-width:900px){ .mod-book,.mod-pulse,.mod-sites,.mod-wall,.mod-queue,.mod-detail{grid-column:span 12}
  .rail{flex-wrap:wrap;height:auto;padding:8px 14px;gap:10px} .rail-mid{margin:0;order:9;width:100%} .rail-search{display:none} }

/* ======================= The briefing desk ===================================================
   A performance desk is read at 9am by an AM with a coffee, and from ten feet by whoever walks
   past the wall screen. So the head of the page is a written briefing, not a row of big numbers:
   sentences that name the account and the problem, with the figures set small and exact beside
   them. Vermilion is rationed - it marks critical and nothing else, so when it appears it means
   something. Everything else is ink on sand. ============================================== */
/* The briefing sits on its own line and the figures get the full width underneath, as a row of
   cards. Squeezed into a 1fr column beside a 29px headline they were 88px wide and read as a
   spec table; the page's five most important numbers should not be the smallest thing on it. */
.brief{grid-column:span 12;padding:14px 0 30px;border-bottom:1px solid var(--border);
  display:grid;grid-template-columns:minmax(0,1fr);gap:30px;align-items:end}
.brief-when{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;
  color:var(--faint);margin-bottom:18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brief-when i{font-style:normal;width:5px;height:5px;border-radius:50%;background:var(--green)}
.brief-when i.warn{background:var(--amber)} .brief-when i.bad{background:var(--red)}
.brief-hi{font-size:13.5px;font-weight:550;letter-spacing:-.005em;color:var(--dim);margin-bottom:12px}
.brief-lead{font-size:clamp(24px,2.6vw,38px);line-height:1.26;letter-spacing:-.028em;font-weight:400;
  color:#9A968E;max-width:22ch;text-wrap:balance}
.brief-lead b{font-weight:650;color:var(--text)}
.brief-lead b.crit{color:var(--red)}
.brief-sub{margin-top:20px;font-size:13.5px;line-height:1.68;color:var(--dim);max-width:66ch}
.brief-sub b{font-weight:650;color:var(--text)}
.brief-sub .nm{font-weight:700;color:var(--text)}
.brief-figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;position:relative}
.kpi-sweep{position:absolute;top:-2px;bottom:-2px;left:0;width:34%;pointer-events:none;border-radius:var(--radius);
  background:linear-gradient(90deg,transparent,rgba(240,100,69,0.055) 45%,rgba(240,100,69,0.085) 55%,transparent);
  animation:kpiSweep 1.25s cubic-bezier(.4,0,.2,1) .18s both}
@keyframes kpiSweep{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){.kpi-sweep{display:none}}
.brief-figs>div{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--lift-1);padding:20px 22px 18px;min-width:0;position:relative;
  transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s ease,border-color .18s ease}
.brief-figs>div:hover{transform:translateY(-2px);box-shadow:var(--lift-2);border-color:var(--border-strong)}
.brief-figs dt{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;font-weight:500;text-transform:none;letter-spacing:.012em;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-figs dd{font-size:36px;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  margin-top:16px;line-height:1;color:var(--text);transition:color .18s ease}
.brief-figs>div:hover dd{color:#000}
.brief-figs dd.hot{color:var(--red)} .brief-figs>div:hover dd.hot{color:var(--red)}
.brief-figs dd.d{font-size:11.5px;font-weight:450;letter-spacing:0;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line);color:var(--faint);line-height:1.45}
.brief-figs>div:hover dd.d{color:var(--faint)}
.brief-sig{grid-column:1/-1;margin-top:2px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9px;text-transform:none;letter-spacing:.012em;color:#B3AFA8}
.brief-sig b{font-weight:400;color:var(--accent);opacity:.85}

/* ---- Strata: the page is horizontal bands, not a grid of cards ---------------------------- */
.strat{grid-column:span 12;padding-top:18px}
.strat-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding-bottom:13px;border-bottom:1px solid var(--border);margin-bottom:6px}
.strat-head>span:first-child{font-size:14px;font-weight:650;letter-spacing:-.014em;color:var(--text)}
.strat-head>span:last-child{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9.5px;text-transform:none;letter-spacing:.012em;color:#B3AFA8}

/* ---- Today's calls: a priority list, so the numbers are real ------------------------------ */
.calls{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:0 44px}
.call-hit{display:grid;grid-template-columns:26px minmax(0,1fr);gap:14px;align-items:start;width:100%;
  text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 10px 16px 8px;margin-left:-8px;border-radius:8px;
  color:inherit;cursor:pointer;transition:background .14s}
.call-hit:hover{background:var(--panel-hover)}
.call-hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.call-n{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--faint);padding-top:2px}
.call.bad .call-n{color:var(--red)} .call.warn .call-n{color:var(--amber)}
.call-t{display:block;font-size:13px;line-height:1.55;font-weight:500;color:var(--text)}
.call-m{display:block;margin-top:5px;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:9px;text-transform:none;letter-spacing:.012em;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calls-more{margin-top:12px}

/* ---- The book: a roster, read down like a ledger ------------------------------------------ */
.roster{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:3px minmax(0,1.5fr) minmax(96px,1fr) 92px 86px 70px 104px 30px;gap:0 22px;align-items:center;
  width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:0 10px 0 0;min-height:62px;color:inherit;cursor:pointer;transition:background .14s}
.rrow:hover{background:var(--panel-hover)}
.rrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rtick{align-self:stretch;background:var(--idle)}
.rno{display:inline-block;min-width:1.9em;font-weight:500;font-variant-numeric:tabular-nums;opacity:.45}
.rrow.good .rtick{background:var(--green)} .rrow.warn .rtick{background:var(--amber)} .rrow.bad .rtick{background:var(--red)}
.rname{font-size:13.5px;font-weight:600;letter-spacing:-.01em;min-width:0}
.rname em{display:block;font-style:normal;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:8.5px;text-transform:none;letter-spacing:.012em;
  color:var(--faint);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkpi{font-size:17px;font-weight:650;letter-spacing:-.032em;font-variant-numeric:tabular-nums;line-height:1}
.rkpi.good{color:var(--green)} .rkpi.warn{color:var(--amber)} .rkpi.bad{color:var(--red)}
.rkpi i{display:block;font-style:normal;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:8.5px;font-weight:400;letter-spacing:.04em;
  color:var(--faint);margin-top:5px}
.rnum{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--dim);text-align:right}
.rnum s{display:block;text-decoration:none;font-size:8.5px;text-transform:none;letter-spacing:.012em;
  color:var(--faint);margin-top:4px}
.rpace{display:flex;flex-direction:column;gap:6px;min-width:0}
.rpace-bar{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;max-width:220px}
.rpace-fill{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--border-strong);opacity:1}
.rpace-fill.warn{background:var(--amber);opacity:1} .rpace-fill.bad{background:var(--red);opacity:1}
.rpace-mark{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--text);opacity:.4}

/* ======================= end wall ============================================================ */
/* ---- Arrival ---------------------------------------------------------------
   One sequence, top to bottom, the order you read the page in: masthead, then the card row, then
   the queue of things to fix. Everything starts visible-bound (`both`) and finishes in under a
   second, so the page is complete almost immediately and nothing waits on a scroll. Replayed only
   when the user changes something, never on the 60 second poll. */
@keyframes riseUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.intro .masthead{animation:riseUp .5s cubic-bezier(.2,.8,.25,1) both}

.intro .kpi-card{animation:riseUp .46s cubic-bezier(.2,.8,.25,1) both}
.intro .mod{animation:riseUp .44s cubic-bezier(.2,.8,.25,1) both}

.intro .bleed{animation:fadeIn .5s ease-out .18s both}
.intro .mod-pulse{animation-delay:.05s} .intro .mod-sites{animation-delay:.09s}
.intro .mod-wall{animation-delay:.13s} .intro .mod-queue{animation-delay:.17s} .intro .mod-detail{animation-delay:.21s}
.intro .tile{animation:fadeIn .4s ease-out both}

.intro .kpi-grid .kpi-card:nth-child(3){animation-delay:.16s} .intro .kpi-grid .kpi-card:nth-child(4){animation-delay:.21s}
.intro .kpi-grid .kpi-card:nth-child(5){animation-delay:.26s} .intro .kpi-grid .kpi-card:nth-child(6){animation-delay:.31s}
.intro .attn-item{animation:riseUp .4s cubic-bezier(.2,.8,.25,1) both}
.intro .attn-list .attn-item:nth-child(1){animation-delay:.30s} .intro .attn-list .attn-item:nth-child(2){animation-delay:.35s}
.intro .attn-list .attn-item:nth-child(3){animation-delay:.40s} .intro .attn-list .attn-item:nth-child(4){animation-delay:.45s}
.intro .attn-list .attn-item:nth-child(n+5){animation-delay:.50s}

.intro .nav-list li{animation:fadeIn .4s ease-out both}
.intro .nav-list li:nth-child(2){animation-delay:.04s} .intro .nav-list li:nth-child(3){animation-delay:.07s}
.intro .nav-list li:nth-child(4){animation-delay:.10s} .intro .nav-list li:nth-child(5){animation-delay:.13s}
.intro .nav-list li:nth-child(n+6){animation-delay:.16s}
/* Hover: the card lifts a little and its chart comes forward. Enough to say "this is a surface you

.kpi-card{transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s ease,border-color .18s ease}
.kpi-card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--lift-2)}

/* ===== v3 identity: shared with the client report ===========================================
   One system for both screens. Cool paper ground, ink text, Per4mance orange used for one job
   (what needs you / what is live), teal for spend. Bricolage Grotesque carries every figure so the
   numbers are the personality; Hanken Grotesk carries everything else. Labels are sentence case,
   because a wall of tracked capitals reads as a template, not as a point of view. */
:root{
  --bg:#F2F3EF; --bg-2:#FAFAF7; --panel:#FFFFFF; --border:#DFE1DA; --border-strong:#C9CCC3; --line:#E9EBE4;
  --ink:#101418; --text:#101418; --dim:#454B50; --faint:#6A7076;
  --accent:#FF5A1F; --accent-2:#E24710; --accent-soft:rgba(255,90,31,.10); --accent-line:rgba(255,90,31,.34);
  --red:#E24710; --red-bg:rgba(226,71,16,.10); --green:#16794F; --green-bg:rgba(22,121,79,.11);
  --lattice:transparent;
}
:root[data-theme="dark"]{ --bg:#0E1114; --bg-2:#14181C; --panel:#14181C; --border:#262C32; --border-strong:#38404A; --line:#1E2429; --accent:#FF6F3C; --lattice:transparent; }
body{font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:14px}
.disp,.kpi-value,.brief-figs dd,.pt-kpi,.brief-lead,.page-head h1,.rkpi,.pm-v{font-family:"Bricolage Grotesque","Hanken Grotesk",sans-serif!important;letter-spacing:-.03em}
.brief-lead{font-weight:500} .brief-lead b{font-weight:700}
.brief-figs dd.disp,.kpi-value{font-weight:700}

<body>
<!-- Boot screen. It is not only a title card: the desk signs in to Firebase and pulls every
     client's rows before it can draw anything, and without this the first second of the morning
     is a blank warm-white page. So the overlay holds until the app has actually painted, and the
     animation is timed to the wait rather than the wait being padded to fit the animation.
     Leaves on click, on any key, or on a hard 3.2s failsafe, whichever comes first. -->
<div id="boot" class="boot" role="presentation">
  <div class="boot-inner">
    <span class="boot-mark">4</span>
    <span class="boot-word">PER<i>4</i>MANCE</span>
    <span class="boot-sub">GURU &nbsp;&middot;&nbsp; PERFORMANCE DESK</span>
    <span class="boot-rule"><i></i></span>
  </div>
</div>
<script>
// Runs before the app bundle so the plate is interactive from the first frame: nobody should have
// to sit through a title card they have already seen because the JS that dismisses it is still
// parsing. The app hands its arrival animation to __bootReady, and it fires as the plate lifts,
// so the figures count up into view rather than behind the curtain.
(function(){
  var el=document.getElementById('boot'); if(!el) return;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  // Measured from navigation start, not from when this script happens to run. The plate paints as
  // soon as the inline CSS parses, but a still-loading webfont blocks script execution, so timing
  // the hold from here would charge the user twice for the same wait.
  var MIN=1600, MAX=3400, gone=false, reveal=null, armed=false;
  var t0=Date.now()-((window.performance&&performance.now&&performance.now())||0);
  var since=function(){ return Date.now()-t0; };
  function drop(){
    if(gone) return; gone=true;
    document.documentElement.style.overflow='';
    el.classList.add('done');
    // One frame on 100% before the lift, so the line visibly completes instead of jumping.
    setTimeout(function(){
      el.classList.add('leaving');
      try{ if(reveal) reveal(); }catch(e){}
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },700);
    }, 160);
  }
  if(reduced){ el.parentNode.removeChild(el); window.__bootReady=function(cb){ if(cb) cb(); }; return; }
  document.documentElement.style.overflow='hidden';
  // Skip: the desk gets opened all day, and the second time is already one time too many.
  var skip=function(){ drop(); };
  el.addEventListener('click',skip);
  window.addEventListener('keydown',skip,{once:true});
  // Failsafe. If the app never reports ready, because auth failed or a fetch hung, the plate must

const reduced=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// Figures count up from zero on the first paint. The number is re-formatted from the value being
// animated rather than faded in, so the digits stay tabular and the card never changes width, and
// only the first text node is touched so suffixes like "/ 31" stay put.
function countFigures(){
  if(reduced()) return;
  const els=[...root.querySelectorAll('.brief-figs dd.disp, .kpi-value')];
  els.forEach((el,i)=>{
    const node=[...el.childNodes].find(n=>n.nodeType===3&&/\d/.test(n.data));
    if(!node) return;
    const m=node.data.match(/^(\D*?)(-?[\d,]+(?:\.\d+)?)([\s\S]*)$/);
    if(!m) return;
    const pre=m[1], raw=m[2], post=m[3];
    const end=parseFloat(raw.replace(/,/g,'')); if(!isFinite(end)||Math.abs(end)>1e12) return;
    const dp=(raw.split('.')[1]||'').length, grouped=raw.includes(',');
    const fmt=(v)=>{ let t=Math.abs(v).toFixed(dp);
      if(grouped){ const[a,b]=t.split('.'); t=Number(a).toLocaleString(raw.length>7?'en-IN':'en-US')+(b?'.'+b:''); }
      return (v<0?'-':'')+t; };
    const dur=760, delay=90+i*70, t0=performance.now()+delay;
    node.data=pre+fmt(0)+post;
    const step=(t)=>{ const k=Math.max(0,Math.min(1,(t-t0)/dur)); const e=1-Math.pow(1-k,3);
      node.data=pre+fmt(end*e)+post;
      if(k<1){ requestAnimationFrame(step); } else { node.data=pre+raw+post; } };
    requestAnimationFrame(step);
  });
}
// One highlight travelling across the figure row as it lands, then gone. It is the only motion on
// the page that exists purely to be looked at, which is why it happens once and leaves no trace.
function sweepOnce(){
  if(reduced()) return;
  const row=root.querySelector('.brief-figs')||root.querySelector('.kpi-grid');
  if(!row) return;
  const s=document.createElement('i'); s.className='kpi-sweep'; row.appendChild(s);
  s.addEventListener('animationend',()=>s.remove());
}

// The card charts draw themselves left to right, so the eye follows the series in the direction it
// runs. pathLength normalises every line to 1 unit, which keeps the timing identical whatever the
// real geometry is.
function drawSparks(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  root.querySelectorAll('.kpi-spark').forEach((svg,i)=>{
    const line=svg.querySelector('polyline'), area=svg.querySelector('path'), dot=svg.querySelector('.now');
    const d=90+i*55;
    if(line){ line.style.strokeDasharray='1'; line.style.strokeDashoffset='1';
      const an=line.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:760,delay:d,easing:'cubic-bezier(.3,.8,.3,1)',fill:'forwards'});
      an.finished.then(()=>{ line.style.strokeDasharray=''; line.style.strokeDashoffset=''; }).catch(()=>{}); }
    if(area) area.animate([{opacity:0},{opacity:1}],{duration:700,delay:d+180,easing:'ease-out',fill:'both'});
    if(dot) dot.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'}],{duration:320,delay:d+620,easing:'cubic-bezier(.2,1.6,.4,1)',fill:'both'});
  });
}

// One orchestrated arrival: the headline figure counts up while the ribbon bars rise behind it.
// Anything more and the page starts performing instead of reporting.
function countUp(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach(el=>{
    const end=Number(el.getAttribute('data-count')); if(!isFinite(end)) return;
    const dur=620, t0=performance.now();
    const step=(t)=>{ const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      el.textContent=Math.round(end*e)+'%'; if(k<1) requestAnimationFrame(step); };
    el.textContent='0%'; requestAnimationFrame(step);
  });
}

function rangeBar(){ const ranges=[['today','Today'],['yesterday','Yesterday'],['7d','7d'],['14d','14d'],['30d','30d'],['MTD','MTD']]; return '<div class="seg" role="group" aria-label="Date range">'+ranges.map(r=>'<button data-act="range" data-range="'+r[0]+'" class="'+(state.range===r[0]?'on':'')+'">'+r[1]+'</button>').join('')+'</div>'; }
// A KPI card carries colour only when it means something: green, amber or red for a metric measured
// against its target. Everything else stays neutral, so a glance at the row picks out what is off
// instead of six decorative accents competing. `second` is the card's supporting metric, given its
// own labelled row rather than buried in the grey line under the number.
let METRICS={}, METRIC_N=0;
function kpi(icon,label,value,sub,tone,second,trend,fmt){
  const t=(tone==='good'||tone==='warn'||tone==='bad')?tone:'';
  let mid='';
  if(trend&&trend.some(v=>v)){ mid='m'+(++METRIC_N); METRICS[mid]={label,vals:trend,tone:t,fmt:fmt||'num',value}; }
  return '<div class="glass kpi-card'+(t?' kc-'+t:'')+(trend?' has-spark':'')+(mid?' clickable" role="button" tabindex="0" data-act="metric" data-metric="'+mid+'" title="Open the full chart':'')+'">'
    +'<div class="kpi-top"><span class="kpi-label">'+label+'</span><span class="kpi-icon'+(t?' '+t:'')+'">'+icon+'</span></div>'
    +'<div class="kpi-value disp">'+value+'</div>'
    +(sub?'<div class="kpi-sub">'+sub+'</div>':'')
    +(second?'<div class="kpi-second"><span>'+second[0]+'</span><b>'+second[1]+'</b></div>':'')
    +(trend?sparkArea(trend,t):'')
    +'</div>';
}
// The last 14 days of a metric, drawn flush to the card's lower edge. A number plus a delta says
// where you are; the shape says how you got there, which is what someone scanning actually wants.
function sparkArea(vals,tone){
  const v=(vals||[]).map(x=>isFinite(x)?x:0); if(v.length<2||!v.some(x=>x)) return '';
  const W=200,H=42,min=Math.min(...v),max=Math.max(...v),rng=(max-min)||1;
  const X=i=>i/(v.length-1)*W, Y=y=>H-4-((y-min)/rng)*(H-13);
  const pts=v.map((y,i)=>X(i).toFixed(1)+','+Y(y).toFixed(1));
  const g=tone==='good'?'sgG':tone==='warn'?'sgW':tone==='bad'?'sgB':'sgA';
  const st=tone==='good'?'var(--green)':tone==='warn'?'var(--amber)':tone==='bad'?'var(--red)':'var(--accent)';
  return '<svg class="kpi-spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<path d="M0,'+H+' L'+pts.join(' L')+' L'+W+','+H+' Z" fill="url(#'+g+')"/>'
    +'<polyline points="'+pts.join(' ')+'" pathLength="1" fill="none" stroke="'+st+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +'<circle class="now" cx="'+X(v.length-1).toFixed(1)+'" cy="'+Y(v[v.length-1]).toFixed(1)+'" r="2.6" fill="'+st+'" vector-effect="non-scaling-stroke"/></svg>';
}
// Last 14 days of one metric. `pick` chooses which daily rows count, `get` reads the number off the
// aggregate, so the same helper serves spend, orders, leads and net sales.
function series14(pick,get){
  const out=[];
  for(let d=13;d>=0;d--){ const day=addDays(D.today,-d); out.push(get(agg(D.daily.filter(r=>r.date===day&&pick(r))))||0); }
  return out;
}
// The problem goes on the first line, the thing it happened to on the second. Ad names run long and
// are the least useful part of the row, so they never push the actual issue out of sight.
// The signed-in person's first name, and the hour in the account's timezone rather than the
// viewer's, so an AM checking in from anywhere still gets the greeting for the working day.
function currentTheme(){
  try{ const t=localStorage.getItem('deskTheme'); if(t==='dark'||t==='light') return t; }catch(e){}
  return (window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';
}
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); }
function toggleTheme(){
  const next=currentTheme()==='dark'?'light':'dark';
  try{ localStorage.setItem('deskTheme',next); }catch(e){}
  applyTheme(next); render();
}

function dayPart(){
  let hr=12; try{ hr=parseInt(new Date().toLocaleString('en-US',{timeZone:TZ,hour:'2-digit',hour12:false}),10); }catch(e){}
  return hr<5?'tonight':hr<12?'this morning':hr<17?'this afternoon':'this evening';
}
function greeting(){
  let name='there';
  try{
    const raw=LIVE?(fb.auth.currentUser?.displayName||fb.auth.currentUser?.email||''):'Sid';
    const first=String(raw).split(/[@\s.]+/)[0];
    if(first) name=first.charAt(0).toUpperCase()+first.slice(1);
  }catch(e){}
  let hr=12; try{ hr=parseInt(new Date().toLocaleString('en-US',{timeZone:TZ,hour:'2-digit',hour12:false}),10); }catch(e){}
  const part=hr<5?'Late one':hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  return part+', '+name;
}

// Opening a card gives the same 14 days at a size you can actually read: a grid, a value axis,
// dated ends, and the high and low called out, since those are the two points anyone looks for.
function fmtMetric(v,f){
  const c=(D.clients&&D.clients[0])||{currency:'INR'};
  if(f==='money') return fmtMoney(v,c);
  if(f==='x') return fmtX(v);
  if(f==='pct') return fmtPct(v);
  return fmtNum(Math.round(v));
}
function metricModal(id){
  const m=METRICS[id]; if(!m) return;
  const v=m.vals.map(x=>isFinite(x)?x:0), n=v.length;
  const max=Math.max(...v), min=Math.min(...v), rng=(max-min)||1;
  const W=900,H=300,pl=72,pr=24,pt=22,pb=42,iw=(W-pl-pr)/(n-1||1),ih=H-pt-pb;

// Portfolio map. Spend across, performance against target up, so the question an agency actually
// asks at the start of a week is answered by position alone: where is the money, and is that money
// working? A client at 1.0 is exactly on its own target, which is why both ecom and lead gen can sit
// on one chart at all. Spend uses a square root scale because one account at ten times the budget
// of the rest would otherwise flatten everyone into the left edge.
function perfRatio(x){
  const t=kpiTarget(x.c); if(!t||!isFinite(x.kpi)||!x.kpi) return 0;
  return x.c.type==='ecom' ? x.kpi/t : t/x.kpi;
}

/* Portfolio tiles: every client as one tile, area = spend in the chosen range, colour = health.
   A wall screen is read from across a room, and a tile you can see is a client you can find. The
   layout is a squarified treemap, so the tiles stay close to square and the labels stay legible. */

// A tile that is too small for its text drops detail instead of letting lines pile on top of each
// other: first the spend line, then the target, and last of all the tile keeps just its name.
function fitTiles(){
  document.querySelectorAll('.ptile').forEach(t=>{
    t.classList.remove('tight','tiny'); const box=t.querySelector('.pt-in'); if(!box) return;
    const over=()=>box.scrollHeight>box.clientHeight+1||box.scrollWidth>box.clientWidth+1;
    if(over()) t.classList.add('tight');
    if(over()) t.classList.add('tiny');
  });
}
window.addEventListener('resize',()=>{ clearTimeout(window.__ft); window.__ft=setTimeout(fitTiles,120); });
function squarify(items,x,y,w,h){
  const out=[]; let rest=items.slice(); const total=rest.reduce((s,i)=>s+i.v,0)||1;
  rest.forEach(i=>i.a=i.v/total*w*h);
  const worst=(row,side)=>{ const s=row.reduce((t,i)=>t+i.a,0); let mx=0,mn=1e18; row.forEach(i=>{mx=Math.max(mx,i.a);mn=Math.min(mn,i.a);}); return Math.max(side*side*mx/(s*s), s*s/(side*side*mn)); };
  while(rest.length){
    const side=Math.min(w,h); let row=[rest[0]], i=1;
    while(i<rest.length && worst(row.concat(rest[i]),side)<=worst(row,side)){ row.push(rest[i]); i++; }
    const s=row.reduce((t,r)=>t+r.a,0);
    if(w>=h){ const rw=s/h; let cy=y; row.forEach(r=>{ const rh=r.a/rw; out.push({it:r,x:x,y:cy,w:rw,h:rh}); cy+=rh; }); x+=rw; w-=rw; }
    else { const rh=s/w; let cx=x; row.forEach(r=>{ const rw=r.a/rh; out.push({it:r,x:cx,y:y,w:rw,h:rh}); cx+=rw; }); y+=rh; h-=rh; }
    rest=rest.slice(row.length);
  }
  return out;
}
/* Target rule, one definition for the list and the flyout. dev is how far the client is from its own

   with no target, or no spend in the range, has nothing to be measured against and stays grey. */

  const c=x.c, t=kpiTarget(c), v=x.kpi, isE=c.type==='ecom';
  if(!t) return {tone:'none',dev:null,word:'No target set'};

(function(){
  let panel=null, shown=null, pinned=false, tHide=null, tShow=null;
  function ensure(){ if(panel) return panel; panel=document.createElement('aside'); panel.className='pflyout'; panel.setAttribute('aria-label','Client KPI card'); document.body.appendChild(panel);
    panel.addEventListener('mouseenter',()=>clearTimeout(tHide));
    panel.addEventListener('mouseleave',()=>{ if(!pinned) hideSoon(); });
    panel.addEventListener('click',e=>{ if(e.target.closest('[data-pl-close]')) close(); });
    return panel; }
  function open(id,pin){ const o=window.__pl&&window.__pl[id]; if(!o) return; ensure(); clearTimeout(tHide);
    if(shown!==id||!panel.classList.contains('open')){ panel.innerHTML=plCardHTML(o); shown=id; }
    panel.className='pflyout open '+o.r.tone;
    document.querySelectorAll('.prow.on').forEach(r=>r.classList.remove('on'));
    const row=document.querySelector('.prow[data-pl="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]'); if(row) row.classList.add('on');
    if(pin) pinned=true; }
  function close(){ pinned=false; shown=null; if(panel) panel.className='pflyout'; document.querySelectorAll('.prow.on').forEach(r=>r.classList.remove('on')); }
  function hideSoon(){ clearTimeout(tHide); tHide=setTimeout(()=>{ if(!pinned) close(); },220); }
  const canHover=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
  document.addEventListener('mouseover',e=>{ if(!canHover) return; const r=e.target.closest&&e.target.closest('.prow'); if(!r) return;
    clearTimeout(tShow); clearTimeout(tHide); tShow=setTimeout(()=>{ if(!pinned||shown!==r.dataset.pl) open(r.dataset.pl,false); },70); });
  document.addEventListener('mouseout',e=>{ const r=e.target.closest&&e.target.closest('.prow'); if(!r) return; clearTimeout(tShow);
    if(!pinned && !(e.relatedTarget&&e.relatedTarget.closest&&(e.relatedTarget.closest('.prow')||e.relatedTarget.closest('.pflyout')))) hideSoon(); });
  document.addEventListener('click',e=>{ const r=e.target.closest&&e.target.closest('.prow');
    if(r){ open(r.dataset.pl,true); return; }
    if(panel&&panel.classList.contains('open')&&!e.target.closest('.pflyout')) close(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  window.__plRefresh=function(){ if(!panel||!shown) return; const o=window.__pl&&window.__pl[shown]; if(o) panel.innerHTML=plCardHTML(o); else close(); };
})();
function portfolioMap(list,spec){

// The Pulse. The whole book drawn as one continuous trace, one heartbeat per account, in spend
// order. Beat height is that account's share of spend, so the big clients are the loud beats. The
// colour of each beat is its health. An account with budget but no spend flatlines, which is
// exactly what a flatline should mean. A scan line sweeps the trace the way a monitor does.
//
// It is a real reading, not an ornament: rhythm shows concentration (a few tall beats means the
// book leans on a few accounts), and colour shows whether the loud beats are the healthy ones.
function pulseTrace(list){
  const pts=list.filter(x=>x.c.budget||x.cur.spend);
  if(!pts.length) return '';
  const W=1000,H=96,mid=H*0.58,n=pts.length,seg=W/n;

  const SHAPE=[[0,0],[.10,0],[.18,.13],[.26,0],[.38,-.16],[.48,1],[.57,-.34],[.65,0],[.78,.24],[.90,0],[1,0]];
  let paths='',beats='';
  pts.forEach((x,i)=>{
    const amp=Math.sqrt(x.cur.spend/maxSpend)*(H*0.42);
    const col=x.health==='good'?'var(--green)':x.health==='warn'?'var(--amber)':'var(--red)';
    const x0=i*seg;
    const d=SHAPE.map(([t,v],k)=>(k?'L':'M')+(x0+t*seg).toFixed(1)+','+(mid-v*amp).toFixed(1)).join(' ');
    paths+='<path class="beat" pathLength="1" d="'+d+'" stroke="'+col+'"/>';
    beats+='<rect class="beat-hit" x="'+x0.toFixed(1)+'" y="0" width="'+seg.toFixed(1)+'" height="'+H+'" data-act="nav" data-client="'+x.c.id+'">'
      +'<title>'+esc(x.c.name)+' · '+fmtMoney(x.cur.spend,x.c)+(x.cur.spend?'':' (flatline: budget set, nothing spent)')+' · '+(x.health==='good'?'on target':x.health==='warn'?'watch':'off target')+'</title></rect>';
  });
  const flat=pts.filter(x=>!x.cur.spend).length;
  return '<div class="pulse-wrap">'
    +'<svg class="pulse" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Every account as one heartbeat, height by spend, colour by health">'
      +'<line class="pulse-base" x1="0" x2="'+W+'" y1="'+mid+'" y2="'+mid+'"/>'
      +paths
      +'<defs><clipPath id="pClip"><rect x="0" y="0" width="'+W+'" height="'+H+'"/></clipPath></defs>'
      +'<g clip-path="url(#pClip)"><rect class="sweep" x="0" y="0" width="'+(W*0.34).toFixed(0)+'" height="'+H+'"/></g>'
      +beats
    +'</svg></div>';
}


// One root cause, one line. Meta reports a delivery problem once per ad, so a single broken
// setting (a lost Instagram connection, a rejected payment method) arrives as dozens of identical
// rows carrying different ad names. A list of 63 rows that all say the same thing gets scrolled
// past; one row that says "47 ads, one fix" gets acted on. Grouping keys on the cause sentence
// with the ad-name path and any dates stripped out, so only genuinely different problems separate.
function causeText(f){
  let t=String(f.text||'');
  // Only entity delivery issues carry an ad name path. Site checks, pacing and KPI misses are
  // already written as sentences, so they pass through untouched ("7-day ROAS ..." stays whole).
  if(f.type!=='delivery') return t;
  // Meta states the real reason after "with issues,". Everything before it is the ad name path.
  const m=t.match(/with issues,\s*(.+)$/i);
  if(m) t=m[1];
  else{
    // Ad names are pipe-joined paths ending in a date: "PG | FIRVT | RAGLAN | 9-Mar-26 - <reason>".
    if(t.includes('|')) t=t.slice(t.lastIndexOf('|')+1);
    t=t.replace(/^\s*[\dA-Za-z]{1,4}[-\/.][\dA-Za-z]{1,9}(?:[-\/.][\dA-Za-z]{1,4})?\s*[-–]\s*/,'');
  }
  t=t.replace(/^\s*(delivery|copy|video|image)\s*[:\-–]\s*/i,'');
  t=t.replace(/\s+/g,' ').replace(/^[\s,:|\-–]+/,'').trim();
  return t?cap(t):String(f.text||'');
}
function causeKey(f){
  return causeText(f).replace(/\b\d[\d,.\-\/]*\b/g,'#').replace(/\s+/g,' ').trim().toLowerCase().slice(0,90);
}
function groupFlags(list){
  const by=new Map();
  list.forEach(f=>{
    const k=(f.id||'')+'|'+f.sev+'|'+(f.type||'')+'|'+causeKey(f);
    const g=by.get(k);
    if(g){ g.n++; if(f.meta&&g.names.length<2&&!g.names.includes(f.meta)) g.names.push(f.meta); }
    else by.set(k,{...f,text:causeText(f),n:1,names:f.meta?[f.meta]:[]});
  });
  return [...by.values()];
}
function groupMeta(g,client){
  const bits=[];
  if(client) bits.push(String(client).replace(' (sample)',''));
  if(g.n>1) bits.push(g.n+' ads affected · one fix clears all');
  if(g.names.length) bits.push(g.names[0]+(g.n>g.names.length?' +'+(g.n-1)+' more':''));
  else if(g.n===1&&g.meta) bits.push(g.meta);
  return bits.join(' · ');
}
function attnItem(sev,meta,text,clientId){
  const cls=sev==='bad'?'red':sev==='info'?'info':'';
  return '<div class="attn-item '+cls+'">'+(sev==='info'?ICONS.info:ICONS.alert)

    +(clientId?'<button class="btn btn-ghost btn-small go" data-act="nav" data-client="'+clientId+'">Open</button>':'')+'</div>';
}

  const hist=sw.history||[]; if(hist.length) h+='<div class="frow"><h3>Last '+hist.length+' checks</h3><span class="faint small">'+Math.round(hist.filter(k=>k.ok).length/hist.length*100)+'% passing · oldest on the left</span></div><div class="uptime">'+hist.map(k=>'<i class="'+(k.ok?'':'fail')+'" title="'+esc(dt(k.at))+(k.failed&&k.failed.length?': '+esc(k.failed.join(', ')):'')+'"></i>').join('')+'</div>';
  return h+'</div>';
}
function clientUpdateText(x){
  const c=x.c, isE=c.type==='ecom', y=x.yest, l7=x.last7, p7=x.prev7; const d=addDays(D.today,-1); const dateLabel=parseInt(d.slice(8),10)+' '+MON[+d.slice(5,7)-1];
  const sign=(v)=>(v>=0?'+':'')+Math.round(v)+'%'; const chg=(a,b,inv)=>b?sign(((a-b)/b*100)*(inv?-1:1)):'';
  const lines=[`*${c.name}* update for ${dateLabel}`,'',`Ad spend: ${fmtMoney(y.spend,c)}`];
  if(isE){ if(y.hasShop){ lines.push(`Orders: ${fmtNum(y.orders)} (${fmtMoney(y.netSales,c)} net sales, AOV ${fmtMoney(y.aov,c)})`); lines.push(`MER: ${fmtX(y.mer)} | Platform ROAS: ${fmtX(y.roas)}`); lines.push(`CPA: ${fmtMoney(y.cpa,c)}${y.cac?' | CAC: '+fmtMoney(y.cac,c):''}`); } else { lines.push(`Purchases: ${fmtNum(y.purchases)} (${fmtMoney(y.revenue,c)} revenue)`); lines.push(`ROAS: ${fmtX(y.roas)} | CPA: ${fmtMoney(y.cpa,c)}`); }
    lines.push('',`Last 7 days: ROAS ${fmtX(l7.roas)} (${chg(l7.roas,p7.roas)} vs previous week), ${fmtNum(l7.salesCount)} ${l7.hasShop?'orders':'purchases'} on ${fmtMoney(l7.spend,c)} spend`); }
  else { lines.push(`Leads: ${fmtNum(y.leads)} | CPL: ${fmtMoney(y.cpl,c)} (target ${fmtMoney(kpiTarget(c),c)})`); lines.push('',`Last 7 days: ${fmtNum(l7.leads)} leads at ${fmtMoney(l7.cpl,c)} CPL (${chg(l7.cpl,p7.cpl,true)} vs previous week)`); }
  const top=(x.ads||[]).filter(a=>a.status==='Scale'||a.status==='Steady').sort((a,b)=>b.spend-a.spend)[0]; if(top) lines.push(`Top creative: ${top.name} (${isE?fmtX(top.spend?top.revenue/top.spend:0)+' ROAS':fmtMoney(top.leads?top.spend/top.leads:Infinity,c)+' CPL'}, 30 days)`);
  lines.push('','Pacing: '+fmtMoney(x.mtd.spend,c)+' of '+fmtMoney(c.budget,c)+' this month ('+Math.round(x.paceRatio*100)+'% of plan)');
  const act=x.flags.filter(f=>f.sev!=='info').slice(0,3); if(act.length){ lines.push('','Working on:'); act.forEach(f=>lines.push('- '+f.text)); }
  return lines.join('\n'); }

/* client dashboards: the secret report link per client, listed for the team to copy and send */
function reportLink(id){ const t=(D.reportTokens||{})[id]; return t?new URL('report.html',location.href).href.split('#')[0]+'#'+t:''; }
function linkReady(c){ const sy=(D.syncs||{})[c.id]||{}; return !!reportLink(c.id)&&!!sy.meta?.ok&&(c.type!=='ecom'||!!sy.shopify?.ok); }
function showLinks(onlyId){
  const list=D.clients.filter(c=>!onlyId||c.id===onlyId).slice().sort((a,b)=>(linkReady(b)-linkReady(a))||a.name.localeCompare(b.name));
  const ready=list.filter(linkReady).length;
  let h='<div class="box" style="max-width:760px"><h2 class="disp">Client dashboards</h2><div class="empty-note" style="padding:0 0 10px">'+(onlyId?'One secret link for this client. Anyone with it sees this client only, results without campaign detail.':ready+' of '+list.length+' clients are complete (Meta synced'+', and Shopify for ecom). Each link shows that client only and carries Per4mance Guru branding.')+'</div><div style="max-height:56vh;overflow:auto">';
  list.forEach(c=>{ const u=reportLink(c.id), ok=linkReady(c);
    h+='<div class="row" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line,#ddd)"><span class="hdot '+(ok?'good':'warn')+'"></span><span style="flex:1;min-width:0"><b>'+esc(c.name)+'</b><br><span class="faint" style="font-size:11px">'+(ok?'Complete':u?'Link exists, data incomplete':'No link yet, run a sync')+'</span></span>'
      +(u?'<button class="btn btn-ghost btn-small" data-act="copylink" data-url="'+esc(u)+'">Copy link</button><a class="btn btn-primary btn-small" href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'</div>'; });
  h+='</div><div class="row" style="margin-top:12px"><button class="btn btn-ghost btn-small" data-act="closemodal">Close</button>'+(onlyId?'':'<button class="btn btn-primary btn-small" data-act="copyalllinks">Copy all complete links</button>')+'</div></div>';
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=h; document.body.appendChild(m);
  m._text=list.filter(linkReady).map(c=>c.name+': '+reportLink(c.id)).join('\n');
}
function showUpdate(x){ const text=clientUpdateText(x); const m=document.createElement('div'); m.className='modal'; m.innerHTML='<div class="box"><h2 class="disp">Client update, ready to paste</h2><textarea class="upd" id="updText"></textarea><div class="row"><button class="btn btn-ghost btn-small" data-act="closemodal">Close</button><button class="btn btn-primary btn-small" data-act="copytext">Copy</button></div></div>'; document.body.appendChild(m); m.querySelector('#updText').value=text; navigator.clipboard?.writeText(text).then(()=>toast('Update copied to clipboard')).catch(()=>{}); }

/* command palette */
const cmdk=document.getElementById('cmdk'), cmdkInput=document.getElementById('cmdkInput'), cmdkResults=document.getElementById('cmdkResults'); let cmdkSel=0;
function cmdkItems(q){ q=(q||'').toLowerCase(); const items=[{label:'Command Center',hint:'overview',run:()=>go(null)}]; (D?D.clients:[]).forEach(c=>items.push({label:c.name,hint:c.type==='ecom'?'ecom':c.type==='app'?'app':'leads',run:()=>go(c.id),dot:S[c.id]?.health})); items.push({label:'Client dashboards (links)',hint:'action',run:()=>showLinks()}); if(state.view==='client') items.push({label:'Copy client update',hint:'action',run:()=>showUpdate(S[state.clientId])}); ['today','yesterday','7d','14d','30d','MTD'].forEach(r=>items.push({label:'Range: '+r,hint:'action',run:()=>{state.range=r;render();}})); if(LIVE) items.push({label:'Refresh data',hint:'action',run:()=>boot(true)}); return items.filter(i=>!q||i.label.toLowerCase().includes(q)).slice(0,12); }
function openCmdk(){ cmdk.classList.add('open'); cmdkInput.value=''; cmdkSel=0; renderCmdk(); setTimeout(()=>cmdkInput.focus(),10); }
function closeCmdk(){ cmdk.classList.remove('open'); }
function renderCmdk(){ const items=cmdkItems(cmdkInput.value); cmdkResults.innerHTML=items.map((it,i)=>'<button class="cmdk-result '+(i===cmdkSel?'sel':'')+'" data-i="'+i+'">'+(it.dot?'<span class="hdot '+it.dot+'"></span>':ICONS.grid)+'<span>'+esc(it.label)+'</span><span class="hint">'+esc(it.hint)+'</span></button>').join('')||'<div class="empty-note">Nothing matches.</div>'; cmdkResults._items=items; }
cmdkInput.addEventListener('input',()=>{cmdkSel=0;renderCmdk();});
cmdkInput.addEventListener('keydown',e=>{ const items=cmdkResults._items||[]; if(e.key==='ArrowDown'){cmdkSel=Math.min(items.length-1,cmdkSel+1);renderCmdk();e.preventDefault();} else if(e.key==='ArrowUp'){cmdkSel=Math.max(0,cmdkSel-1);renderCmdk();e.preventDefault();} else if(e.key==='Enter'){ if(items[cmdkSel]){closeCmdk();items[cmdkSel].run();} } else if(e.key==='Escape') closeCmdk(); });
cmdkResults.addEventListener('click',e=>{ const b=e.target.closest('.cmdk-result'); if(!b) return; const it=(cmdkResults._items||[])[+b.dataset.i]; if(it){closeCmdk();it.run();} });
cmdk.addEventListener('click',e=>{ if(e.target===cmdk) closeCmdk(); });

/* events */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const act=el.dataset.act;
  if(act==='nav'){ e.preventDefault(); go(el.dataset.client||null); }
  else if(act==='range'){ state.range=el.dataset.range; render(); }
  else if(act==='plrange'){ state.plRange=el.dataset.r; render(); }
  else if(act==='plsort'){ const k=el.dataset.k, p=state.plSort; state.plSort=p.key===k?{key:k,dir:p.dir==='asc'?'desc':'asc'}:{key:k,dir:k==='name'?'asc':(k==='dev'?'asc':'desc')}; render(); }
  else if(act==='tab'){ state.tab=el.dataset.tab; render(); }
  else if(act==='crf'){ if(!el.disabled){ state.crf=el.dataset.crf; render(); } }
  else if(act==='play'){
    // Swapped in place rather than opened in a modal: the row's numbers stay next to the video,
    // which is the whole reason for watching it here instead of in Ads Manager.
    // Same service the Sync now button talks to, so nothing new has to be configured. syncUrl is
    // sometimes given with the /sync path on it, so the base is taken back off it.

    el.replaceWith(v);
    v.src=api.replace(/\/$/,'')+'/r/'+encodeURIComponent(el.dataset.tok)+'/v/'+encodeURIComponent(el.dataset.ad);
  }
  else if(act==='ovview'){ state.ovView=el.dataset.v; render(); }
  else if(act==='toggleinfo'){ state.showInfo=!state.showInfo; render(); }
  else if(act==='toggle'){ e.stopPropagation(); const id=el.dataset.id; if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id); render(); }
  else if(act==='sort'){ const so=state.sort[el.dataset.table]; if(so.key===el.dataset.key) so.dir=so.dir==='asc'?'desc':'asc'; else {so.key=el.dataset.key;so.dir=['name','title','health','type','platform','learning','format','status','items','source','discount'].includes(el.dataset.key)?'asc':'desc'} render(); }
  else if(act==='update'){ showUpdate(S[state.clientId]); }
  else if(act==='clientlink'){ showLinks(state.clientId); }
